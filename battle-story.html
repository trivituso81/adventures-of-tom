<style>
/* The storybook battle screen, mock (card c-b3story, plan claude/b3story-plan.md). This CSS is the look spec; the JS beside it is not the implementation.
   Every frame is CSS: parchment, ink edge, a double gold rule, ribbons cut with clip-path. No painted piece is used (the plan lists what the Art Library would paint). */
@font-face{font-family:'Fraunces';src:url('battle-story/fraunces.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'Figtree';src:url('fonts/figtree.woff2?v=menu1') format('woff2');font-weight:300 900;font-display:swap}
:root{
  --paper:#f7edd3;--paper2:#ecdbb2;--paperhi:#fffaf0;--ink:#2b1a10;--ink2:#5a3d24;--edge:#5b3a1e;--rule:#c9a35f;--goldhi:#ffe39a;--gold:#f2b632;--gold2:#b9810c;
  --plum:#6c3f8c;--green:#2f7d3c;--greenhi:#d9f0d2;--coral:#b4402c;--coralhi:#fbe0d8;--lamp:#fff0bf;--shadow:0 3px 0 rgba(30,15,5,.55),0 7px 16px rgba(0,0,0,.42);
  --disp:'Fraunces',Georgia,serif;--text:'Figtree',system-ui,sans-serif;
  --fs:15px;--fss:13px;--row:44px;--k:1;
  --sat:0px;--sar:0px;--sab:0px;--sal:0px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a130d}
body.app{font-family:var(--text);color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:#1a130d}
#app.big{--fs:16px;--fss:14px;--row:48px}
#tools,#cards,#strips{position:absolute}
#strips{left:0;top:0;width:0;height:0;z-index:20}
#turns{z-index:22}#tools{z-index:24}#plate{z-index:21}#combo,#cards{z-index:21}
/* ---------- scene ---------- */
#scene{position:absolute;overflow:hidden;z-index:0}
#bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#units{position:absolute;inset:0}
.u{position:absolute;transition:left .32s ease,top .32s ease,height .32s,filter .3s;pointer-events:auto}
.u img{display:block;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 6px 5px rgba(0,0,0,.45));pointer-events:none}
.u.ko img{filter:grayscale(1) brightness(.75) drop-shadow(0 4px 4px rgba(0,0,0,.4));transform:translateY(-18%) rotate(-90deg);transform-origin:50% 100%}
.u.ghost{opacity:.35}
.u.shake img{animation:shake .42s}
.u.lunge{animation:lunge .62s ease-in-out}
.u.cast img{animation:cast .6s}
@keyframes shake{0%,100%{transform:none}15%{transform:translateX(-11px) rotate(-2deg)}35%{transform:translateX(9px) rotate(2deg)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
@keyframes lunge{45%{transform:translateX(var(--lx,-160px))}100%{transform:none}}
@keyframes cast{50%{transform:translateY(-12px)}}
.ring{position:absolute;border-radius:50%;border:3px solid var(--gold);box-shadow:0 0 0 2px rgba(60,30,0,.6),0 0 14px var(--gold);pointer-events:none}
.ring.ally{border-color:#fff3c4}
.ring.act{border-color:#fff3c4;border-width:2px;box-shadow:0 0 0 1.5px rgba(60,30,0,.5),0 0 10px #fff3c4;opacity:.85}
.ring.dash{border-style:dashed}
.arrow{position:absolute;width:26px;height:22px;margin-left:-13px;pointer-events:none;animation:bob .9s ease-in-out infinite alternate;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6))}
.arrow:before{content:"";position:absolute;inset:0;background:var(--gold);clip-path:polygon(0 0,100% 0,50% 100%);border:0}
.arrow:after{content:"";position:absolute;left:4px;right:4px;top:2px;bottom:6px;background:var(--goldhi);clip-path:polygon(0 0,100% 0,50% 100%)}
@keyframes bob{to{transform:translateY(6px)}}
.stars{position:absolute;pointer-events:none;width:70px;height:26px;margin-left:-35px}
.stars i{position:absolute;top:0;width:16px;height:16px;background:#ffe27a;clip-path:polygon(50% 0,62% 38%,100% 38%,69% 60%,80% 100%,50% 76%,20% 100%,31% 60%,0 38%,38% 38%);animation:orbit 1.4s linear infinite}
.stars i:nth-child(2){animation-delay:-.47s}.stars i:nth-child(3){animation-delay:-.93s}
@keyframes orbit{0%{left:0;top:10px;transform:scale(.7)}25%{left:27px;top:0;transform:scale(1)}50%{left:54px;top:10px;transform:scale(.7)}75%{left:27px;top:18px;transform:scale(.5)}100%{left:0;top:10px;transform:scale(.7)}}
.floor{position:absolute;border-radius:50%;border:3px dashed var(--goldhi);background:radial-gradient(rgba(255,227,122,.28),rgba(255,227,122,.05) 70%);pointer-events:none;animation:glow 1.2s ease-in-out infinite alternate}
#units .flab{position:absolute;transform:translate(-50%,-50%);z-index:960;padding:3px 9px;border-radius:8px;background:var(--paper);border:2px solid var(--edge);box-shadow:var(--shadow);font:700 13px/1.2 var(--text);white-space:nowrap;pointer-events:none}
.floor{background:radial-gradient(rgba(255,227,122,.5),rgba(255,227,122,.18) 70%)!important;border-width:4px}
@keyframes glow{to{background:radial-gradient(rgba(255,227,122,.42),rgba(255,227,122,.1) 70%)}}
.pop{position:absolute;font:800 calc(30px*var(--k))/1 var(--disp);color:#fff7dc;text-shadow:0 2px 0 #3a1f0b,0 0 3px #3a1f0b,0 0 10px rgba(0,0,0,.8);pointer-events:none;animation:pop 1.1s forwards;white-space:nowrap}
.pop.heal{color:#e3ffd8}
#sheet{display:none;z-index:45;padding:14px 16px 12px}
#sheet.on{display:block}
#sheet h4{margin:0 0 6px;font:800 calc(20px*var(--k))/1.1 var(--disp)}
#sheet .er,#endp .er{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;border-top:1px solid var(--rule);font:600 var(--fs)/1.3 var(--text);text-align:left}
#sheet .cont{margin-top:10px;min-height:46px;width:100%;border-radius:23px;background:var(--ink);color:var(--paper);font:800 calc(17px*var(--k))/1 var(--text)}
.pop.stay{animation:none;opacity:1}
#probe{position:fixed;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.8)}18%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-44px)}}
#shade{position:absolute;pointer-events:none;opacity:0;transition:opacity .2s;background:radial-gradient(closest-side,rgba(20,10,4,.2),rgba(20,10,4,.12) 60%,rgba(20,10,4,0))}
#shade.on{opacity:1}
/* ---------- parchment panel ---------- */
.pn{position:absolute;background:linear-gradient(180deg,var(--paper),var(--paper2));border:2px solid var(--edge);border-radius:9px;
  box-shadow:inset 0 0 0 2px #fbf4df,inset 0 0 0 3px var(--rule),var(--shadow)}
.pn.orn:before,.pn.orn:after{content:"";position:absolute;width:9px;height:9px;background:var(--rule);border:1.5px solid var(--edge);transform:rotate(45deg);top:-6px}
.pn.orn:before{left:12px}.pn.orn:after{right:12px}
/* ---------- turn bar (a scroll with rolled ends) ---------- */
#turns{display:flex;align-items:center;gap:calc(6px*var(--k));padding:0 18px;border-radius:4px}
#turns .roll{position:absolute;top:-5px;bottom:-5px;width:13px;border-radius:7px;border:2px solid var(--edge);background:linear-gradient(90deg,#c9a46a,#fbf0d4 40%,#b48a4a)}
#turns .roll.l{left:-8px}#turns .roll.r{right:-8px}
.tf{position:relative;flex:none;width:calc(38px*var(--k));height:calc(38px*var(--k));border-radius:50%;border:2px solid var(--edge);background:#f3e6c3;overflow:visible}
.tf img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
.tf.foe{border-color:#7a2a1d}
.tf.now{width:calc(48px*var(--k));height:calc(48px*var(--k));border-color:var(--gold2);box-shadow:0 0 0 3px var(--gold)}
.tf.ghost{opacity:.6;border-style:dashed;border-color:var(--ink2)}
.tf.pushed{box-shadow:0 0 0 3px var(--coral)}
.tf .bd{position:absolute;right:-6px;top:-6px;min-width:20px;height:20px;border-radius:10px;background:var(--coral);color:#fff;font:800 13px/20px var(--text);text-align:center;border:1.5px solid #fff;padding:0 4px}
.tf .bd.f{background:#e7a019}
.tf.ko img{filter:grayscale(1)}
.rnd{flex:none;align-self:stretch;margin:-4px 2px -14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px 8px 14px;background:linear-gradient(#c8432f,#8f2a1c);color:#fff4df;
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);font:700 13px/1.05 var(--text);text-align:center;min-width:52px}
.rnd b{display:block;font:800 calc(20px*var(--k))/1 var(--disp)}
.tl{flex:none;font:700 13px/1.1 var(--text);color:var(--ink2);max-width:82px}
/* ---------- tools ---------- */
#tools{display:flex;gap:7px}
#tools .tb{position:relative;min-height:44px;min-width:50px;padding:0 12px;display:flex;align-items:center;gap:7px;font:700 var(--fs)/1 var(--text);color:var(--ink);text-decoration:none}
.tg{width:36px;height:20px;border-radius:10px;background:#8a7a64;position:relative;border:1.5px solid var(--edge)}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#fff;transition:left .15s}
.tg.on{background:var(--green)}.tg.on:after{left:19px}
#tools .tb.mock{border-style:dashed;background:#e9e2f5;box-shadow:var(--shadow)}
#tools .tb .str{position:absolute;left:50%;top:-14px;width:2px;height:14px;background:#7a5a3a}
/* ---------- monster strips and the plate ---------- */
.ms{position:absolute;padding:3px 5px 4px;cursor:pointer;border-radius:7px;min-height:44px}
.ms .nm{display:flex;gap:4px;align-items:baseline;font:700 var(--fss)/1.15 var(--text)}
.ms .nt{overflow:hidden;text-overflow:clip}
.ms .dm{flex:none;padding:0 6px;border-radius:8px;background:#3b220f;color:#fff3cf;font:800 13px/18px var(--text)}
.ms .dm.pv{background:#7a5200;box-shadow:0 0 0 1.5px var(--gold)}
.ms .lt,.pl .lt{flex:none;display:inline-block;min-width:19px;height:19px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 12.5px/19px var(--text);text-align:center}
.hp{height:8px;border-radius:4px;background:rgba(43,26,16,.22);overflow:hidden;border:1px solid rgba(43,26,16,.45)}
.hp u{display:block;height:100%;background:linear-gradient(#6cc277,#2f8a3f);transition:width .45s}
.hp.low u{background:linear-gradient(#f08c74,#b4402c)}
.pips{display:inline-flex;gap:3px;align-items:center;vertical-align:middle}
.pip{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff1b8,#c98a0c);border:1.5px solid var(--edge)}
.pip.gone{background:rgba(43,26,16,.18);border-color:rgba(43,26,16,.4)}
.pip.go{animation:pippulse .6s infinite alternate;box-shadow:0 0 0 2.5px var(--coral)}
@keyframes pippulse{to{transform:scale(1.3)}}
.ms .ln{display:flex;gap:4px;align-items:center;margin-top:3px;flex-wrap:wrap;font-size:12.5px;line-height:1.2}
.ms .hp{flex:1;min-width:30px}
.ms.tgt{background:linear-gradient(var(--lamp),#f5dd95);box-shadow:inset 0 0 0 2px #fbf4df,inset 0 0 0 3px var(--gold),0 0 0 2px var(--gold),var(--shadow)}
.ms.noaim{opacity:.92}
.fl{display:inline-flex;align-items:center;gap:3px;padding:0 6px 0 2px;border-radius:9px;border:1.5px solid var(--edge);font:600 12.5px/17px var(--text);white-space:nowrap}
.fl svg{width:15px;height:15px;flex:none}
.fl.big{font-size:13px}
.sc{display:inline-block;padding:0 6px;border-radius:8px;font:700 12.5px/17px var(--text);background:rgba(43,26,16,.1);border:1px solid rgba(43,26,16,.3);white-space:nowrap}
.sc.bad{background:var(--coralhi);border-color:var(--coral);color:#7a2414}
.sc.good{background:var(--greenhi);border-color:var(--green);color:#1f5a29}
.sc.gold{background:#ffe9a8;border-color:var(--gold2);color:#5a3a00}
.pl{padding:8px 12px 9px;display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:4px;align-items:center}
.pl .top{display:flex;gap:7px;align-items:center;font:700 calc(17px*var(--k))/1.1 var(--disp);min-width:0}
.pl .top span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .hl{display:flex;gap:7px;align-items:center;font-size:var(--fss)}
.pl .hl .hp{flex:1;height:10px}
.pl .rw{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:var(--fss);line-height:1.25}
.pl .lab{font-weight:700;color:var(--ink2)}
.pl>*{grid-column:1}
.pl .fc{grid-column:2;grid-row:1/4;display:flex;flex-direction:column;align-items:center;gap:4px}
.dring{width:calc(56px*var(--k));height:calc(56px*var(--k));border-radius:50%;background:radial-gradient(#4a2f1d,#2b1a10);border:3px solid var(--gold);color:#fff3cf;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 0 2px var(--edge),0 3px 6px rgba(0,0,0,.4)}
.dring b{font:800 calc(20px*var(--k))/1 var(--disp)}
.dring.rng b{font-size:calc(15px*var(--k))}
.dring span{font:600 12.5px/1.1 var(--text)}
.dring.heal{background:radial-gradient(#2f6b37,#1f4a26)}
.fcl{grid-column:1/-1;display:flex;gap:4px;flex-wrap:wrap}
.pl .note{grid-column:1/-1;font:600 var(--fss)/1.3 var(--text);color:var(--ink2)}
.pl.side .top{font-size:calc(16px*var(--k))}
.wind{position:absolute;padding:3px 9px;font:700 var(--fss)/1.2 var(--text);color:#fff;background:linear-gradient(#c8432f,#8f2a1c);border:2px solid #4a160c;border-radius:6px;box-shadow:var(--shadow);white-space:nowrap;pointer-events:none}
.wind b{font-weight:800}
/* ---------- the bar ---------- */
#bar{display:none;flex-direction:column;gap:2px;padding:7px 8px 5px;z-index:30;overflow:visible}
#bar.show{display:flex;animation:barin .24s ease-out}
#bar.fold{display:flex;animation:barout .15s ease-in forwards}
@keyframes barin{from{opacity:0;transform:translateX(var(--from,40px)) scale(.97)}to{opacity:1;transform:none}}
@keyframes barout{to{opacity:0;transform:scale(.94) translateX(10px)}}
#bar .tail{position:absolute;right:-15px;width:16px;height:24px;margin-top:-12px;top:var(--tail,40px);background:var(--edge);clip-path:polygon(0 0,100% 50%,0 100%)}
#bar .tail:after{content:"";position:absolute;left:0;top:3px;width:11px;height:18px;background:var(--paper2);clip-path:polygon(0 0,100% 50%,0 100%)}
#bar.up .tail{right:auto;left:var(--tailx,50%);top:auto;bottom:-15px;width:24px;height:16px;margin:0 0 0 -12px;clip-path:polygon(0 0,100% 0,50% 100%)}
#bar.up .tail:after{left:3px;top:0;width:18px;height:11px;clip-path:polygon(0 0,100% 0,50% 100%)}
#bar>*,#bar .scr>*{flex:none}
#bar .more{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);padding:2px 10px;border-radius:9px;background:var(--ink);color:var(--paper);font:700 12.5px/16px var(--text);pointer-events:none;box-shadow:0 2px 4px rgba(0,0,0,.4)}
#bar .scr{display:flex;flex-direction:column;gap:2px;overflow-y:auto;overflow-x:visible;margin:0 -8px;padding:8px 8px 2px;scrollbar-width:thin;overscroll-behavior:contain}
.ribbon{align-self:flex-start;position:relative;margin:-21px 0 0 -16px;padding:5px 20px 6px 16px;background:linear-gradient(#a3542c,#7a3519);color:#fff3d8;
  font:800 calc(19px*var(--k))/1 var(--disp);letter-spacing:.2px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 50%,100% 100%,0 100%,8px 50%);text-shadow:0 1px 0 #3a1608;white-space:nowrap}
.ribbon small{font:600 13px/1 var(--text);margin-left:7px;opacity:.95}
.grp{font:700 var(--fss)/1.2 var(--text);color:var(--ink2);padding:3px 4px 0;display:flex;align-items:center;gap:6px}
.grp:after{content:"";flex:1;height:1px;background:var(--rule)}
.grp.free{color:var(--green)}
.row{position:relative;display:grid;grid-template-columns:26px 1fr auto;column-gap:7px;align-items:center;min-height:var(--row);padding:3px 8px;
  background:var(--paperhi);border:1.5px solid #c7ab76;border-radius:7px;cursor:pointer;text-align:left;width:100%}
.row .ic{grid-row:1/3;width:26px;height:26px;align-self:center}
.row .ic svg{width:26px;height:26px;display:block}
.row .ic .em{font-size:24px;line-height:26px}
.row .nm{font:700 var(--fs)/1.15 var(--text);grid-column:2;grid-row:1;min-width:0}
.row .kd{font:500 12.5px/1.2 var(--text);color:var(--ink2);min-width:0}
.row .nm{grid-column:2/4!important}
.row .l2{grid-column:2/4;grid-row:2;display:flex;align-items:center;gap:6px;justify-content:space-between;min-width:0}
.row .rt{display:flex;align-items:center;gap:4px;flex:none}
.pp{font:700 12.5px/1 var(--text);padding:3px 6px;border-radius:9px;background:var(--plum);color:#fff;white-space:nowrap}
.pp.gain{background:var(--green)}
.pp.free{background:var(--green)}
.pp.combo{background:#9b6a08}
.tag{font:700 12.5px/1 var(--text);padding:2px 5px;border-radius:5px;border:1.5px solid var(--coral);color:#8e2a17;background:#fff6f2;white-space:nowrap}
.tag.rec{border-color:var(--green);color:#1f5a29;background:#effae9}
.row.poor .nm,.row.poor .ic,.row.poor .kd{opacity:.6}
.row .why{grid-column:2/4;grid-row:4;font:600 12.5px/1.2 var(--text);color:#8e2a17}
.row .ln1{grid-column:2/4;grid-row:3;font:500 var(--fss)/1.3 var(--text);color:var(--ink);display:none}
.row .use{grid-column:3;grid-row:3;align-self:center;justify-self:end;display:none;margin:0 0 0 6px;min-height:44px;min-width:66px;padding:0 12px;border-radius:22px;flex-direction:column;gap:1px!important;background:var(--ink);color:var(--paper);font:800 var(--fs)/1 var(--text);align-items:center;justify-content:center;gap:8px}
.row .use small{font:600 12.5px/1 var(--text);opacity:.8}
.row .use[disabled]{background:#b8a98c;color:#3e2e1c}
.det .row .ln1{display:block;color:var(--ink2)}
.row.basic{border:2px solid var(--edge);background:linear-gradient(#fffaf0,#f3e5c4)}
.row.basic .bt{position:absolute;left:10px;top:-8px;padding:0 6px;font:800 12.5px/16px var(--text);color:var(--paper);background:var(--edge);border-radius:4px}
.row.basic.hi .bt{left:20px}
.row.combo{background:linear-gradient(#fff4cc,#f6d77b);border-color:var(--gold2)}
.row.free{border-color:var(--green)}
.row.hi{background:linear-gradient(#fff1c0,#f9d777);border-color:var(--gold2);box-shadow:0 0 0 2px var(--gold),0 3px 6px rgba(90,60,0,.35);margin:2px -12px;width:calc(100% + 24px);padding:6px 20px;
  clip-path:polygon(0 -14px,100% -14px,100% 0,calc(100% - 9px) 50%,100% 100%,0 100%,9px 50%,0 0);border-radius:0}
.row.hi .ln1{display:block;color:var(--ink);grid-column:2}
.row.hi .use{display:flex}
#bar .keys{font:600 12.5px/1.2 var(--text);color:var(--ink2);text-align:center}
/* ---------- caption, combo, cards, end ---------- */
#caption{padding:8px 14px;font:700 var(--fs)/1.3 var(--text);text-align:center;display:none;z-index:25}
#caption.on{display:block;animation:capin .18s ease-out}
#caption small{display:block;font:600 var(--fss)/1.3 var(--text);color:var(--ink2)}
@keyframes capin{from{opacity:0;transform:translateY(6px)}}
#combo{padding:4px 12px 3px;display:flex;flex-direction:column;justify-content:center;gap:2px}
#combo .ct{display:flex;align-items:center;gap:9px;font:800 var(--fs)/1 var(--disp)}
#combo .trk{flex:none;height:14px;}
#combo.cmp .trk{flex:1}
#combo .trk{border-radius:7px;background:linear-gradient(#3a2414,#5a3a20);position:relative;overflow:hidden;border:1.5px solid var(--edge);box-shadow:inset 0 2px 3px rgba(0,0,0,.5)}

<script>
// The storybook battle screen, tappable mock (card c-b3story; plan claude/b3story-plan.md). NOT the game: no battle engine, fixed sample numbers.
// Real data: move names, prices, flavors, short lines, descriptions, statuses and monsters come from the game's data files (data/b3-*.js), loaded
// by the page; the words the screen adds come from data/b3-ux-words.js. The layout and the look are the spec; this code is not the implementation.
'use strict';
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const HP0={grace:115,tom:132,rose:115,deedee:115,tnb:115,nara:115};       // level 2 (B3_LEVELS) with the Guard lean on Tom
const INCH={grace:50,tom:71,rose:40,deedee:65,tnb:70,nara:42};               // data/heights.json
const DMG={light:14,standard:22,heavy:34,capstone:48};                       // sample damage by the size word
const PCT={tiny:.05,small:.10,standard:.20,party:.15};
const EMO={clobber:'\u{1F44A}',sizzle:'\u{1F525}',drench:'\u{1F4A6}',razzle:'✨',racket:'\u{1F4E3}',support:'\u{1F917}'};  // Rose Mode pictures (engine/b3-pictures.js)
const BGS={pond:['bgs/01-pond-town.webp','Pond'],night:['bgs/08-moon-club-dome.webp','Night'],indoor:['bgs/06-library-reading-room.webp','Indoor, dark'],bright:['bgs/03-school-classroom.webp','Indoor, bright']};
const W=B3_FORECAST;
const T=ms=>new Promise(r=>setTimeout(r,ms/(S&&S.speed||1)));
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const fill=(t,o)=>t.replace(/\{(\w+)\}/g,(m,k)=>o[k]!=null?o[k]:m);

// ---------------------------------------------------------------- kits and moves
function kit(id){const c=B3_CAST[id],vs=c.vibes.map(v=>B3_VIBES[v]);const pri=vs.find(v=>v.sig===1),sec=vs.find(v=>v.sig===2);
  return {id,name:c.name,pri,sec,basic:B3_SKILLS[pri.basic],priSk:pri.skills.map(s=>B3_SKILLS[s]).filter(Boolean),secSk:sec.skills.map(s=>B3_SKILLS[s]).filter(Boolean)};}
const KIT={};for(const id of Object.keys(HP0))KIT[id]=kit(id);
const RUCK={
  ruckus_double:{id:'ruckus_double',name:'Double Team',slot:'ruckus',pep:0,combo:50,power:'standard',hits:2,target:'foe',effects:[{op:'damage'}],short:B3_RUCKUS.double.short,desc:B3_RUCKUS.double.desc},
  ruckus_full:{id:'ruckus_full',name:'Family Ruckus',slot:'ruckus',pep:0,combo:100,power:'capstone',hits:2,target:'foe',composure:2,effects:[{op:'damage'}],short:B3_RUCKUS.full.short,desc:B3_RUCKUS.full.desc}};
const sk=id=>RUCK[id]||B3_SKILLS[id];
const partner=()=>{const t=S.turn.slice(1).find(x=>x[0]==='m'&&!S.mem[x.slice(2)].ko);return t?t.slice(2):S.actor;};
function flavs(s){if(s.slot==='ruckus'){const a=[].concat(KIT[S.actor].basic.flavor),b=[].concat(KIT[partner()].basic.flavor);return [...new Set(a.concat(b))];}return [].concat(s.flavor||[]);}
function aimKind(s){const t=s.target;
  if(t==='foe'||t==='foe_row'||t==='either')return 'foe'; if(t==='all_foes')return 'all'; if(t==='random_foes')return 'random';
  if(t==='ally'||t==='family'||t==='family_or_ko')return 'mem'; if(t==='ko_ally')return 'ko'; if(t==='field')return 'floor';
  if(t==='adjacent_allies')return 'near'; if(t==='ally_pair')return 'pair';
  if(t==='self')return (s.effects||[]).some(e=>e.to==='allies')?'family':'self'; return 'foe';}
const kindWord=s=>s.slot==='ruckus'?fill(W.withP,{p:B3_CAST[partner()].name}):(s.id==='pick_me_up'?B3_KIND.revive:B3_KIND[s.slot]||'');
const flavWord=s=>flavs(s).map(f=>B3_FLAVORS[f].name).join(' and ');

// ---------------------------------------------------------------- state
let S=null;
const PREF={det:Q.get('det')==='1',rose:Q.get('rose')==='1',bg:BGS[Q.get('bg')]?Q.get('bg'):'pond',speed:1};   // the switches survive a change of state
function mem(id,o){return Object.assign({id,hp:HP0[id],max:HP0[id],pep:4,ko:false,st:[],marked:false,next:false,shield:0},o||{});}
function foe(key,id,row,o){const F=B3_FOES[id];const hp=F.hp3||F.hp;return Object.assign({key,id,row,hp,max:hp,pips:F.pips||0,maxPips:F.pips||0,st:(F.start||[]).slice(),wind:null,flu:false},o||{});}
const ONE=()=>[foe('A','bigone','front',{hp:418})];
const FIVE=()=>[foe('A','mudling','front'),foe('B','grump','front'),foe('C','toad','front'),foe('D','skeeter','back'),foe('E','log','back')];
const FOUR=['grace','tom','rose','deedee'];                      // standing order, left to right (Deedee stands in the Back row)
const ORDER={grace:0,tom:1,deedee:2,rose:3,tnb:1,nara:2};       // turn order of the mock fight
function base(o){
  const party=o.party||FOUR,m={};for(const id of party)m[id]=mem(id);
  const s={party,mem:m,foes:o.foes||ONE(),turn:o.turn||null,actor:o.actor||party[0],round:2,roundAt:4,combo:30,hi:null,aim:null,lastFoe:null,free:null,
    det:PREF.det,rose:PREF.rose,bg:PREF.bg,phase:'turn',speed:PREF.speed,look:null,sheet:null,caption:'',cap2:'',
    pops:[],state:o.id||'start',keys:false,prev:null};
  if(!s.turn){const foes=s.foes.map(f=>'f:'+f.key),ms=party.map(id=>'m:'+id),out=[];
    // the order of a round: family and monsters interleaved, the acting member first
    ms.sort((x,y)=>ORDER[x.slice(2)]-ORDER[y.slice(2)]);const a=ms.indexOf('m:'+s.actor),rot=ms.slice(a).concat(ms.slice(0,a));
    let fi=0;rot.forEach((t,i)=>{out.push(t);if(i===1&&foes[fi])out.push(foes[fi++]);if(i===2&&foes[fi])out.push(foes[fi++]);});
    while(fi<foes.length)out.push(foes[fi++]);s.turn=out;}
  s.cycle=s.turn.slice();s.roundAt=s.turn.length;
  return s;
}
const STATES=[
  {id:'start',n:'One monster, Grace’s turn',d:'The Basic is highlighted when a turn opens; it is aimed already.',f(){S=base({id:'start'});}},
  {id:'tom',n:'Tom’s turn',d:'The bar has moved to Tom: he steps to the front spot and the bar opens on the monsters’ side.',f(){S=base({id:'tom',actor:'tom'});S.mem.grace.pep=6;}},
  {id:'deedee',n:'Deedee’s turn',d:'Deedee stands in the Back row; she steps to the same front spot, so the bar has one place.',f(){S=base({id:'deedee',actor:'deedee'});S.combo=42;}},
  {id:'five',n:'Five monsters (3 Front, 2 Back)',d:'Each monster has a strip under it; the aimed one’s full plate sits bottom left.',f(){S=base({id:'five',foes:FIVE()});}},
  {id:'aim_one',n:'Aimed at one monster',d:'Crunchy Sugar-Cube Pop on The Big One: the forecast is on the plate.',f(){S=base({id:'aim_one'});S.mem.grace.pep=5;S.hi='crunchy_sugar_cube_pop';}},
  {id:'aim_all',n:'Aimed at every monster',d:'Open-String Violin Screech: every strip shows its own damage; the plate sums it up.',f(){S=base({id:'aim_all',foes:FIVE()});S.hi='open_string_violin_screech';}},
  {id:'aim_mem',n:'Aimed at one family member',d:'Deedee Makes It Better on Tom: the forecast sits on his card.',f(){S=base({id:'aim_mem',actor:'deedee'});S.mem.tom.hp=71;S.mem.tom.st=['drenched'];S.hi='deedee_makes_it_better';S.aim={k:'mem',id:'tom'};}},
  {id:'aim_fam',n:'Aimed at the whole family',d:'Sofa-Cushion Citadel: every card shows the shield it gets.',f(){S=base({id:'aim_fam',actor:'rose'});S.mem.rose.pep=5;S.hi='sofa_cushion_citadel';}},
  {id:'aim_floor',n:'Aimed at the floor',d:'Wet-Floor Hazard: the monsters’ floor glows where it goes; no aim needed.',f(){S=base({id:'aim_floor',actor:'deedee',foes:FIVE()});S.hi='wet_floor_hazard';}},
  {id:'windup',n:'Winding up, Rose marked',d:'The Big One glared at Rose: Swamp Chomp comes next. Crunchy Sugar-Cube Pop cancels it.',f(){S=base({id:'windup'});const b=S.foes[0];b.wind={name:'Swamp Chomp',at:'rose'};S.mem.rose.marked=true;S.mem.grace.pep=5;S.hi='crunchy_sugar_cube_pop';}},
  {id:'status',n:'Statuses, and a Flustered monster',d:'Log Lump is out of Composure (Flustered); the others carry statuses.',f(){S=base({id:'status',actor:'tom',foes:FIVE()});const f=S.foes;
    f[0].st=['drenched','windexed'];f[1].st=['dazzled'];f[2].st=['off_key'];f[4].pips=0;f[4].flu=true;f[4].st=['mossy_brace'];S.aim={k:'foe',key:'E'};S.hi='controller_toss';S.mem.tom.st=['eyes_on_me'];}},
  {id:'combo65',n:'Combos 65%: Double Team',d:'At 50% a Double Team joins the top of the list, with the partner named.',f(){S=base({id:'combo65',actor:'tom'});S.combo=65;S.hi='ruckus_double';}},
  {id:'combo100',n:'Combos 100%: Family Ruckus',d:'At 100% the Family Ruckus is offered too.',f(){S=base({id:'combo100',actor:'deedee'});S.combo=100;S.hi='ruckus_full';}},
  {id:'ko',n:'Rose knocked out: Pick-Me-Up',d:'Pick-Me-Up appears for everyone; it aims at Rose’s card.',f(){S=base({id:'ko',actor:'tom'});S.mem.rose.ko=true;S.mem.rose.hp=0;S.mem.tom.pep=5;S.hi='pick_me_up';}},
  {id:'free',n:'A free Skill (from Grace)',d:'Grace’s Colossal Diamond-Gold Dumpling: Deedee may use one Skill of 4 Pep or less, free, now.',f(){S=base({id:'free',actor:'deedee'});S.free={from:'grace',max:4};S.mem.deedee.pep=5;S.hi='hand_me_my_glasses_scrub';}},
  {id:'playing',n:'A move playing, with the battle text',d:'The bar folds away while a move plays; one caption line says what happened.',f(){S=base({id:'playing'});S.phase='playing';S.caption='Grace uses Crunchy Sugar-Cube Pop!';S.cap2='Racket is a Pet Peeve: Composure down 1.';S.foes[0].hp=397;S.foes[0].pips=5;S.mem.grace.pep=1;S.combo=42;S.pops=[{at:'f:A',t:'-21'}];}},
  {id:'end',n:'End of the fight',d:'What the win paid, and Continue.',f(){S=base({id:'end'});S.foes[0].hp=0;S.foes[0].out=true;S.phase='end';}},
  {id:'nara',n:'A party of three with Nara',d:'Tom, TNB and Nara. Nara is short: the bar still sits beside her, its tail at her head.',f(){S=base({id:'nara',party:['tom','tnb','nara'],actor:'nara'});S.combo=20;}},
];
function setState(id){const st=STATES.find(x=>x.id===id)||STATES[0];st.f();S.state=st.id;
  if(!S.hi&&S.phase==='turn')S.hi=startHi();if(S.hi&&!S.aim)S.aim=defaultAim(sk(S.hi));
  render(true);}

// ---------------------------------------------------------------- the list of moves for the acting member
function list(){
  const k=KIT[S.actor],out=[];

// ---------------------------------------------------------------- playing a turn
async function useMove(id){
  if(S.phase!=='turn')return;const s=sk(id);if(!s||whyNot(s))return;
  const a=S.actor,m=S.mem[a],k=aimKind(s),af=aimedFoes(),am=aimedMems();
  S.phase='playing';const bar=$('bar');bar.classList.remove('show');bar.style.animation='';bar.classList.add('fold');$('shade').classList.remove('on');
  await T(150);bar.className='pn';
  S.caption=`${B3_CAST[a].name} uses ${s.name}!`;S.cap2='';render();
  const fig=$('fig-'+a);if(fig){if(af.length&&basePower(s)){const p=foePos(S.g)[af[0].key],fp=famPos(S.g)[a];fig.style.setProperty('--lx',Math.round((p.cx+p.w*.3)-fp.cx)+'px');fig.classList.add('lunge');}else fig.classList.add('cast');}
  await T(360);
  m.pep=Math.max(0,Math.min(10,m.pep-cost(s)+gain(s)));if(s.slot==='ruckus')S.combo-=s.combo;else S.combo=Math.min(100,S.combo+12);
  const notes=[];S.pops=[];
  for(const f of af){const c=fcFoe(s,f);if(c.dmg){f.hp=Math.max(0,f.hp-c.dmg);S.pops.push({at:'f:'+f.key,t:'-'+c.dmg});}
    if(c.pips){f.pips=Math.max(0,f.pips-c.pips);if(f.pips===0){f.flu=true;notes.push(W.brk+' '+B3_FOES[f.id].name+' is Flustered.');}}
    if(c.peeve&&af.length===1)notes.push(fill(W.peeveTag,{})+'!');if(c.cancel){notes.push(f.wind.name+' is cancelled.');f.wind=null;for(const id of S.party)S.mem[id].marked=false;}
    if(c.push)notes.push(B3_FOES[f.id].name+' is pushed back.');}
  for(const id of am){const mm=S.mem[id];for(const t of fcMem(s,mm)){const n=parseInt(t[1].replace(/\D/g,''));if(/HP/.test(t[1])&&n){mm.hp=Math.min(mm.max,mm.hp+n);S.pops.push({at:'m:'+id,t:'+'+n,heal:1});}
    if(t[1]===W.revive){mm.ko=false;mm.hp=Math.round(mm.max*.25);}if(/^Clears/.test(t[1]))mm.st=[];}}
  if(k==='floor')notes.push(s.name+' is on the floor.');
  S.cap2=notes.slice(0,2).join(' ');S.free=null;render();
  af.forEach(f=>{const u=document.querySelector(`.u.foe[data-foe="${f.key}"]`);if(u)u.classList.add('shake');});
  await T(1100);
  for(const f of S.foes){if(f.hp<f.max*.15){f.hp=f.max;f.pips=f.maxPips;f.flu=false;}}   // the mock fight never ends: a nearly beaten monster is topped up
  S.pops=[];next(s);
}
function next(s){
  const a=S.turn.shift();S.turn.push(a);S.roundAt--;if(S.roundAt<=0){S.round++;S.roundAt=S.turn.length;}
  const t=S.turn[0];
  if(t[0]==='f'){S.prev=S.actor;foeTurn(foeBy(t.slice(2)));return;}
  S.prev=S.actor;S.actor=t.slice(2);if(S.mem[S.actor].ko){next(null);return;}
  S.phase='turn';S.look=null;S.sheet=null;S.caption='';S.hi=startHi();S.aim=defaultAim(sk(S.hi));render();showBar('slide');
}
async function foeTurn(f){
  if(!f||f.out){next(null);return;}
  const F=B3_FOES[f.id];S.phase='playing';
  let act=(F.acts||[]).find(x=>x.power>0)||{name:'a swipe'},tgt=S.party.filter(id=>!S.mem[id].ko)[0];
  if(f.wind){act={name:f.wind.name};tgt=f.wind.at;f.wind=null;S.mem[tgt].marked=false;}
  const m=S.mem[tgt],d=18;m.hp=Math.max(1,m.hp-d);S.caption=`${F.name} uses ${act.name} on ${B3_CAST[tgt].name}.`;S.cap2='';S.pops=[{at:'m:'+tgt,t:'-'+d}];render();
  const u=$('fig-'+tgt);if(u)u.classList.add('shake');
  await T(1300);S.pops=[];next(null);
}

// ---------------------------------------------------------------- input
function pick(id){if(S.phase!=='turn')return;S.look=null;S.sheet=null;if(S.hi===id)return;S.hi=id;S.aim=defaultAim(sk(id));if(S.aim.key)S.lastFoe=S.aim.key;render();}
function tapFoe(key){if(S.phase!=='turn')return;const f=foeBy(key);if(!f||f.out)return;const s=S.hi&&sk(S.hi),k=s&&aimKind(s);S.sheet=null;
  if(k==='foe'||(s&&s.target==='either')){S.aim={k:'foe',key};S.lastFoe=key;S.look=null;}else S.look={f:key};render();}
function tapMem(id){if(S.phase!=='turn')return;const s=S.hi&&sk(S.hi),k=s&&aimKind(s),m=S.mem[id];S.look=null;
  const ok=(k==='mem'&&(s.target==='family_or_ko'||!m.ko)&&(s.target!=='ally'||id!==S.actor))||(k==='ko'&&m.ko)||(k==='pair'&&!m.ko)||(s&&s.target==='either'&&!m.ko);
  if(ok){S.aim={k:k==='pair'?'pair':'mem',id};S.sheet=null;}else S.sheet={m:id};render();}
function stepAim(d){const s=S.hi&&sk(S.hi);if(!s)return;const k=aimKind(s);
  if(k==='foe'){const l=liveFoes();let i=l.findIndex(f=>f.key===(S.aim&&S.aim.key));i=(i+d+l.length)%l.length;tapFoe(l[i].key);}
  else if(k==='mem'||k==='ko'||k==='pair'){const l=S.party;let i=l.indexOf(S.aim&&S.aim.id);for(let n=0;n<l.length;n++){i=(i+d+l.length)%l.length;const before=S.aim&&S.aim.id;tapMem(l[i]);if(S.aim&&S.aim.id!==before)break;S.sheet=null;}render();}}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#mockp')){const b=t.closest('[data-st],[data-sw]');if(!b)return;if(b.dataset.st){S=null;setState(b.dataset.st);}else{const [k,v]=b.dataset.sw.split(':');
    if(k==='det')S.det=PREF.det=v==='1';if(k==='rose'){S.rose=PREF.rose=v==='1';if(S.phase==='turn'){S.hi=startHi();S.aim=defaultAim(sk(S.hi));}}if(k==='bg')S.bg=PREF.bg=v;render(true);}return;}
  if(t.closest('[data-mock]')){$('mockp').classList.toggle('on');renderMock();return;}
  if(t.closest('[data-det]')){S.det=PREF.det=!S.det;render(true);return;}
  if(t.closest('[data-speed]')){S.speed=PREF.speed=S.speed===1?2:1;render(true);return;}
  if(t.closest('[data-close]')){S.sheet=null;render(true);return;}
  if(t.closest('[data-cont]')){S=null;setState('start');return;}
  const u=t.closest('[data-use]');if(u){if(!u.disabled)useMove(u.dataset.use);return;}
  const r=t.closest('.row');if(r){S.keys=false;pick(r.dataset.sk);return;}
  const pl=t.closest('#plate');if(pl&&pl.dataset.foe&&S.look&&S.look.f){S.sheet={f:S.look.f};render(true);return;}
  const f=t.closest('[data-foe]');if(f){tapFoe(f.dataset.foe);return;}
  const m=t.closest('[data-mem]');if(m){tapMem(m.dataset.mem);return;}
});
document.addEventListener('keydown',e=>{if(!S||S.phase!=='turn')return;const ms=moves(),i=ms.findIndex(s=>s.id===S.hi);S.keys=true;
  if(e.key==='ArrowDown'||e.key==='s'){pick(ms[Math.min(ms.length-1,i+1)].id);e.preventDefault();}
  else if(e.key==='ArrowUp'||e.key==='w'){pick(ms[Math.max(0,i-1)].id);e.preventDefault();}
  else if(e.key==='ArrowLeft'||e.key==='a')stepAim(-1);else if(e.key==='ArrowRight'||e.key==='d')stepAim(1);
  else if(e.key==='Enter'||e.key===' '){useMove(S.hi);e.preventDefault();}else return;render();});
function renderMock(){const el=$('mockp');if(!el.classList.contains('on'))return;
  const sw=(k,v,l,on)=>`<button type="button" data-sw="${k}:${v}" class="${on?'on':''}">${l}</button>`;
  el.innerHTML=`<h4>Mock: states</h4><div class="sg">${STATES.map(s=>`<button type="button" data-st="${s.id}" class="${S.state===s.id?'on':''}">${esc(s.n)}</button>`).join('')}</div>`
    +`<h4>Details</h4><div class="sg">${sw('det',0,'Off',!S.det)}${sw('det',1,'On',S.det)}</div><h4>Rose Mode</h4><div class="sg">${sw('rose',0,'Off',!S.rose)}${sw('rose',1,'On',S.rose)}</div>`
    +`<h4>Background</h4><div class="sg">${Object.entries(BGS).map(([k,v])=>sw('bg',k,v[1],S.bg===k)).join('')}</div>`;
  const g=S.g;el.style.right=(g.W-g.x1)+'px';el.style.top=(g.y0+52)+'px';}
function startApp(){
  const ids=Object.keys(HP0).concat(['bigone','mudling','skeeter','grump','toad','log']);
  Promise.all(ids.map(id=>new Promise(r=>{const i=new Image();i.onload=()=>{ratio[id]=i.naturalWidth/i.naturalHeight;r();};i.onerror=r;i.src=`battle-story/${id}.webp`;}))).then(()=>{
    setState(Q.get('st')||'start');document.body.classList.add('ready');});
  addEventListener('resize',()=>{if(S)render(true);});
}
window.__STORY={get S(){return S},STATES,setState,useMove,pick,tapFoe,tapMem,render,geo,moves,list,fcFoe,famPos,foePos};

</script>
<script>
function startViewer(){
  const DEV=[
    {id:'duo',n:'Duo unfolded, sideways',s:'951 x 648',w:951,h:648,q:'',c:'The main screen. The scene keeps the whole screen; the moves open beside whoever is up.'},
    {id:'desk',n:'Desktop',s:'1440 x 900',w:1440,h:900,q:'',c:'The same layout, bigger type. Click works like a tap; the arrow keys and Enter work too.'},
    {id:'fold-up',n:'Duo folded, upright',s:'466 x 657',w:466,h:657,q:'',c:'Upright: the one exception to the overlay. The same list docks under the scene.'},
    {id:'fold-side',n:'Duo folded, sideways',s:'678 x 445',w:678,h:445,q:'',c:'Short screen: the list scrolls, the highlighted move stays in view.'},
    {id:'ip-up',n:'iPhone, upright',s:'393 x 852',w:393,h:852,q:'&safe=54,0,34,0',c:'The bands at the top and bottom are the iPhone’s own (clock, home bar).'},
    {id:'ip-side',n:'iPhone, sideways',s:'852 x 393',w:852,h:393,q:'&safe=0,50,21,50',c:'Short screen with the iPhone’s side margins. The list scrolls.'}];
  let cur=0,st='start',det=0,rose=0,bg='pond';
  const $=id=>document.getElementById(id),fr=$('fr'),dev=$('dev');
  const BG=[['pond','Pond'],['night','Night'],['indoor','Indoor, dark'],['bright','Indoor, bright']];
  function fit(){const D=DEV[cur],aw=$('stage').clientWidth-16,ah=Math.max(380,innerHeight*.78),k=Math.min(1,aw/D.w,ah/D.h);
    dev.style.width=D.w+'px';dev.style.height=D.h+'px';dev.style.transform='scale('+k+')';$('stage').style.height=(D.h*k+16)+'px';}
  function draw(){
    const D=DEV[cur];
    $('tabs').innerHTML=DEV.map((d,i)=>`<button class="${i===cur?'on':''}" data-d="${i}">${d.n}<small>${d.s}</small></button>`).join('');
    $('states').innerHTML=window.__STORY.STATES.map(s=>`<button class="${s.id===st?'on':''}" data-s="${s.id}">${s.n}</button>`).join('');
    const sw=(k,v,l,on)=>`<button class="${on?'on':''}" data-w="${k}:${v}">${l}</button>`;
    $('sws').innerHTML=`<span class="lab">Details</span>${sw('det',0,'Off',!det)}${sw('det',1,'On',det)}<span class="lab">Rose Mode</span>${sw('rose',0,'Off',!rose)}${sw('rose',1,'On',rose)}<span class="lab">Background</span>${BG.map(b=>sw('bg',b[0],b[1],bg===b[0])).join('')}`;
    $('sdesc').textContent=(window.__STORY.STATES.find(s=>s.id===st)||{}).d||'';
    const u=`?frame=1&bare=1&st=${st}&det=${det}&rose=${rose}&bg=${bg}${D.q}`;if(fr.dataset.u!==u+D.id){fr.dataset.u=u+D.id;fr.src=location.pathname+u;}
    $('cap').textContent=D.c;fit();}
  document.addEventListener('click',e=>{const b=e.target.closest('[data-d],[data-s],[data-w]');if(!b)return;
    if(b.dataset.d!=null)cur=+b.dataset.d;else if(b.dataset.s)st=b.dataset.s;else{const [k,v]=b.dataset.w.split(':');if(k==='det')det=+v;if(k==='rose')rose=+v;if(k==='bg')bg=v;}draw();});
  addEventListener('resize',fit);draw();
}
(function(){
  const q=new URLSearchParams(location.search),small=innerWidth<1000||innerHeight<700;
  const app=q.has('frame')||(!q.has('notes')&&small);
  if(app){document.body.classList.add('app');document.getElementById('appwrap').hidden=false;startApp();}
  else{document.getElementById('viewer').hidden=false;startViewer();}
})();

</script>
