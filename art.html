<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14122b">
<title>Art Library</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#14122b;color:#f4f1ff;font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;background:#14122b;border-bottom:1px solid #2c2852;z-index:5}
header h1{font-size:20px;margin:0;flex:1}
a.back{color:#ffd34d;text-decoration:none;font-weight:600;padding:10px 4px}
main{max-width:760px;margin:0 auto;padding:12px 16px 120px}
.card{background:#1d1a3d;border:1px solid #2c2852;border-radius:14px;padding:12px 14px;margin:0 0 12px;content-visibility:auto;contain-intrinsic-size:auto 760px}
label{display:block;font-size:13px;color:#b9b3e6;margin:8px 0 6px}
input[type=password],input[type=text],textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #3a3566;background:#0f0d24;color:#fff;font:inherit;font-size:16px}
textarea{min-height:150px;resize:vertical;line-height:1.35;font-size:14px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;min-height:44px;background:#3a3566;color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.45}
button.gold{background:#ffd34d;color:#241b00}
button.small{min-height:36px;padding:6px 11px;font-size:14px;border-radius:10px}
button.good{background:#2f9e63}button.bad{background:#b4414f}button.armed{outline:2px solid #ffd34d}
.hint{color:#b9b3e6;font-size:13px}.err{color:#ff8b97;font-size:13px;white-space:pre-wrap}.ok{color:#7be0a6}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tab{flex:none;border-radius:16px;border:1px solid #3a3566;background:#0f0d24;color:#d9d4ff;padding:6px 14px;min-height:36px;font-weight:500}
.tab.on{background:#7b6cff;border-color:#a89dff;color:#fff}
.chip{font-size:12px;border-radius:10px;padding:2px 9px;background:#2c2852;color:#d9d4ff}
.refs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.ref{width:84px;font-size:11px;color:#b9b3e6;text-align:center}
.ref img{width:84px;height:84px;object-fit:contain;background:#0f0d24;border:1px solid #3a3566;border-radius:8px;display:block}
.ref input{margin-top:4px}
.ownadd{display:inline-block;background:#3a3566;color:#fff;border-radius:10px;padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;margin:2px 0 6px}
.res{display:flex;gap:8px;overflow-x:auto;padding:6px 0}
.res>div{flex:none;width:156px;text-align:center;font-size:11px;color:#b9b3e6}
.res img{width:156px;height:156px;object-fit:contain;background:#0f0d24;border:1px solid #3a3566;border-radius:8px;display:block;margin-bottom:4px}
.res .acts{display:flex;gap:6px;margin-top:6px}.res .acts button{flex:1;padding:4px 2px;min-height:40px;font-size:12px;border-radius:9px}
/* UX rebuild (CHANGES 110): setup fold, search, filters, groups, one-line rows */
input[type=search]{width:100%;padding:12px;border-radius:10px;border:1px solid #3a3566;background:#0f0d24;color:#fff;font:inherit;font-size:16px;margin:0 0 10px}
.tab.dim{opacity:.4}
.tabs.fil .tab{min-height:34px;padding:4px 12px;font-size:14px}
.grp{margin:0 0 10px}
.gh{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#26224d;border:1px solid #3a3566;border-radius:12px;min-height:50px;padding:8px 12px}
.gh .gc{margin-left:auto;font-weight:400;font-size:12px;color:#b9b3e6;text-align:right}
.car{flex:none;width:9px;height:9px;border-right:2px solid #b9b3e6;border-bottom:2px solid #b9b3e6;transform:rotate(-45deg);transition:transform .12s}
.open>.car,.ih[aria-expanded=true] .car{transform:rotate(45deg)}
.gbody{border:1px solid #2c2852;border-radius:12px;overflow:hidden;margin:6px 0 0}
.item+.item{border-top:1px solid #2c2852}
.ih{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#1d1a3d;border-radius:0;min-height:52px;padding:8px 12px;font-weight:500}
.ih .it{flex:1;min-width:0;display:block;line-height:1.3}
.ih .why{display:block;font-weight:400;font-size:12px;color:#b9b3e6;margin-top:2px}
.dot{flex:none;width:11px;height:11px;border-radius:50%;background:#7b6cff}
.s-wait .dot,.c-wait{background:#ffd34d}.s-approved .dot{background:#2f9e63}.s-rejected .dot{background:#b4414f}.s-blocked .dot{background:#6b6790}
.c-wait{color:#241b00}.c-approved{background:#2f9e63;color:#fff}.c-rejected{background:#b4414f;color:#fff}.c-blocked{background:#2c2852;color:#9a95c8}
.s-blocked .it{color:#9a95c8}
.ih .chip{flex:none}
.item>.card{margin:0;border:0;border-radius:0;border-top:1px solid #2c2852;background:#17152f}
.blk{background:#3a2a44;border:1px solid #6b4a66;border-radius:10px;padding:8px 10px;margin:4px 0 8px;font-size:14px}
.ref img.miss{border-style:dashed;color:#b9b3e6;font-size:11px;padding:4px;overflow:hidden}
#setupbar{padding:6px 12px}
#big{position:fixed;inset:0;background:#000e;display:none;align-items:center;justify-content:center;z-index:20}
#big img{max-width:100%;max-height:100%;object-fit:contain}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#ffd34d;color:#241b00;padding:10px 16px;border-radius:12px;font-weight:600;display:none;z-index:30;max-width:90%}
/* Computer layout (CHANGES 112): at 1000 px and wider the controls sit in a left column that stays in view, the list fills the rest. Phone layout is unchanged. */
@media (min-width:1000px){
main{max-width:1680px;display:grid;grid-template-columns:400px minmax(0,1fr);grid-template-rows:1fr auto;column-gap:28px;padding:18px 28px 140px}
.side{grid-column:1;grid-row:1;align-self:start;position:sticky;top:76px;max-height:calc(100vh - 160px);overflow-y:auto;scrollbar-width:thin;padding-right:4px}
#list{grid-column:2;grid-row:1/3;min-width:0}
.foot{grid-column:1;grid-row:2;align-self:end}
header{padding:10px 28px}
}
@media (min-width:1000px){
.tabs{flex-wrap:wrap;overflow:visible}
.card{contain-intrinsic-size:auto 420px}
.item>.card{padding:16px 20px}
textarea{min-height:230px;font-size:15px}
.res{flex-wrap:wrap;overflow:visible;gap:14px}
.res>div{width:260px;font-size:12px}.res img{width:260px;height:260px;cursor:zoom-in}
.refs{gap:12px}.ref{width:112px}.ref img{width:112px;height:112px}
#big{cursor:zoom-out}
.item .row select{width:auto;min-width:110px}
}
</style>
</head>
<body>
<header><a class="back" href="index.html" id="back">Back</a><h1>Art Library</h1></header>
<main>
<aside class="side">
<div class="card row" id="setupbar"><b style="flex:1">Setup <span class="hint" id="setupsum"></span></b><button class="small" id="setuptog">Open</button></div>
<div id="setupbody"><div class="card" id="keys"></div>
<div class="card" id="spend"></div></div>
<input type="search" id="q" placeholder="Search every tab by name or id" autocomplete="off" aria-label="Search">
<div class="tabs" id="tabs"></div>
<div class="tabs fil" id="filters"></div>
</aside>
<div id="list"></div>
<div class="foot">
<div class="row"><button id="exp" class="small">EXPORT ZIP (all kept results and prompts)</button></div>
<p class="hint">Each image costs about $0.04 plus $0.01 per reference picture. Results stay on this device (last 5 per picture). APPROVE saves a picture and its prompt into the game's files on GitHub; REJECT saves your note for Claude. Both need the GitHub token.</p>
</div>
</main>
<div id="big"><img alt=""></div>
<div id="toast"></div>
<script>
// Art Library (Phase B). Prompts come from data/art-prompts.json (Claude writes them with tools/art-library/make-prompts.js).
// GENERATE calls the xAI image API from this device with the key pasted below (localStorage 'aot-art-key', never in the repo, never logged).
// If the browser cannot reach api.x.ai (CORS), paste a relay URL (a small Cloudflare Worker that holds the key); it is used instead.
// Test overrides: ?xai=<base url>  ?gh=<base url> (point at tools/art-library/stub.py).
const $=id=>document.getElementById(id);
const Q=new URLSearchParams(location.search);
const MODEL='grok-imagine-image-2.0', KEEP=5;
// Pictures Tom adds from his phone (for example a real photo). Kept in this browser only, never committed to the public repo. Entry field own:{slot,label}; the picture is sent FIRST.
let OWN={};
const ownOf=e=>e.own&&OWN[e.own.slot]||null;
const ownUrl=r=>{ const k='own|'+r.slot+'@'+r.t; if(!URLS.has(k)) URLS.set(k,URL.createObjectURL(r.blob)); return URLS.get(k); };
const LS={get(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}},set(k,v){try{localStorage.setItem(k,v);return true;}catch(e){return false;}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const XAI_BASE=()=> (Q.get('xai')||LS.get('aot-art-relay')||'https://api.x.ai').replace(/\/+$/,'');
const toast=m=>{const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',3500);};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA={entries:[]}, EDITS={}, USE={}, MSG={}, NOTES={}, ARMED=null;
// UX state that survives a reload: last tab and filter, which groups and pictures are open, scroll position per tab (never the search text)
let UI={tab:'Characters',filter:'todo',q:'',open:{},grp:{},sy:{}};
try{ const u=JSON.parse(LS.get('aot-art-ui')||'{}'); if(u&&typeof u==='object') Object.assign(UI,u,{q:''}); }catch(e){}
const saveUI=()=>{ const o=Object.assign({},UI); delete o.q; LS.set('aot-art-ui',JSON.stringify(o)); };
try{EDITS=JSON.parse(LS.get('aot-art-edits')||'{}')||{};}catch(e){}
const saveEdits=()=>LS.set('aot-art-edits',JSON.stringify(EDITS));
// IndexedDB: results (blobs), key id|n
let DB=null;
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('aot-art-library',1);q.onupgradeneeded=()=>q.result.createObjectStore('results',{keyPath:'key'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
const tx=(mode,fn)=>new Promise((res,rej)=>{const t=DB.transaction('results',mode);const r=fn(t.objectStore('results'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});
async function results(id){ if(!DB) return []; const all=await tx('readonly',s=>s.getAll()); return all.filter(r=>r.id===id).sort((a,b)=>b.n-a.n); }
async function addResult(id,blob,prompt,refs){
  const have=await results(id), n=(have[0]?have[0].n:0)+1;
  await tx('readwrite',s=>s.put({key:id+'|'+n,id,n,blob,prompt,refs,t:Date.now()}));
  for(const old of have.slice(KEEP-1)) await tx('readwrite',s=>s.delete(old.key));
  return n;
}
// --- keys card
function paintKeys(){
  const k=!!LS.get('aot-art-key'), g=!!LS.get('aot-gh-token'), r=LS.get('aot-art-relay');
  $('keys').innerHTML='<div class="row"><b style="flex:1">Keys on this device</b></div>'+
  '<label>xAI image key <span class="'+(k?'ok':'err')+'">'+(k?'key set':'no key')+'</span></label>'+
  '<div class="row"><input type="password" id="kx" placeholder="paste the xAI key" autocomplete="off" style="flex:1"><button class="small" id="sx">Save</button>'+(k?'<button class="small" id="dx">Remove</button>':'')+'</div>'+
  '<label>GitHub token (repo access only) <span class="'+(g?'ok':'err')+'">'+(g?'token set':'no token')+'</span></label>'+
  '<div class="row"><input type="password" id="kg" placeholder="paste the GitHub token" autocomplete="off" style="flex:1"><button class="small" id="sg">Save</button>'+(g?'<button class="small" id="dg">Remove</button>':'')+'</div>'+
  '<label>Relay address (only if the browser cannot reach xAI directly) <span class="'+(r?'ok':'hint')+'">'+(r?'relay set':'none')+'</span></label>'+
  '<div class="row"><input type="text" id="kr" placeholder="https://..." autocomplete="off" style="flex:1"><button class="small" id="sr">Save</button>'+(r?'<button class="small" id="dr">Remove</button>':'')+'</div>';
  if(typeof setupSum==='function') setupSum();
}
$('keys').addEventListener('click',e=>{
  const id=e.target.id, map={sx:['kx','aot-art-key'],sg:['kg','aot-gh-token'],sr:['kr','aot-art-relay']};
  if(map[id]){ const v=($(map[id][0]).value||'').trim(); if(!v) return toast('Paste it first.'); if(!LS.set(map[id][1],v)) return toast('This browser would not save it.'); paintKeys(); return; }
  const del={dx:'aot-art-key',dg:'aot-gh-token',dr:'aot-art-relay'}[id]; if(del){ LS.del(del); paintKeys(); }
});
// --- setup fold: keys and spend sit under one row that starts closed once both keys are saved
function setupSum(){ const k=!!LS.get('aot-art-key'), g=!!LS.get('aot-gh-token'), o=spendGet(); $('setupsum').textContent=(k&&g?'keys set':(k?'GitHub token missing':g?'xAI key missing':'keys missing'))+', about $'+o.total.toFixed(2)+' spent'; }
function setupOpen(open){ $('setupbody').hidden=!open; $('setuptog').textContent=open?'Close':'Open'; setupSum(); }
$('setuptog').onclick=()=>setupOpen($('setupbody').hidden);
// --- tabs, filters, groups and one-line rows (UX rebuild, CHANGES 110)
// Every entry is one collapsed row. Rows sit in groups (the `group` field from make-prompts.js) and groups sit in tabs. Only an open row draws its prompt, references and results.
const TABS=['Characters','NPCs','Areas','Rooms','Props','Enemies','Battle','Title','Portraits','Flight'];
const FILTERS=[['todo','To do'],['all','All'],['ready','Ready'],['wait','Waiting on me'],['rejected','Rejected'],['approved','Approved'],['blocked','Blocked']];
const STATE_NAME={ready:'Ready',wait:'Waiting on me',rejected:'Rejected',approved:'Approved',blocked:'Blocked'};
// ready = can be generated now; wait = a picture is generated and not yet approved or rejected; blocked = a reference picture is not made yet
let RES={}, ENTRY={}, ST={}, EXISTS={};
const CHAIN=/^art\/raw\/([a-z]+)\/([a-z0-9-]+)-v\d+\.png$/;
const WORKFLOW=/\s*\((?:needs step \d+ approved|same chat[^)]*|fresh generator chat[^)]*)\)/gi;
const baseTitle=t=>String(t).replace(WORKFLOW,'').trim();
const shortTitle=t=>baseTitle(t).replace(/\s*\([^)]*\)\s*$/,'');
function rowLabel(e){ let t=baseTitle(e.title); const g=e.group||''; if(g&&t.toLowerCase().indexOf(g.toLowerCase()+': ')===0) t=t.slice(g.length+2); return t; }
const URLS=new Map();
const urlOf=r=>{ const k=r.key+'@'+r.t; if(!URLS.has(k)) URLS.set(k,URL.createObjectURL(r.blob)); return URLS.get(k); };
async function loadResults(){ RES={}; OWN={}; if(!DB) return; const all=await tx('readonly',s=>s.getAll()); for(const r of all){ if(r.id==='__own'){ OWN[r.slot]=r; continue; } (RES[r.id]=RES[r.id]||[]).push(r); } for(const k in RES) RES[k].sort((a,b)=>b.n-a.n); }
function undecided(e){ const rs=RES[e.id]||[]; if(!rs.length) return false; const dec=Math.max(0,...[].concat(e.versions||[],e.rejects||[]).map(x=>parseInt(String(x.from||'').slice(1),10)||0)); return rs[0].n>dec; }
// A ticked reference under art/raw/ is made by approving another entry. Blocked until that entry is approved and its file is published (checked with a HEAD request).
function blockInfo(e){
  const rf=e.refs||[];
  for(let i=0;i<rf.length;i++){
    if(USE[e.id+'|'+i]===false) continue;
    const m=CHAIN.exec(rf[i]); if(!m) continue;
    const dep=ENTRY[m[2]]; if(!dep) continue;
    if(!(dep.versions||[]).length) return {why:'Approve “'+shortTitle(dep.title)+'” first.'};
    const x=EXISTS[rf[i]]; if(x&&!x.ok) return {why:'“'+shortTitle(dep.title)+'” is approved but the site has not published it yet. Give it about 2 minutes.'};
  }
  return null;
}
function stateOf(e){ if(undecided(e)) return 'wait'; if(e.status==='approved') return 'approved'; if(blockInfo(e)) return 'blocked'; if(e.status==='rejected') return 'rejected'; return 'ready'; }
function computeStates(){ ST={}; for(const e of DATA.entries) ST[e.id]=stateOf(e); }
async function probe(){
  const need=[], seen=new Set();
  for(const e of DATA.entries) for(const p of e.refs||[]){
    const m=CHAIN.exec(p); if(!m||seen.has(p)) continue; seen.add(p);
    const dep=ENTRY[m[2]]; if(!dep||!(dep.versions||[]).length) continue;
    const x=EXISTS[p]; if(x&&(x.ok||Date.now()-x.t<15000)) continue;
    need.push(p);
  }
  let changed=false;
  await Promise.all(need.map(async p=>{ let ok=null; try{ ok=(await fetch(p,{method:'HEAD',cache:'no-store'})).ok; }catch(err){} if(ok===null) return; const was=EXISTS[p]; EXISTS[p]={ok,t:Date.now()}; if(!was||was.ok!==ok) changed=true; }));
  if(changed) paintList(true);
}
const matchQ=(e,q)=>(e.title+' '+e.id+' '+(e.group||'')).toLowerCase().indexOf(q)>=0;
const qNow=()=>UI.q.trim().toLowerCase();
function visible(e){ const q=qNow(); if(q) return matchQ(e,q); const s=ST[e.id]; if(UI.filter==='all') return true; if(UI.filter==='todo') return s==='ready'||s==='wait'; return s===UI.filter; }
function groupsOf(tab){ const m=new Map(); for(const e of DATA.entries){ if(e.tab!==tab) continue; const g=e.group||tab; if(!m.has(g)) m.set(g,[]); m.get(g).push(e); } return m; }
const gkey=(tab,g)=>tab+'|'+g;
function groupCount(items){ const done=items.filter(e=>ST[e.id]==='approved').length, wait=items.filter(e=>ST[e.id]==='wait').length; return (wait?wait+' waiting, ':'')+done+' of '+items.length+' approved'; }
function paintTabs(){
  const q=qNow();
  $('tabs').innerHTML=TABS.map(t=>{ const all=DATA.entries.filter(e=>e.tab===t); const hit=q?all.filter(e=>matchQ(e,q)).length:0;
    return '<button class="tab'+(t===UI.tab?' on':'')+(q&&!hit?' dim':'')+'" data-tab="'+t+'">'+t+' '+(q?hit+' found':all.filter(e=>ST[e.id]==='approved').length+'/'+all.length)+'</button>'; }).join('');
}
function paintFilters(){
  const list=DATA.entries.filter(e=>e.tab===UI.tab), c={}; for(const e of list) c[ST[e.id]]=(c[ST[e.id]]||0)+1;
  const n=k=>k==='all'?list.length:k==='todo'?(c.ready||0)+(c.wait||0):(c[k]||0);
  $('filters').style.display=qNow()?'none':'';
  $('filters').innerHTML=FILTERS.map(f=>'<button class="tab'+(f[0]===UI.filter?' on':'')+'" data-filter="'+f[0]+'">'+f[1]+' '+n(f[0])+'</button>').join('');
}
function renderCard(e){
  const id=esc(e.id), rs=RES[e.id]||[], blk=blockInfo(e);
  const refs=(e.refs||[]).map((p,i)=>'<label class="ref"><img loading="lazy" decoding="async" src="'+esc(p)+'" alt="" onerror="this.classList.add(\'miss\');this.alt=\'not made yet\'"><input type="checkbox" data-ref="'+id+'" data-i="'+i+'" '+(USE[e.id+'|'+i]===false?'':'checked')+'> '+esc(p.split('/').pop())+'</label>').join('');
  return '<div class="card" data-id="'+id+'"><div class="hint">'+esc(e.title)+'</div>'+
  (blk?'<div class="blk">Blocked. '+esc(blk.why)+'</div>':'')+
  '<label>Prompt (edit here, it is sent as written)</label><textarea data-prompt="'+id+'">'+esc(promptOf(e))+'</textarea>'+
  (e.own?'<label>'+esc(e.own.label)+' (stays on this device, sent as picture '+((e.own.at||0)+1)+')</label><div class="refs">'+(ownOf(e)?'<div class="ref"><img src="'+ownUrl(ownOf(e))+'" alt=""><button class="small" data-ownrm="'+esc(e.own.slot)+'" data-id="'+id+'">Remove</button></div>':'<div class="hint">Not added yet.</div>')+'</div><label class="ownadd"><input type="file" accept="image/*" data-ownadd="'+esc(e.own.slot)+'" data-id="'+id+'" style="display:none">'+(ownOf(e)?'Replace photo':'Add photo from this device')+'</label>':'')+
  ((e.refs||[]).length?'<label>Reference pictures sent with it (untick to leave one out; at most 5)</label><div class="refs">'+refs+'</div>':'')+
  '<div class="row"><label style="margin:0">Shape</label><select data-ar="'+id+'">'+['3:4','2:3','1:1','4:3','3:2','16:9','9:16','2:1'].map(a=>'<option'+((e.ar||'3:4')===a?' selected':'')+'>'+a+'</option>').join('')+'</select>'+
  '<button class="gold" data-gen="'+id+'"'+(blk?' disabled':'')+'>GENERATE</button></div>'+
  '<div class="'+(MSG[e.id]&&MSG[e.id].err?'err':'hint')+'" id="m-'+id+'">'+esc(MSG[e.id]?MSG[e.id].text:'')+'</div>'+
  '<div class="res">'+rs.map(r=>'<div><img data-res="'+esc(r.key)+'" src="'+urlOf(r)+'" alt=""><span>v'+r.n+'</span> <button class="small" data-save="'+esc(r.key)+'">Save</button><div class="acts"><button class="good" data-ok="'+esc(r.key)+'">APPROVE</button><button class="bad" data-no="'+esc(r.key)+'">REJECT</button></div></div>').join('')+'</div>'+
  (rs.length?'<label>Note for Claude (required for REJECT: what is wrong, what to change)</label><input type="text" data-note="'+id+'" value="'+esc(NOTES[e.id]||'')+'" placeholder="for example: head too small, background not pure magenta">':'')+
  ((e.versions||[]).length?'<div class="hint ok">Approved: '+e.versions.map(v=>esc(v.file)).join(', ')+'</div>':'')+

// Redraw just one row (and the counts), so the page does not jump after GENERATE, APPROVE or REJECT. The row stays in the list even if the filter would now hide it, until the next tab or filter change.

const blobToDataUri=b=>new Promise((res,rej)=>{const f=new FileReader();f.onload=()=>res(f.result);f.onerror=()=>rej(f.error);f.readAsDataURL(b);});
function setMsg(id,text,err){ MSG[id]={text,err}; const m=$('m-'+id); if(m){m.textContent=text;m.className=err?'err':'hint';} }
// --- spend meter (estimate: $0.04 per image + $0.01 per reference picture, counted on this device only)
const SPEND_PER=0.04, SPEND_REF=0.01;
function spendGet(){ let o={total:0,count:0,cap:10}; try{ o=Object.assign(o,JSON.parse(LS.get('aot-art-spend')||'{}')); }catch(x){} return o; }
function spendPaint(){ const o=spendGet(); if($('setupsum')&&typeof setupSum==='function') setupSum(); $('spend').innerHTML='<div class="row"><b style="flex:1">Spent on this device: about $'+o.total.toFixed(2)+' ('+o.count+' pictures). Stops at $'+o.cap.toFixed(0)+'.</b><button class="small" id="capup">+$10</button><button class="small" id="spreset">RESET</button></div>'; }
$('spend').addEventListener('click',e=>{ const o=spendGet(); if(e.target.id==='capup'){ o.cap+=10; LS.set('aot-art-spend',JSON.stringify(o)); spendPaint(); } if(e.target.id==='spreset'){ o.total=0; o.count=0; LS.set('aot-art-spend',JSON.stringify(o)); spendPaint(); } });
spendPaint();
async function generate(id,btn){
  const e=DATA.entries.find(x=>x.id===id), key=LS.get('aot-art-key');
  if(!key) return setMsg(id,'Paste the xAI key at the top first.',true);
  const blk=blockInfo(e); if(blk) return setMsg(id,blk.why,true);
  const prompt=(promptOf(e)||'').trim(); if(!prompt) return setMsg(id,'The prompt is empty.',true);
  const refPaths=(e.refs||[]).filter((p,i)=>USE[id+'|'+i]!==false);
  const own=ownOf(e); if(e.own&&!own) return setMsg(id,'Add the picture first: '+e.own.label+'.',true);
  const nRef=refPaths.length+(own?1:0);
  if(nRef>5) return setMsg(id,'At most 5 reference pictures. Untick '+(nRef-5)+'.',true);
  { const o=spendGet(); if(o.total+SPEND_PER+SPEND_REF*nRef>o.cap) return setMsg(id,'Spend cap reached ($'+o.cap.toFixed(0)+'). Press +$10 at the top to allow more.',true); }
  btn.disabled=true; setMsg(id,'Working... this takes up to a minute.');
  try{
    const body={model:MODEL,prompt,n:1,aspect_ratio:e.ar||'3:4',resolution:'1k',response_format:'b64_json'};
    let path='/v1/images/generations';
    if(nRef){
      path='/v1/images/edits';
      body.images=[]; for(const p of refPaths){ const r=await fetch(p,{cache:'no-store'}); if(!r.ok) throw new Error('Could not load reference '+p+(p.indexOf('art/raw/')===0?'. That picture does not exist yet: approve the earlier step first (give the site about 2 minutes after approving).':'')); body.images.push({type:'image_url',url:await blobToDataUri(await r.blob())}); }
      if(own) body.images.splice(Math.min(e.own.at||0,body.images.length),0,{type:'image_url',url:await blobToDataUri(own.blob)});
    }
    let r; try{ r=await fetch(XAI_BASE()+path,{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+key},body:JSON.stringify(body)}); }
    catch(err){ throw new Error('The browser could not reach the image service. Either the network is down or the service blocks browsers; if it is the second, a relay address is needed (the Relay field at the top).'); }
    const txt=await r.text(); let j=null; try{j=JSON.parse(txt);}catch(x){}
    if(!r.ok) throw new Error('The image service said '+r.status+': '+txt.replace(key,'[key]').slice(0,300));
    const d=j&&j.data&&j.data[0]; if(!d) throw new Error('The image service sent no picture: '+txt.slice(0,200));
    let blob;
    if(d.b64_json){ const bin=atob(d.b64_json), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); blob=new Blob([u],{type:d.mime_type||'image/png'}); }
    else if(d.url){ const ir=await fetch(d.url); if(!ir.ok) throw new Error('Could not download the picture.'); blob=await ir.blob(); }
    else throw new Error('The image service sent an unknown picture format.');
    { const o=spendGet(); o.total+=SPEND_PER+SPEND_REF*nRef; o.count+=1; LS.set('aot-art-spend',JSON.stringify(o)); spendPaint(); }
    const sentRefs=refPaths.slice(); if(own) sentRefs.splice(Math.min(e.own.at||0,sentRefs.length),0,'(own picture: '+e.own.slot+')');
    const n=await addResult(id,blob,prompt,sentRefs); RES[id]=await results(id);
    e.status='generated'; MSG[id]={text:'Done: v'+n+'.',err:false}; refreshItem(id);
  }catch(err){ setMsg(id,String(err.message||err),true); btn.disabled=false; }
}
// --- GitHub: APPROVE commits the picture and the prompt, REJECT commits your note (needs the GitHub token at the top)
const GH_OWNER='trivituso81', GH_REPO='adventures-of-tom', GH_BRANCH='main', JSON_PATH='data/art-prompts.json';
const GH_BASE=()=> (Q.get('gh')||'https://api.github.com').replace(/\/+$/,'');
const ghUrl=p=>GH_BASE()+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+p.split('/').map(encodeURIComponent).join('/');
const blobToB64=async b=>(await blobToDataUri(b)).split(',')[1];
const textToB64=s=>{ const u=new TextEncoder().encode(s); let b=''; for(let i=0;i<u.length;i+=0x8000) b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return btoa(b); };
const b64ToText=c=>{ const bin=atob(String(c).replace(/\s/g,'')), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return new TextDecoder().decode(u); };
async function gh(method,path,body){
  const tok=LS.get('aot-gh-token'); if(!tok) throw new Error('Paste the GitHub token at the top first.');
  let r; try{ r=await fetch(ghUrl(path)+(method==='GET'?'?ref='+GH_BRANCH:''),{method,headers:Object.assign({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined}); }
  catch(err){ throw new Error('The browser could not reach GitHub. Check the network and try again.'); }
  const txt=await r.text(); let j=null; try{j=JSON.parse(txt);}catch(x){}
  return {status:r.status,ok:r.ok,json:j,text:txt.split(tok).join('[token]').slice(0,300)};
}
function ghFail(r,what){
  if(r.status===401) return new Error('GitHub said the token is wrong or expired. Make a new one and paste it at the top. ('+what+')');
  if(r.status===403||r.status===404) return new Error('GitHub would not let this token change the game files. The token needs "Contents: Read and write" on the adventures-of-tom repository. ('+what+', '+r.status+')');
  return new Error('GitHub said '+r.status+' while '+what+': '+r.text);
}
// Read data/art-prompts.json, let mutate(doc) change it (return false if the picture is not there), write it back. Retries if someone else changed it first.
async function commitJson(mutate,message){
  for(let i=0;i<3;i++){
    const g=await gh('GET',JSON_PATH); if(!g.ok) throw ghFail(g,'reading the prompts file');
    // GitHub's contents API sends an empty body for files over 1 MB; the prompts file has grown past that, so read it by blob id instead.
    let raw=g.json.content||'';
    if(!raw){ const br=await fetch(GH_BASE()+'/repos/'+GH_OWNER+'/'+GH_REPO+'/git/blobs/'+g.json.sha,{headers:{Authorization:'Bearer '+LS.get('aot-gh-token'),Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}}); if(!br.ok) throw ghFail({status:br.status,text:''},'reading the prompts file'); raw=(await br.json()).content||''; }
    if(!raw) throw new Error('GitHub sent an empty prompts file. Try again in a minute.');
    const doc=JSON.parse(b64ToText(raw)); if(mutate(doc)===false) throw new Error('That picture is not in the game\'s prompts file any more. Reload the page.');
    const w=await gh('PUT',JSON_PATH,{message,content:textToB64(JSON.stringify(doc,null,1)+'\n'),branch:GH_BRANCH,sha:g.json.sha});
    if(w.ok) return; if(w.status!==409&&w.status!==422) throw ghFail(w,'saving the prompts file');
  }
  throw new Error('The prompts file kept changing under us. Try again in a minute.');
}
async function decide(kind,resKey,btn){
  const r=await tx('readonly',s=>s.get(resKey)); if(!r) return;
  const id=r.id, e=DATA.entries.find(x=>x.id===id); if(!e) return;
  if(!LS.get('aot-gh-token')) return setMsg(id,'Paste the GitHub token at the top first (the second box).',true);
  const note=(NOTES[id]||'').trim();
  if(kind==='no'&&!note) return setMsg(id,'Type a note for Claude first (the box under the pictures): what is wrong or what to change.',true);
  const armKey=kind+'|'+resKey;
  if(ARMED!==armKey){ ARMED=armKey; btn.classList.add('armed'); btn.textContent='TAP AGAIN'; clearTimeout(decide.h); decide.h=setTimeout(()=>{ARMED=null;refreshItem(id);},4000); return; }
  ARMED=null; clearTimeout(decide.h); document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.disabled=true);
  try{
    const today=new Date().toISOString().slice(0,10);
    if(kind==='ok'){
      setMsg(id,'Saving the picture to the game files...');
      const slug=(e.tab||'misc').toLowerCase(); let k=Math.max(0,...(e.versions||[]).map(v=>v.n||0))+1, path='', b64=await blobToB64(r.blob), done=false;
      for(let tries=0;tries<6&&!done;tries++,k++){
        path='art/raw/'+slug+'/'+id+'-v'+k+'.png';
        const w=await gh('PUT',path,{message:'Art Library: approve '+id+' v'+k,content:b64,branch:GH_BRANCH});
        if(w.ok) done=true; else if(w.status!==409&&w.status!==422) throw ghFail(w,'saving the picture');
      }
      if(!done) throw new Error('Could not find a free version number for the picture.');
      k--;
      setMsg(id,'Saving the prompt...');
      await commitJson(doc=>{ const x=doc.entries.find(q=>q.id===id); if(!x) return false; x.prompt=r.prompt; x.status='approved'; x.versions=x.versions||[]; x.versions.push({n:k,file:path,date:today,from:'v'+r.n}); },'Art Library: '+id+' approved (v'+k+')');
      e.prompt=r.prompt; e.status='approved'; e.versions=(e.versions||[]).concat([{n:k,file:path,date:today,from:'v'+r.n}]); delete EDITS[id]; saveEdits();
      MSG[id]={text:'Approved. Saved as '+path+'. Claude will pick it up next session.',err:false};
    } else {
      setMsg(id,'Saving your note...');
      const txt=promptOf(e);
      await commitJson(doc=>{ const x=doc.entries.find(q=>q.id===id); if(!x) return false; x.rejects=x.rejects||[]; x.rejects.push({date:today,note,from:'v'+r.n}); x.status='rejected'; x.prompt=txt; },'Art Library: '+id+' rejected, note saved');
      e.rejects=(e.rejects||[]).concat([{date:today,note,from:'v'+r.n}]); e.status='rejected'; e.prompt=txt; delete EDITS[id]; saveEdits(); NOTES[id]='';
      MSG[id]={text:'Rejected. Your note is saved for Claude.',err:false};
    }
    refreshItem(id);
  }catch(err){ setMsg(id,String(err.message||err),true); document.querySelectorAll('[data-ok],[data-no]').forEach(b=>b.disabled=false); }
}
// --- zip export (store only)
const CRC=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return b=>{let c=~0;for(let i=0;i<b.length;i++)c=t[(c^b[i])&255]^(c>>>8);return (~c)>>>0;};})();
async function makeZip(files){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  for(const f of files){
    const name=enc.encode(f.name), data=new Uint8Array(await f.blob.arrayBuffer()), crc=CRC(data);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint16(6,0x0800,true); h.setUint32(14,crc,true); h.setUint32(18,data.length,true); h.setUint32(22,data.length,true); h.setUint16(26,name.length,true);
    parts.push(h.buffer,name,data);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint16(8,0x0800,true); c.setUint32(16,crc,true); c.setUint32(20,data.length,true); c.setUint32(24,data.length,true); c.setUint16(28,name.length,true); c.setUint32(42,off,true);
    cd.push(c.buffer,name); off+=30+name.length+data.length;
  }
  const cdSize=cd.reduce((a,b)=>a+(b.byteLength||b.length),0);
  const end=new DataView(new ArrayBuffer(22)); end.setUint32(0,0x06054b50,true); end.setUint16(8,files.length,true); end.setUint16(10,files.length,true); end.setUint32(12,cdSize,true); end.setUint32(16,off,true);
  return new Blob([...parts,...cd,end.buffer],{type:'application/zip'});
}
$('exp').onclick=async()=>{
  const all=(await tx('readonly',s=>s.getAll())).filter(r=>r.id!=='__own'); const files=all.map(r=>({name:'art/'+r.id+'-v'+r.n+'.png',blob:r.blob}));
  const prompts=DATA.entries.map(e=>({id:e.id,tab:e.tab,title:e.title,prompt:promptOf(e),refs:e.refs,status:e.status}));
  files.push({name:'art-prompts-edited.json',blob:new Blob([JSON.stringify(prompts,null,1)],{type:'application/json'})});
  download(await makeZip(files),'art-library-export.zip'); toast('Exported '+all.length+' pictures.');
};

(async function(){
  paintKeys();
  try{ DB=await idb(); }catch(e){ toast('This browser would not keep results.'); }
  try{ const r=await fetch('data/art-prompts.json',{cache:'no-store'}); if(r.ok) DATA=await r.json(); }catch(e){}

})();
