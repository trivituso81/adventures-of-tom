<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14122b">
<title>Bake voices</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#14122b;color:#f4f1ff;font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;position:sticky;top:0;background:#14122b;border-bottom:1px solid #2c2852;z-index:2}
header h1{font-size:20px;margin:0;flex:1}
a.back{color:#ffd34d;text-decoration:none;font-weight:600;padding:10px 4px}
main{max-width:640px;margin:0 auto;padding:16px 16px 40px}
section{margin-bottom:18px}
.card{background:#1d1a3d;border:1px solid #2c2852;border-radius:14px;padding:14px}
label{display:block;font-size:13px;color:#b9b3e6;margin-bottom:6px}
input[type=password],input[type=text]{width:100%;padding:14px;border-radius:10px;border:1px solid #3a3566;background:#0f0d24;color:#fff;font-size:16px}
button{font:inherit;border:0;border-radius:12px;padding:14px 16px;min-height:48px;background:#3a3566;color:#fff;font-weight:600}
button:disabled{opacity:.45}
button.big{width:100%;min-height:64px;font-size:20px;background:#ffd34d;color:#241b00}
button.big.run{background:#7b6cff;color:#fff}
button.small{min-height:40px;padding:8px 12px;font-size:14px;border-radius:10px}
button.danger{background:#5a2233}
.row{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-top:1px solid #2c2852}
.row:first-child{border-top:0}
.dot{flex:0 0 26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;background:#3a3566;margin-top:2px}
.dot.done{background:#2fae6b}.dot.busy{background:#7b6cff}.dot.err{background:#c8414f}
.body{flex:1;min-width:0}
.where{font-size:12px;color:#b9b3e6}
.txt{word-wrap:break-word;overflow-wrap:anywhere}
.msg{font-size:13px;margin-top:4px}
.err{color:#ff8b97}.ok{color:#7be0a6}.hint{color:#b9b3e6;font-size:13px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#sum{margin-top:10px;text-align:center}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.tools button{flex:1 1 140px}
</style>
</head>
<body>
<header><a class="back" href="index.html">&#8249; Game</a><h1>Bake voices</h1></header>
<main>
  <section id="keybox" class="card"></section>
  <section>
    <button id="go" class="big" disabled>Loading...</button>
    <div id="sum" class="hint"></div>
    <div id="note" class="msg"></div>
  </section>
  <section id="list" class="card"></section>
  <section class="tools">
    <button id="exp" class="small">Export clips</button>
    <button id="clr" class="small danger">Remove clips from this phone</button>
  </section>
  <p class="hint" id="foot"></p>
</main>
<script>
'use strict';
// bake.html: bake the lines in data/bake-list.json with ElevenLabs, right here on the phone, and keep the clips in this
// browser's IndexedDB ('aot-local-clips'). The game (engine/local-clips.js) reads them at startup. Nothing is uploaded anywhere
// except the line text to ElevenLabs.
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEYNAME='aot-el-key';
const apiKey=()=>{try{return localStorage.getItem(KEYNAME)||'';}catch(e){return '';}};
let LIST=null,DB=null,running=false,stopFlag=false,wake=null,playing=null;
const ROWS=new Map();      // clip id -> saved row (with mp3)
const STATE={};            // item id -> {s:'todo'|'busy'|'done'|'err', msg}

// ---------- storage ----------
const clipId=it=>[it.kind,it.voice,it.lineKind||'',it.text].join('|');
function openDB(){return new Promise(res=>{try{const r=indexedDB.open('aot-local-clips',1);r.onupgradeneeded=()=>r.result.createObjectStore('clips',{keyPath:'id'});r.onsuccess=()=>{DB=r.result;res(true);};r.onerror=()=>res(false);}catch(e){res(false);}});}
const dbAll=()=>new Promise(res=>{if(!DB)return res([]);try{const q=DB.transaction('clips').objectStore('clips').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([]);}catch(e){res([]);}});
const dbPut=row=>new Promise((res,rej)=>{if(!DB)return rej(new Error('This browser would not let me save clips.'));try{const t=DB.transaction('clips','readwrite');t.objectStore('clips').put(row);t.oncomplete=()=>res();t.onerror=()=>rej(t.error||new Error('Save failed'));t.onabort=()=>rej(t.error||new Error('Save failed'));}catch(e){rej(e);}});
const dbClear=()=>new Promise(res=>{if(!DB)return res();try{const t=DB.transaction('clips','readwrite');t.objectStore('clips').clear();t.oncomplete=()=>res();t.onerror=()=>res();}catch(e){res();}});

// ---------- what ElevenLabs reads ----------
const voiceOf=it=>LIST.voices[it.kind+'|'+it.voice];
function finalText(it){
  const v=voiceOf(it),d=(v.direction||'').trim().replace(/^\[|\]$/g,'');
  const sc=it.script.trim().replace(/’/g,"'"),m=sc.match(/^\[([^\]]*)\]/),have=m?m[1]:'';
  if(!d||have.toLowerCase().includes(d.toLowerCase())) return sc;
  if(m) return '['+[d].concat(have.trim()?[have.trim()]:[]).join(', ')+']'+sc.slice(m[0].length);
  return '['+d+'] '+sc;
}
// A take far longer than the words need usually means the voice looped.
function expectedSec(text){const w=text.replace(/\[[^\]]*\]/g,' ').split(/\s+/).filter(Boolean).length,s=(text.match(/[.!?]+/g)||[]).length||1;return 0.42*w+0.2*s;}
const mp3Sec=b=>Math.round(b.length*0.75*8/128000*10)/10;
const tooLong=(sec,text)=>sec>expectedSec(text)*1.45+0.8;

// ---------- ElevenLabs ----------
function b64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s);}
async function apiErr(r){let t='';try{t=await r.text();const j=JSON.parse(t);const d=j.detail;if(d&&typeof d==='object'&&!Array.isArray(d))t=d.message||d.status||JSON.stringify(d);else if(Array.isArray(d))t=d.map(x=>x.msg).join('; ');else if(d)t=String(d);}catch(e){}
  const code=r.status;const hint=code===401?' (the API key was not accepted)':code===402||code===403?' (check the ElevenLabs plan and credits)':'';
  return new Error('ElevenLabs '+code+hint+': '+String(t).slice(0,160));}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const retry=async(fn,tries=4)=>{for(let k=0;;k++){try{return await fn();}catch(e){const m=e&&e.message||String(e);if(k<tries-1&&/ 429| 409|too many|concurrent|in progress/i.test(m)){await wait(2500*(k+1));continue;}throw e;}}};
async function tts(v,text){
  const url='https://api.elevenlabs.io/v1/text-to-speech/'+encodeURIComponent(v.voice_id)+'?output_format=mp3_44100_128';
  const body={text,model_id:v.model||'eleven_v4',voice_settings:{stability:+v.stability,similarity_boost:+v.similarity},seed:Math.floor(Math.random()*4294967295)};
  const send=()=>fetch(url,{method:'POST',headers:{'xi-api-key':apiKey(),'Content-Type':'application/json',Accept:'audio/mpeg'},body:JSON.stringify(body)});
  let r=await send();
  if(!r.ok&&(r.status===400||r.status===422)){const e=await apiErr(r);if(/seed/i.test(e.message)){delete body.seed;r=await send();}else throw e;}
  if(!r.ok) throw await apiErr(r);
  return b64(await r.arrayBuffer());
}

// ---------- baking ----------
async function bakeItem(it){
  const sent=finalText(it),v=voiceOf(it);let best=null;
  for(let k=0;k<3;k++){
    const mp3=await retry(()=>tts(v,sent));const sec=mp3Sec(mp3);
    if(!best||sec<best.sec) best={mp3,sec};
    if(!tooLong(sec,sent)) break;
  }
  const row={id:clipId(it),kind:it.kind,voice:it.voice,lineKind:it.lineKind||'',text:it.text,mp3:best.mp3,sec:best.sec,script:sent,t:Date.now()};
  await dbPut(row);ROWS.set(row.id,row);return row;
}
const pending=()=>LIST.items.filter(it=>!ROWS.has(clipId(it)));
async function bakeAll(){
  if(running) return;
  if(!apiKey()){note('Paste your ElevenLabs API key above first.','err');return;}
  const todo=pending();if(!todo.length) return;
  running=true;stopFlag=false;try{if(navigator.wakeLock) wake=await navigator.wakeLock.request('screen');}catch(e){}
  let n=0,fail=0;
  for(const it of todo){
    if(stopFlag) break;
    STATE[it.id]={s:'busy'};n++;paint();$('go').textContent='Baking '+n+' of '+todo.length+'...  (tap to stop)';
    try{await bakeItem(it);STATE[it.id]={s:'done'};}
    catch(e){STATE[it.id]={s:'err',msg:e.message||String(e)};fail++;if(/ 401|API key|quota|credit/i.test(e.message||'')) {paint();break;}}
    paint();
  }
  running=false;try{if(wake) wake.release();}catch(e){}wake=null;
  const left=pending().length;
  if(stopFlag) note('Stopped. Tap the button to carry on.','hint');
  else if(!left) note('Done. Tap Game (top left). The new voices load when the game starts.','ok');
  else note(left+' line'+(left===1?'':'s')+' did not bake. The reason is under each one. Tap the button to try them again.','err');
  paint();
}
async function redo(it){
  if(running||!apiKey()){if(!apiKey())note('Paste your ElevenLabs API key above first.','err');return;}
  running=true;STATE[it.id]={s:'busy'};paint();
  try{await bakeItem(it);STATE[it.id]={s:'done'};note('New take saved.','ok');}catch(e){STATE[it.id]={s:'err',msg:e.message||String(e)};}
  running=false;paint();
}

// ---------- screen ----------
function note(t,cls){const el=$('note');el.className='msg '+(cls||'');el.textContent=t||'';}
function paintKey(){
  const has=!!apiKey();
  $('keybox').innerHTML=has
    ?'<div class="ok">ElevenLabs key saved on this phone.</div><div class="acts"><button class="small" id="chg">Change key</button></div>'
    :'<label for="key">ElevenLabs API key (saved on this phone only)</label><input id="key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste it here"><div class="acts"><button class="small" id="savekey">Save key</button></div>';
}
function paint(){
  if(!LIST) return;
  const left=pending();
  const go=$('go');
  if(running){go.className='big run';go.disabled=false;}
  else{go.className='big';go.disabled=!left.length;go.textContent=left.length?'Bake '+left.length+' line'+(left.length===1?'':'s'):'Everything is baked';}
  const chars=left.reduce((a,it)=>a+finalText(it).length,0);
  $('sum').textContent=left.length?('About '+chars+' characters of ElevenLabs credit.'):('List made '+LIST.made+'. '+ROWS.size+' clip'+(ROWS.size===1?'':'s')+' on this phone.');
  $('list').innerHTML=LIST.items.map(it=>{
    const done=ROWS.has(clipId(it)),st=STATE[it.id]||{s:done?'done':'todo'};
    const s=done&&st.s!=='busy'&&st.s!=='err'?'done':st.s;
    const sym=s==='done'?'&#10003;':s==='busy'?'&hellip;':s==='err'?'!':'';
    return '<div class="row"><div class="dot '+s+'">'+sym+'</div><div class="body"><div class="where">'+esc(it.where)+'</div><div class="txt">'+esc(it.text)+'</div>'
      +(s==='err'?'<div class="msg err">'+esc(st.msg||'Failed')+'</div>':'')
      +(done?'<div class="acts"><button class="small" data-act="play" data-id="'+it.id+'">&#9654; Play</button><button class="small" data-act="redo" data-id="'+it.id+'">New take</button></div>':'')
      +'</div></div>';}).join('')||'<div class="hint">Nothing is waiting for a voice.</div>';
}
function play(it){
  const row=ROWS.get(clipId(it));if(!row)return;
  if(playing){try{playing.pause();}catch(e){}playing=null;}
  const a=new Audio('data:audio/mpeg;base64,'+row.mp3);playing=a;a.play().catch(()=>note('Could not play that. Turn the ring switch on and try again.','err'));
}
async function exportClips(){
  const rows=[...ROWS.values()];if(!rows.length){note('No clips on this phone yet.','hint');return;}
  const blob=new Blob([JSON.stringify({made:new Date().toISOString(),clips:rows})],{type:'application/json'});
  const file=new File([blob],'local-clips-export.json',{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Local voice clips'});return;}}catch(e){if(e&&e.name==='AbortError')return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='local-clips-export.json';document.body.appendChild(a);a.click();a.remove();
}

document.addEventListener('click',async e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.id==='go'){ if(running){stopFlag=true;t.textContent='Stopping...';} else bakeAll(); return; }
  if(t.id==='savekey'){const v=($('key').value||'').trim();if(!v){note('Paste the key first.','err');return;}try{localStorage.setItem(KEYNAME,v);}catch(e){note('This browser would not save the key.','err');return;}note('');paintKey();paint();return;}
  if(t.id==='chg'){try{localStorage.removeItem(KEYNAME);}catch(e){}paintKey();return;}
  if(t.id==='exp'){exportClips();return;}
  if(t.id==='clr'){if(running)return;if(confirm('Remove every clip baked on this phone? The game goes back to the voices built into it.')){await dbClear();ROWS.clear();for(const k in STATE)delete STATE[k];note('Removed.','hint');paint();}return;}
  const it=LIST&&LIST.items.find(x=>x.id===t.dataset.id);
  if(it&&t.dataset.act==='play')play(it);
  if(it&&t.dataset.act==='redo')redo(it);
});

(async()=>{
  paintKey();
  await openDB();
  for(const r of await dbAll()) ROWS.set(r.id,r);
  try{
    const r=await fetch('data/bake-list.json?'+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    LIST=await r.json();
  }catch(e){ $('go').textContent='Could not load the list';note('Could not load data/bake-list.json ('+(e.message||e)+'). Check the connection and reload.','err');return; }
  $('foot').textContent='These clips are kept in this app only. Clearing the app\'s website data removes them.';
  paint();
})();
</script>
</body>
</html>
