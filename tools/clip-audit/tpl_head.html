<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contraction Fix Baker</title>
<style>
:root{--bg:#171a21;--win1:#3b4252;--win2:#232833;--line:#dfe4ec;--ring:#0b0d12;--hi:#646d80;--sel1:#5d687e;--sel2:#465063;--text:#f1f3f7;--label:#9db1cc;--dim:#b3bac7;--faint:#7f8798;--gold:#f0c75a;--mint:#7fdc9f;--coral:#ff8f80;--blue:#86a9ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.win{background:linear-gradient(var(--win1),var(--win2));border:2px solid var(--line);border-radius:8px;box-shadow:0 0 0 2px var(--ring),inset 0 0 0 1px var(--hi)}
header{position:sticky;top:0;z-index:5;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:#11141a;border-bottom:1px solid #2c3240}
header h1{font-size:17px;margin:0 8px 0 0}header h1 span{color:var(--gold)}
.grow{flex:1}
input[type=text],input[type=password],input[type=number],select,textarea{background:#11141a;border:1px solid #4a5263;border-radius:5px;padding:6px 8px}
textarea{width:100%;resize:vertical;min-height:38px}
input:focus,textarea:focus,select:focus{outline:2px solid var(--blue)}
.btn{background:linear-gradient(var(--sel1),var(--sel2));border:1px solid var(--line);border-radius:5px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.15)}.btn:disabled{opacity:.45;cursor:default;filter:none}
.btn.gold{background:linear-gradient(#f6d77e,#d9a93a);color:#241a05;border-color:#fff1c4;font-weight:600}
.btn.small{padding:3px 8px;font-size:12px}
.tabs{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap}
.tab{padding:8px 14px;border-radius:8px 8px 0 0;border:2px solid var(--line);border-bottom:0;background:#11141a;cursor:pointer;color:var(--dim)}
.tab.on{background:linear-gradient(var(--sel1),var(--sel2));color:var(--text);font-weight:600}
.tab .c{font-size:12px;color:var(--coral);margin-left:6px}.tab .c.ok{color:var(--mint)}
.wrap{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:1100px;margin:0 auto}
.panel{padding:12px 14px}.panel h2{font-size:13px;color:var(--label);text-transform:uppercase;letter-spacing:1px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:1px solid #4a5263;border-radius:5px;overflow:hidden;flex-wrap:wrap}
.seg button{background:#11141a;border:0;padding:5px 10px;cursor:pointer;color:var(--dim)}
.seg button+button{border-left:1px solid #4a5263}.seg button.on{background:linear-gradient(var(--sel1),var(--sel2));color:var(--text)}
.hint{font-size:12px;color:var(--faint)}.note{font-size:12.5px;color:var(--dim)}.note b{color:var(--text)}
.field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}.field label{font-size:12px;color:var(--label)}
.kindhead{font-size:12px;color:var(--label);text-transform:uppercase;letter-spacing:1px;margin:10px 2px 0}
.card{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.card .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}.card .who{font-weight:700;color:var(--gold)}.card .game{font-size:15px;font-weight:600}
.after{font-size:12px;color:var(--faint);font-style:italic}
.tag{font-size:11px;padding:1px 7px;border-radius:9px;border:1px solid;white-space:nowrap}
.tag.new{color:var(--coral);border-color:#9c5a52}.tag.rebake{color:var(--blue);border-color:#4f6aa8}.tag.kept{color:var(--gold);border-color:#8f7637}
.sent{font-size:12px;color:var(--faint);font-family:ui-monospace,Menlo,monospace;word-break:break-word}.sent b{color:var(--blue);font-weight:500}
.takes{display:flex;flex-wrap:wrap;gap:8px}
.take{display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border:1px solid #4a5263;border-radius:6px;background:#11141a}
.take.keep{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}.take .lbl{font-size:11px;color:var(--dim)}.take input{accent-color:var(--gold)}
.play{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:linear-gradient(var(--sel1),var(--sel2));cursor:pointer;display:grid;place-items:center;font-size:11px;flex:none}
.play.on{background:var(--gold);color:#241a05}
.x{background:none;border:0;color:var(--faint);cursor:pointer;font-size:14px;padding:0 2px}.x:hover{color:var(--coral)}
.err{color:var(--coral);font-size:12px}.busy{color:var(--blue);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:10px;border:1px solid #4a5263;background:#11141a;cursor:pointer;color:var(--dim)}.chip:hover{border-color:var(--line);color:var(--text)}
.pv{display:flex;align-items:center;gap:8px;padding:5px 8px;border:1px solid #4a5263;border-radius:6px;background:#11141a;margin-top:6px}
.empty{padding:30px;text-align:center;color:var(--faint)}.progress{font-size:12px;color:var(--dim)}.progress b{color:var(--gold)}
@media (max-width:700px){header{padding:8px 10px}.wrap{padding:10px}}
</style>
</head>
<body>
<header>
  <h1>Little Elsewhere <span>Contraction Fix Baker</span></h1>
  <div class="row"><label class="hint" for="key">ElevenLabs API key</label><input id="key" type="password" size="26" placeholder="paste once; stays in this browser" autocomplete="off"></div>
  <div class="grow"></div><span id="progress" class="progress"></span>
</header>
<div class="tabs" id="tabs"></div>
<div class="wrap" id="wrap"></div>
