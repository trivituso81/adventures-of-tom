<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14122b">
<title>Board</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#14122b;color:#f4f1ff;font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;position:sticky;top:0;background:#14122b;border-bottom:1px solid #2c2852;z-index:5}
header h1{font-size:20px;margin:0;flex:1}
a.back{color:#ffd34d;text-decoration:none;font-weight:600;padding:10px 4px}
main{max-width:1680px;margin:0 auto;padding:12px 16px 80px}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;min-height:44px;background:#3a3566;color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.45}
button.gold{background:#ffd34d;color:#241b00}button.good{background:#2f9e63}button.small{min-height:36px;padding:6px 11px;font-size:14px;border-radius:10px}
.hint{color:#b9b3e6;font-size:13px}.err{color:#ff8b97;font-size:13px;white-space:pre-wrap}
#sum{display:block;width:100%;text-align:left;background:#1d1a3d;border:1px solid #3a3566;border-radius:14px;padding:12px 14px;margin:0 0 10px;font-size:16px;font-weight:600}
#sum.on{outline:2px solid #ffd34d}
#sum .red{color:#ff8b97}#sum .amb{color:#ffd34d}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;font-size:14px;padding:6px 12px;border-radius:16px;border:1px solid #3a3566;background:#0f0d24;color:#d9d4ff;white-space:nowrap;min-height:34px;font-weight:500}
.chip.on{background:#7b6cff;border-color:#a89dff;color:#fff}
.lane{background:#1a1738;border:1px solid #2c2852;border-radius:14px;margin:0 0 12px;overflow:hidden}
.lane>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:48px}
.lane>summary::-webkit-details-marker{display:none}
.lane>summary .nm{font-weight:700;font-size:17px}
.lane>summary .cv{flex:1;color:#8f89c4;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane>summary .ct{background:#2c2852;border-radius:10px;padding:2px 9px;font-size:13px}
.lane>summary .ct.has{background:#ffd34d;color:#241b00;font-weight:700}
.lane>summary::after{content:"\25BE";color:#b9b3e6}
.lane:not([open])>summary::after{content:"\25B8"}
.cols{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 12px 12px;scrollbar-width:none}
.col{flex:0 0 84%;scroll-snap-align:start;background:#14122b;border:1px solid #2c2852;border-radius:12px;padding:8px;min-height:90px}
.col h3{margin:2px 4px 8px;font-size:13px;color:#b9b3e6;font-weight:600;display:flex;justify-content:space-between}
.col .none{color:#6f6a9c;font-size:13px;padding:6px 4px}
.card{display:block;width:100%;text-align:left;background:#242050;border:1px solid #3a3566;border-radius:12px;padding:10px 12px;margin:0 0 8px;font-weight:400;min-height:0}
.card .t{font-weight:700;font-size:15px;line-height:1.3}
.card .n{color:#cfc9ff;font-size:13px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{font-size:11px;border-radius:9px;padding:2px 8px;color:#10101e;font-weight:700}
.age{font-size:11px;border-radius:9px;padding:2px 8px;background:#2c2852;color:#d9d4ff}
.age.amber{background:#6b5a1c;color:#ffe9a3}.age.red{background:#b4414f;color:#fff}
.blk{font-size:11px;border-radius:9px;padding:2px 8px;background:#b4414f;color:#fff;font-weight:700}
.blk.soft{background:#3a3566;color:#d9d4ff}
.wt{font-size:11px;border-radius:9px;padding:2px 8px;background:#3a3566;color:#ffe9a3}
.card.blocking{border-color:#b4414f}
#dim{position:fixed;inset:0;background:rgba(5,4,16,.72);display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90vh;overflow-y:auto;background:#1d1a3d;border-top:2px solid #3a3566;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom));display:none;z-index:21;max-width:760px;margin:0 auto}
#sheet h2{font-size:19px;margin:0 0 8px}
#sheet h4{margin:14px 0 4px;font-size:13px;color:#b9b3e6;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
#sheet p{margin:0;font-size:15px}
#sheet pre{white-space:pre-wrap;word-break:break-word;background:#0f0d24;border:1px solid #3a3566;border-radius:10px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace;margin:6px 0}
#sheet a{color:#ffd34d}
#sheet ul,#sheet ol{margin:4px 0;padding-left:20px;font-size:14px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
select,input[type=text]{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid #3a3566;background:#0f0d24;color:#fff}
input[type=text]{width:100%}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#ffd34d;color:#241b00;padding:10px 16px;border-radius:12px;font-weight:600;display:none;z-index:30;max-width:90%}
.sec{margin:0 0 14px}
.sec>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:8px 2px;cursor:pointer;min-height:44px}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary .nm{font-weight:800;font-size:15px;letter-spacing:.05em}
.sec>summary .ct{background:#2c2852;border-radius:10px;padding:2px 9px;font-size:13px}
.sec>summary .ct.has{background:#ffd34d;color:#241b00;font-weight:700}
.sec>summary .cv{flex:1;color:#8f89c4;font-size:12px}
.sec>summary::after{content:"\25BE";color:#b9b3e6}
.sec:not([open])>summary::after{content:"\25B8"}
.sec .none{color:#6f6a9c;font-size:13px;padding:6px 4px}
.sec.mine .card{border-color:#ffd34d}
.cnt{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.cnt button{background:#1d1a3d;border:1px solid #3a3566;border-radius:14px;padding:8px 12px;min-height:44px;font-size:15px;font-weight:600;text-align:left}
.cnt button b{font-size:18px}
.cnt button.on{outline:2px solid #ffd34d}
.cnt button.warn b{color:#ff8b97}
.card .meta2{color:#b9b3e6;font-size:12px;margin-top:6px}
.card .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.card .unb{color:#ffd34d;font-size:12px;margin-top:6px;font-weight:600}
.card .quiet{color:#ff8b97;font-size:12px;margin-top:6px;font-weight:600}
.card .mdl{display:inline-block;font-size:12px;border-radius:9px;padding:2px 8px;background:#2f9e63;color:#fff;font-weight:700}
div.card{cursor:pointer}
.conv{display:block;background:#242050;border:1px solid #3a3566;border-radius:12px;padding:10px 12px;margin:0 0 8px}
.conv .t{font-weight:700;font-size:15px;line-height:1.3}
.conv .m{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:12px;color:#b9b3e6}
.st{font-size:11px;border-radius:9px;padding:2px 8px;font-weight:700;color:#10101e}
.st.running{background:#7be0a6}.st.you{background:#ffd34d}.st.fin{background:#b6c2d9}
.conv a{color:#ffd34d;font-weight:700;text-decoration:none;font-size:13px}
.sub{display:flex;align-items:center;gap:8px;margin:10px 2px 6px;font-size:12px;font-weight:800;letter-spacing:.06em;color:#ffd34d}
.sub .ct{background:#2c2852;color:#fff;border-radius:10px;padding:1px 8px;font-size:12px}
.ask{font-size:11px;border-radius:9px;padding:2px 8px;background:#ffd34d;color:#241b00;font-weight:700}
.big{font-size:20px;font-weight:800;color:#7be0a6;margin:6px 0}
.ch{display:block;width:100%;text-align:left;margin:6px 0 0;background:#3a3566;border-radius:12px;padding:10px 12px}
.ch small{display:block;font-weight:400;color:#cfc9ff;margin-top:2px;font-size:13px}
.ch.rec{background:#2f9e63}.ch.rec small{color:#e8fff2}
.rv{display:flex;gap:8px;margin-top:10px}
.rv button{flex:1;min-height:48px;font-size:15px}
button.bad{background:#b4414f;color:#fff}
textarea{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid #3a3566;background:#0f0d24;color:#fff;width:100%;min-height:110px;resize:vertical}
.shot{display:flex;align-items:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.shot img{max-height:90px;border-radius:8px;border:1px solid #3a3566}
.fixnext{color:#7be0a6;font-size:12px;margin-top:6px;font-weight:600}
.what{font-size:17px;font-weight:700;color:#7be0a6;margin:8px 0}
#lanesView{display:none}
@media (min-width:860px){
#secView{display:none}#lanesView{display:block}
.cols{overflow:visible;scroll-snap-type:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.col{flex:none}
}
</style>
</head>
<body>
<header><a class="back" href="index.html" id="back">Back</a><h1>Board</h1><span class="hint" id="upd"></span><span class="hint" id="src"></span></header>
<main>
<div class="cnt" id="sum"></div>
<div class="chips" id="chips"></div>
<div id="secView"></div>
<div id="lanesView"></div>
<p class="hint">The board follows the repo: a card moves when something happened (an approval, a shipped build, a finished blocker, a running job). Age turns amber at 3 days and red at 7 without a change.</p>
<p class="err" id="err"></p>
</main>
<div id="dim"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script src="engine/admin-music.js?v=adminvol1"></script>
<script>
'use strict';
const Q=new URLSearchParams(location.search);
const REPO='trivituso81/adventures-of-tom',PATH='data/board.json',TOKEN='aot-gh-token';
const PERM=' You have my full permission to access the repo.';
const GH=()=>(Q.get('gh')||'https://api.github.com').replace(/\/+$/,'');
const URLF=()=>GH()+'/repos/'+REPO+'/contents/'+PATH;
const THEME_COL={'Voice Clips':'#ff9bd1','Battle Animations':'#ffb86b','Battle System':'#ff8b97','Areas':'#7be0a6','Characters':'#ffe27a','Story and Dialogue':'#a89dff','Game Shell':'#7fd4ff','Tools':'#c9a5ff','Project Ops':'#b6c2d9'};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const b64t=s=>{const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b);};
const t64=s=>{const bin=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);};
let B=null,sha=null,theme='',only='';   // only: '', mine, ready, run, stuck
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const dayNum=s=>{const p=String(s).split('-').map(Number);return Math.round(Date.UTC(p[0],p[1]-1,p[2])/864e5);};
const ageOf=c=>Math.max(0,dayNum(today())-dayNum(c.changed||c.created||today()));
const nowMs=()=>Date.now();
const ASKS=[['play','PLAY AND REPORT'],['pictures','REVIEW PICTURES'],['animations','REVIEW ANIMATIONS'],['voice','VOICE'],['script','READ A SCRIPT'],['decide','DECIDE'],['setup','SET UP']];
const askName=k=>(ASKS.find(a=>a[0]===k)||[k,'OTHER'])[1];
const REVIEW=['play','pictures','animations','voice','script'];   // board4: cards Tom tests or looks at get All good and Something is wrong
const isReview=c=>!!c&&c.lane==='tom'&&c.col!=='done'&&REVIEW.includes(c.ask);
const HIST=id=>' Board card '+id+'. Read its history first: my notes and answers are there.';
const withId=c=>{const t=(c.prompt&&c.prompt.text)||'';return t.indexOf('Read its history first')>=0?t:t+HIST(c.id);};
const PROJECT='https://claude.ai/project/01a14d08-5251-75c8-a191-5d11f4245788';
let lastLoad=0;
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3200);}
function ago(iso){if(!iso)return 'no push yet';const m=Math.max(0,Math.round((nowMs()-Date.parse(iso))/6e4));if(m<2)return 'just now';if(m<90)return m+' min ago';const h=Math.round(m/60);if(h<36)return h+' h ago';return Math.round(h/24)+' days ago';}

async function load(){
  const tok=lsGet(TOKEN);
  if(tok||Q.get('gh')){
    try{const r=await fetch(URLF()+'?ref=main&t='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+(tok||'test'),Accept:'application/vnd.github+json'}});
      if(r.ok){const j=await r.json();sha=j.sha;B=JSON.parse(t64(j.content));$('src').textContent='live';stamp();return;}}catch(e){}
  }
  const r=await fetch('data/board.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok) throw new Error('Could not load data/board.json ('+r.status+')');
  B=await r.json();sha=null;$('src').textContent='site copy';stamp();
}
function stamp(){lastLoad=nowMs();$('upd').textContent='Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});}
async function reload(){if($('sheet').style.display==='block')return false;try{await load();render();return true;}catch(e){return false;}}
setInterval(reload,60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&nowMs()-lastLoad>5000)reload();});

// ---- derived
const laneName=id=>(B.lanes.find(l=>l.id===id)||{name:id}).name;
const cardById=id=>B.cards.find(c=>c.id===id);
const themeOk=c=>!theme||c.theme===theme;
const open=()=>B.cards.filter(c=>c.col!=='done'&&themeOk(c));
const blockedBy=c=>B.cards.filter(x=>x.col!=='done'&&(x.blocks||[]).includes(c.id));
const blocksOpen=c=>(c.blocks||[]).map(cardById).filter(x=>x&&x.col!=='done');
const secYour=()=>open().filter(c=>c.lane==='tom'&&(c.col==='up'||c.col==='prog'));
const secReady=()=>open().filter(c=>c.lane==='claude'&&c.col==='up');
const secRun=()=>open().filter(c=>c.col==='prog'&&c.lane!=='tom'&&!c.quiet);
const waitsOnClaude=c=>c.lane==='tom'&&c.col==='wait'&&blockedBy(c).some(k=>k.lane==='claude');   // a tested card waiting on its fix is Claude's move, not stuck
const secStuck=()=>open().filter(c=>(c.col==='wait'&&!waitsOnClaude(c))||(c.col==='prog'&&c.quiet));
const secDone=()=>B.cards.filter(c=>c.col==='done'&&!c.retired&&c.done&&dayNum(today())-dayNum(c.done)<=3&&themeOk(c));
const routineFor=c=>{const p=c.prompt;if(!p)return null;return (B.routines||[]).find(r=>String(p.model||'').startsWith(r.model)&&String(p.effort||'').startsWith(r.effort))||null;};
const startable=c=>{const r=routineFor(c);return !!(r&&r.enabled&&c.lane==='claude'&&c.col==='up'&&!c.start&&!blockedBy(c).length);};
const sessionFor=c=>(B.sessions||[]).find(s=>s.url&&s.url===(c.chat||{}).url);
const modelShort=c=>{const p=c.prompt;if(!p)return '';return String(p.model||'').split(' (')[0].replace('Claude ','')+', '+String(p.effort||'').split(' ')[0];};
function convState(s){
  const cs=(s.cards||[]).map(cardById).filter(Boolean);
  if(cs.some(c=>c.col==='prog'))return ['running','Running'];
  if(cs.some(c=>c.col!=='done'&&(c.lane==='tom'||blockedBy(c).some(x=>x.lane==='tom'))))return ['you','Waiting on you'];
  return ['fin','Finished'];
}
const recentConvs=()=>(B.sessions||[]).filter(s=>nowMs()-Date.parse(s.last)<=3*864e5);
function ageClass(a){return a>=7?'red':a>=3?'amber':'';}
function quietFor(c){const s=sessionFor(c);if(!s){const d=Math.max(1,ageOf(c));return d+' day'+(d===1?'':'s');}const h=Math.max(1,Math.floor((nowMs()-Date.parse(s.last))/36e5));return h<24?h+' hour'+(h===1?'':'s'):Math.floor(h/24)+' day'+(Math.floor(h/24)===1?'':'s');}

function cardHtml(c,ctx){
  const a=ageOf(c),bl=blocksOpen(c),tcol=THEME_COL[c.theme]||'#ccc';
  let meta='<span class="tag" style="background:'+tcol+'">'+esc(c.theme)+'</span>';
  if(c.lane==='tom'&&c.ask&&c.col!=='done') meta+='<span class="ask">'+esc(askName(c.ask))+'</span>';
  if(c.col!=='done') meta+='<span class="age '+ageClass(a)+'">'+a+'d</span>';
  if(c.start) meta+='<span class="age amber">Starting...</span>';
  if(ctx==='ready'&&c.prompt) meta+='<span class="mdl">'+esc(modelShort(c))+'</span>';
  let extra='';
  if(c.lane==='tom'&&c.col!=='done'&&bl.length) extra+='<div class="unb">Unblocks: '+esc(bl[0].title)+(bl.length>1?' and '+(bl.length-1)+' more':'')+'</div>';
  if(ctx==='run'||ctx==='stuck'&&c.col==='prog'){const s=sessionFor(c);extra+='<div class="meta2">'+(c.chat&&c.chat.url?'<a href="'+esc(c.chat.url)+'" target="_blank" rel="noopener" style="color:#ffd34d;font-weight:700">Open chat</a> · ':'')+'last push '+esc(s?ago(s.last):'unknown')+'</div>';}
  if(c.lane==='claude'&&c.col!=='done'){const back=blocksOpen(c).filter(x=>x.lane==='tom');if(back.length)extra+='<div class="fixnext">When this ships, you check again: '+esc(back.map(x=>x.title).join('; '))+'</div>';}
  if(c.quiet) extra+='<div class="quiet">Quiet for '+quietFor(c)+': the conversation may have stopped</div>';
  if(ctx==='stuck'&&c.col==='wait'){const by=blockedBy(c);extra+='<div class="meta2">'+(by.length?'Waits on: '+esc(by.map(x=>x.title).join('; ')):'Waits on '+esc(laneName(c.waiting_on||'')))+'</div>';}
  let row='';
  if(c.lane==='claude'&&c.col!=='done'&&c.prompt&&(ctx==='ready'||ctx==='stuck')) row='<div class="row">'+(startable(c)?'<button class="small good" type="button" data-act="start" data-id="'+esc(c.id)+'">START</button>':'')+'<button class="small gold" type="button" data-act="copy" data-id="'+esc(c.id)+'">Copy prompt</button></div>';
  if(c.start_error&&c.col!=='done') extra+='<div class="quiet">START failed last time: '+esc(c.start_error)+'</div>';
  if(isReview(c)&&(c.col==='up'||c.col==='prog')) row+=rvBtns(c.id);
  return '<div class="card" role="button" tabindex="0" data-id="'+esc(c.id)+'"><div class="t">'+esc(c.title)+'</div><div class="n">'+esc(c.next)+'</div><div class="meta">'+meta+'</div>'+extra+row+'</div>';
}
const rvBtns=id=>'<div class="rv"><button class="good" type="button" data-act="good" data-id="'+esc(id)+'">All good</button><button class="bad" type="button" data-act="wrong" data-id="'+esc(id)+'">Something is wrong</button></div>';
function convHtml(s){
  const [k,l]=convState(s),cs=(s.cards||[]).map(cardById).filter(Boolean);
  return '<div class="conv"><div class="t">'+esc(s.title||'Conversation')+'</div><div class="m"><span class="st '+k+'">'+l+'</span><span>last push '+esc(ago(s.last))+'</span>'+((s.tags||[]).slice(0,3).map(t=>'<span class="age">'+esc(t)+'</span>').join(''))+'<a href="'+esc(s.url)+'" target="_blank" rel="noopener">Open chat</a></div>'+(cs.length?'<div class="m">Cards: '+esc(cs.map(c=>c.title).join('; ').slice(0,160))+'</div>':'')+'</div>';
}
const secOpen={};   // what Tom opened or closed survives the 60 second reload
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.sec)secOpen[d.dataset.sec]=d.open;},true);
function sec(id,name,hint,list,fn,openIt,mine){
  const body=list.length?list.map(fn).join(''):'<div class="none">Nothing here</div>';
  if(id in secOpen) openIt=secOpen[id];
  return '<details class="sec'+(mine?' mine':'')+'" data-sec="'+id+'"'+(openIt?' open':'')+'><summary><span class="nm">'+name+'</span><span class="ct'+(mine&&list.length?' has':'')+'">'+list.length+'</span><span class="cv">'+esc(hint)+'</span></summary>'+body+'</details>';
}
function counts(){
  const n={mine:secYour().length,ready:secReady().length,run:secRun().length,stuck:secStuck().length};
  const b=(k,l,w)=>'<button type="button" data-only="'+k+'" class="'+(only===k?'on ':'')+(w?'warn':'')+'">'+l+' <b>'+n[k]+'</b></button>';
  $('sum').innerHTML=b('mine','Your move',n.mine>0)+b('ready','Ready to start')+b('run','Running')+b('stuck','Stuck',n.stuck>0);

// ---- saving: read the latest file, change that card by id, write it back, so other sessions' edits are kept
async function save(msg,fn){
  const tok=lsGet(TOKEN);
  if(!tok&&!Q.get('gh')) throw new Error('No GitHub token on this phone. Open ADMIN > ART LIBRARY > Setup and paste it, then try again.');
  for(let tries=0;;tries++){
    const r=await fetch(URLF()+'?ref=main&t='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+(tok||'test'),Accept:'application/vnd.github+json'}});
    let doc,s=null;
    if(r.status===404){doc=B;}else if(r.ok){const j=await r.json();s=j.sha;doc=JSON.parse(t64(j.content));}else throw new Error('GitHub '+r.status);
    const next=fn(doc);
    const body={message:msg,content:b64t(JSON.stringify(next,null,1)+'\n'),branch:'main'};if(s)body.sha=s;
    const w=await fetch(URLF(),{method:'PUT',headers:{Authorization:'Bearer '+(tok||'test'),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(w.status===409&&tries<3)continue;
    if(!w.ok) throw new Error('GitHub '+w.status);
    const j=await w.json();sha=(j.content||{}).sha||sha;B=next;return;
  }
}

// comes back to him when the fix ships (R1). Prompts name repo files only: a START run cannot read the Project's claude/ docs (card c-copydocs).
const ASKWORD={pictures:'pictures',animations:'animations',voice:'voice',script:'dialogue'};
const fixModel=c=>c.ask==='play'?['Claude Sonnet 5.5 (row C: a fix from your report, the cause is not known yet)','medium (one report, a small piece of work)']
  :['Claude Opus 5.5 (row D: '+(ASKWORD[c.ask]||'this')+' are judged by taste)','medium (fixing what you named, starting from what is there)'];

function fixPrompt(f){
  const r=f.reports,ids=[...new Set(r.map(x=>x.card))];
  return 'Read CLAUDE.md. You can read only the repo: there is no claude/ folder, so do not look for the Project docs. Read cards '+f.id+' and '+ids.join(', ')+' in data/board.json, history included. Your first push is the commit board: start '+f.id+'.\n\n'
   +'Tom tested and found problems:\n'+r.map((x,i)=>(i+1)+'. Card '+x.card+' ('+x.title+', ask '+x.ask+'). He was asked: '+x.asked+' He wrote: '+x.words+(x.shot?' Screenshot: '+x.shot+' on branch inbox (git fetch --depth=1 origin inbox, then git show origin/inbox:'+x.shot+' into a file in /tmp, and look at it).':'')).join('\n')
   +'\n\nAlso run python3 tools/reports.py list (docs/REPORTS.md): an in-game pencil report filed since '+r[0].at+' about the same thing belongs to this fix. Fix it here and mark it with python3 tools/reports.py done and its id.\n\n'
   +'For each problem: reproduce it, fix it, test, and look at the frames in portrait and landscape. A problem you cannot fix without Tom: write why, and the one thing needed, as a history line on his card. Before you push, rewrite the next step of card '+ids.join(', ')+' to say exactly what to look at again (shipping moves it back to Tom), keep after set to '+ids[0]+', and give the build '+f.tag+' a docs/CHANGES.md heading; the entry quotes his words.'+PERM;
}
let shotData='';
function readShot(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(im.width*k));cv.height=Math.max(1,Math.round(im.height*k));
    cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(u);ok(cv.toDataURL('image/jpeg',.82));};
  im.onerror=()=>{URL.revokeObjectURL(u);no(new Error('That picture could not be read. Try a screenshot from Photos.'));};im.src=u;});}

async function sendWrong(id){
  const words=clean($('wtxt').value).replace(/\s*\n\s*/g,' / ');
  if(!words){$('serr').textContent='Say what you saw first.';return;}
  if(!lsGet(TOKEN)&&!Q.get('gh')){$('serr').textContent='No GitHub token on this phone. Open ADMIN > ART LIBRARY > Setup and paste it, then try again.';return;}
  const btn=$('wgo');btn.disabled=true;btn.textContent='Sending...';$('serr').textContent='';
  let shot='',shotErr='';
  if(shotData){shot='board-shots/'+id+'-'+Date.now().toString(36)+'.jpg';
    try{await putFile(shot,shotData.split(',')[1],'board: screenshot for '+id,'inbox');}catch(e){shotErr=e.message;shot='';}}
  const at=new Date().toISOString();let res=null;
  try{
    await save('board: something is wrong '+id,d=>{
      const z=d.cards.find(q=>q.id===id);if(!z)throw new Error('This card is gone from the board. Close and reload.');
      const [model,effort]=fixModel(z),rt=(d.routines||[]).find(r=>r.enabled&&model.startsWith(r.model)&&effort.startsWith(r.effort));
      const waits=k=>d.cards.some(x=>x.col!=='done'&&(x.blocks||[]).includes(k.id));
      let f=d.cards.find(k=>k.fix&&k.lane==='claude'&&k.col==='up'&&!k.start&&k.theme===z.theme&&k.prompt&&String(k.prompt.model).split(' (')[0]===model.split(' (')[0]&&!waits(k)),merged=!!f;
      if(!f){
        const tags=new Set(d.cards.map(k=>k.tag)),idsT=new Set(d.cards.map(k=>k.id)),base=z.id.replace(/^t-/,'');let n=1,fid='c-fix-'+base,tag='fix-'+base;
        while(idsT.has(fid)||tags.has(tag)){n++;fid='c-fix-'+base+'-'+n;tag='fix-'+base+'-'+n;}
        f={id:fid,tag,lane:'claude',col:'up',fix:true,theme:z.theme,title:'Fix what you found on: '+String(z.title).slice(0,90),next:'',blocks:[],created:today(),changed:today(),reports:[],
           chat:{url:'',opening:'Something is wrong on '+z.id},history:[],prompt:{what:'Fixes the problems you reported on '+String(z.title).slice(0,90)+'.',before:['Nothing to do first. Your words and screenshot are on the card.'],model,effort,text:''}};
        d.cards.push(f);touch(f,'Made by Something is wrong on '+z.id+'.');
      }
      f.reports=(f.reports||[]).concat([{at,card:z.id,title:clean(z.title),ask:z.ask,words,shot,asked:clean(z.next).replace(/\s*\n\s*/g,' ')}]);
      if(!f.blocks.includes(z.id))f.blocks.push(z.id);
      f.after=f.reports[0].card;f.prompt.text=fixPrompt(f);
      touch(f,'Tom reported on '+z.id+': '+words+(shot?' Screenshot: '+shot+' on branch inbox.':'')+(shotErr?' (The screenshot did not upload: '+shotErr+'.)':''));
      if(rt&&!merged){f.auto=true;f.start=true;touch(f,'Auto-start: Tom reported a problem, so this fix starts by itself.');}
      const n=f.reports.length;
      f.next='You reported '+(n===1?'a problem':n+' problems')+' on '+[...new Set(f.reports.map(x=>x.title))].join('; ')+'. '+(f.start?'Claude starts the fix by itself.':'Copy the prompt into a new conversation in the Project on '+shortOf(f.prompt)+'.')+' Latest: '+words.slice(0,160);
      z.col='wait';z.waiting_on='claude';delete z.quiet;
      touch(z,'Tom: something is wrong: '+words+' Sent to Claude as card '+f.id+'; this card waits on it and comes back to you when the fix ships.');
      res={fid:f.id,auto:!!f.start,merged,title:z.title,ftitle:f.title,p:f.prompt};
      return d;});
  }catch(e){btn.disabled=false;btn.textContent='Send to Claude';$('serr').textContent=e.message;return;}
  render();toast('Sent to Claude');
  let h='<h2>Sent to Claude.</h2><p class="what">';
  if(res.auto) h+='Claude starts fixing this by itself in about a minute, and "'+esc(res.title)+'" comes back to you to check when the fix ships.</p>';
  else h+=(res.merged?'Added to the fix "'+esc(res.ftitle)+'" (not started yet): paste':'Paste')+' the prompt below into a new conversation in the Project on '+esc(shortOf(res.p))+', and "'+esc(res.title)+'" comes back to you to check when the fix ships.</p>'
    +'<div class="big">'+esc(shortOf(res.p))+'</div><div class="btns"><button class="gold" type="button" data-act="copy" data-id="'+esc(res.fid)+'">Copy prompt</button><a href="'+PROJECT+'" target="_blank" rel="noopener">Open the Project in Claude</a></div>';
  if(shotErr) h+='<p class="err">The screenshot did not upload ('+esc(shotErr)+'). Your words were sent.</p>';
  $('sheet').innerHTML=h+'<div class="btns"><button id="bclose" type="button">Close</button></div><p class="err" id="serr"></p><div id="act"></div>';$('sheet').scrollTop=0;
}

  run('board: all good '+id,d=>{const z=d.cards.find(q=>q.id===id);if(z){z.col='done';z.done=today();delete z.waiting_on;delete z.quiet;touch(z,'Tom: all good.');}return d;},'Marked all good',()=>savedScreen(id));
}
document.addEventListener('input',e=>{if(e.target.id==='wtxt'&&$('serr'))$('serr').textContent='';});
document.addEventListener('change',async e=>{
  if(e.target.id!=='wshot'||!e.target.files||!e.target.files[0])return;
  try{shotData=await readShot(e.target.files[0]);$('wprev').innerHTML='<img alt="screenshot" src="'+shotData+'"> <span class="hint">Added</span>';}catch(err){shotData='';$('serr').textContent=err.message;}
});
function copyText(x){const ok=()=>toast('Prompt copied');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(x).then(ok,()=>fall(x,ok));}else fall(x,ok);}
function fall(x,ok){const ta=document.createElement('textarea');ta.value=x;ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok();}catch(e){toast('Select the text and copy it');}ta.remove();}

document.addEventListener('click',e=>{
  const t=e.target;
  const act=t.closest('[data-act]');
  if(act&&act.dataset.act==='copy'){const c=cardById(act.dataset.id);if(c&&c.prompt)copyText(withId(c));e.stopPropagation();return;}
  if(act&&act.dataset.act==='start'){startCard(act.dataset.id);e.stopPropagation();return;}
  if(act&&act.dataset.act==='good'){allGood(act.dataset.id);e.stopPropagation();return;}
  if(act&&act.dataset.act==='wrong'){wrongForm(act.dataset.id);e.stopPropagation();return;}
  if(t.id==='wpick'){$('wshot').click();return;}
  if(t.id==='wgo'){sendWrong(cur);return;}
  if(t.closest('a'))return;
  const card=t.closest('.card');if(card&&!$('sheet').contains(t)){openSheet(card.dataset.id);return;}
  const chip=t.closest('.chip');if(chip){theme=chip.dataset.t==='All'?'':chip.dataset.t;render();return;}
  const on=t.closest('[data-only]');if(on){only=only===on.dataset.only?'':on.dataset.only;render();return;}
  if(t.id==='dim'||t.id==='bclose'){closeSheet();return;}
  if(t.id==='bpaste'){const c=cardById(cur);if(c)copyText(c.paste);return;}
  if(t.id==='bcopy'){const c=cardById(cur);copyText(c?withId(c):$('ptxt').textContent);return;}
  const chb=t.closest('[data-choice]');
  if(chb){const id=cur,c=cardById(id);if(!c)return;
    if(chb.dataset.choice==='other'){showAct('<input type="text" id="ntxt" placeholder="Your answer"><button class="gold" id="bchgo" type="button">Save my answer</button>');return;}
    const ans=clean(String(c.choices[+chb.dataset.choice]).replace(/\s*\(Recommended\)$/,''));
    run('board: answer '+id,d=>{const z=d.cards.find(q=>q.id===id);if(z){z.col='done';z.done=today();z.answer=ans;delete z.waiting_on;delete z.quiet;touch(z,'Tom chose: '+ans);}return d;},'Answer saved',()=>savedScreen(id));return;}
  if(t.id==='bchgo'){const id=cur,tx=clean($('ntxt').value);if(!tx){$('serr').textContent='Type your answer first.';return;}
    run('board: answer '+id,d=>{const z=d.cards.find(q=>q.id===id);if(z){z.col='done';z.done=today();z.answer=tx;delete z.waiting_on;delete z.quiet;touch(z,'Tom answered: '+tx);}return d;},'Answer saved',()=>savedScreen(id));return;}
  if(t.id==='bstart'){startCard(cur);return;}
  if(t.id==='bdid'){showAct('<input type="text" id="ntxt" placeholder="Anything Claude should know? (optional)"><button class="good" id="bdidgo" type="button">Done</button>');return;}
  if(t.id==='bdidgo'){const id=cur,tx=clean($('ntxt').value);
    run('board: done '+id,d=>{const c=d.cards.find(z=>z.id===id);if(c){c.col='done';c.done=today();delete c.waiting_on;delete c.quiet;if(tx)c.note=tx;touch(c,'Tom did this.'+(tx?' Note: '+tx:''));}return d;},'Marked done',()=>savedScreen(id));return;}
  if(t.id==='btake'){showAct('<input type="text" id="ntxt" placeholder="What do you want done?"><button class="gold" id="btakego" type="button">Hand to Claude</button>');return;}
  if(t.id==='btakego'){const id=cur,tx=clean($('ntxt').value);if(!tx){$('serr').textContent='Type what you want done first.';return;}
    run('board: take '+id,d=>{const c=d.cards.find(z=>z.id===id);if(c){
      c.lane='claude';c.col='up';delete c.waiting_on;delete c.done;delete c.done_when;c.tag=c.tag||id;c.note=tx;
      c.next='Handed to Claude by Tom: '+tx;
      c.prompt={what:'Works out what Tom wants from his note, rewrites this card, and does the work.',before:['Nothing to do first.'],model:'Claude Sonnet 5.5 (row C: the steps are not written yet)',effort:'medium (a handed-over card is usually one piece of work)',
        text:'Read claude/handoff-rules.md. Tom handed you board card '+id+' with this note: '+tx+'. Work out what is needed, rewrite the card, and do it.'+PERM};
      touch(c,'Tom handed this to Claude: '+tx);}return d;},'Handed to Claude');return;}
  if(t.id==='bnot'){showAct('<input type="text" id="ntxt" placeholder="Why is it not needed?"><button class="gold" id="bnotgo" type="button">Retire this card</button>');return;}
  if(t.id==='bnotgo'){const id=cur,tx=clean($('ntxt').value);if(!tx){$('serr').textContent='Say why in a few words.';return;}
    run('board: retire '+id,d=>{const c=d.cards.find(z=>z.id===id);if(c){c.col='done';c.done=today();c.retired=true;delete c.waiting_on;delete c.quiet;touch(c,'Not needed: '+tx);}return d;},'Retired');return;}
  if(t.id==='bnote'){showAct('<input type="text" id="ntxt" placeholder="Note"><button class="gold" id="ngo" type="button">Save note</button>');return;}
  if(t.id==='ngo'){const id=cur,tx=clean($('ntxt').value);if(!tx){$('serr').textContent='Type a note first.';return;}
    run('board: note '+id,d=>{const c=d.cards.find(z=>z.id===id);if(c)touch(c,'Tom: '+tx);return d;},'Note saved');return;}
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('card')){e.preventDefault();openSheet(e.target.dataset.id);}});
load().then(render).catch(e=>{$('err').textContent=e.message;$('sum').textContent='Could not load the board';});
window.__board={get B(){return B;},render,reload};
</script>
</body>
</html>
