<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0f2a2e">
<meta name="apple-mobile-web-app-title" content="AoT Battle Guide">
<link rel="apple-touch-icon" sizes="180x180" href="icon-battleguide-180.png?v=battleguide1">
<link rel="icon" type="image/png" sizes="32x32" href="icon-battleguide-32.png?v=battleguide1">
<title>Adventures of Tom Battle Guide</title>
<style>
/* battle-guide.html (battleguide1): the reference guide for the new battle system ("Battle 3"). It loads no game engine. Every number, move,
   monster and status is read from the game's own data files (the script tags of index.html), so the guide is always the version being played.
   Layouts: one column with a bottom tab bar (a phone, the Duo folded: 466 x 657 and 678 x 445) and two panes (the Duo unfolded: 951 x 648 and
   669 x 869, tablets, desktop). The switch is "both sides at least 560 px", the same number the game uses for an unfolded Duo (docs/DUO.md). */
:root{--bg:#0f1f24;--surface:#16303a;--card:#1a3742;--line:#28505c;--text:#f1fbfa;--muted:#9cc3c4;--accent:#ffd34d;--on-accent:#241b00;--good:#2fb06a;--prob:#b4414f;--prob-text:#ff9aa5;--btn:#2c5b68;--well:#0a161a;
 --clobber:#f0c27b;--sizzle:#ff8c5a;--drench:#7cc4f2;--razzle:#ffe27a;--racket:#d7a4f5;--support:#8fe3a6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,system-ui,"Segoe UI",sans-serif}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
a{color:var(--text)}
button{font:inherit;border:0;border-radius:12px;padding:10px 14px;min-height:44px;background:var(--btn);color:#fff;font-weight:600;cursor:pointer}
button.gold{background:var(--accent);color:var(--on-accent)}
button.ghost{background:none;border:1px solid var(--line)}
button:disabled{opacity:.5}
header{flex:none;display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;height:54px;border-bottom:1px solid var(--line)}
header .brand{flex:1 1 auto;min-width:0;line-height:1.1}
header .brand{display:flex;align-items:center;gap:8px}
header h1{flex:none;font-size:19px;margin:0;white-space:nowrap}
/* The standard build pill (same look as the Builds screen, build-history.css .bl-chip.bl-name.live): tap opens that build's details. */
a.bpill{flex:0 1 auto;min-width:0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;padding:3px 11px;border:1px solid #4fae7a;border-radius:13px;background:#143324;color:#9be3bb;font:700 13px/1.4 ui-monospace,Menlo,monospace;letter-spacing:.3px;text-decoration:none}
/* Narrow (a folded Duo is about 360 wide): Search becomes an icon and Lab is reached through Admin, so the pill keeps room. */
@media (max-width:480px){header{gap:6px;padding-left:12px}header h1{font-size:18px}header .brand{gap:6px}header a.hb[href="battle-lab.html"]{display:none}header #bsearch{font-size:0;min-width:44px;padding:0}header #bsearch::before{content:"\1F50D";font-size:17px}a.bpill{padding:3px 9px;font-size:12px}}
a.bpill:active{opacity:.7}a.bpill[hidden]{display:none}
header a.hb,header button.hb{flex:none;display:flex;align-items:center;justify-content:center;min-width:44px;height:44px;padding:0 10px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:700;text-decoration:none;font-size:14px}
#actbar,#qbar{flex:none;display:block;width:100%;text-align:left;border-radius:0;min-height:36px;padding:7px 14px;font-size:14px;font-weight:700}
#actbar{background:var(--accent);color:var(--on-accent)}
#qbar{background:#2a1519;color:var(--prob-text);border-bottom:1px solid var(--prob)}
.qline{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:6px 0;font-size:14px;color:var(--text)}
.qline.bad .qtext{color:var(--prob-text)}.qline.good .qtext{color:var(--good)}
.qtext{flex:1 1 170px;min-width:0}.qclock{font-variant-numeric:tabular-nums;font-weight:800}
.qbtns{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}.qbtns button,.qline button{min-height:44px;padding:8px 12px;font-size:14px}
.qerr{font-size:14px;margin:4px 0}.qsub{font-size:12px;color:var(--muted)}
body.qgrey .qline,body.qgrey .qpic{opacity:.5}
.qpic{display:flex;gap:12px;align-items:flex-start;margin:8px 0}.qpic img,.qpic .ph{flex:none;width:64px;height:64px;border-radius:12px;object-fit:cover;object-position:top;background:var(--well);display:flex;align-items:center;justify-content:center;font-weight:800}
.qpb{flex:1 1 auto;min-width:0}.qtop{margin:12px 0}
.qconf{margin:8px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--well)}.qconf p{margin:0 0 6px;font-size:14px}.qpic .qprev{width:auto;max-width:100%;height:auto;max-height:min(220px,38vh);object-fit:contain;border-radius:10px;margin:0 0 8px}.qall{margin:8px 0}
.qact .qname{background:none;color:var(--text);padding:0;min-height:36px;font-weight:800;text-align:left;font-size:15px}
#tabs{flex:none;display:flex;gap:4px;padding:6px 8px calc(6px + env(safe-area-inset-bottom));background:var(--well);border-top:1px solid var(--line);order:9}
#tabs button{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;min-height:50px;background:none;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.02em;border-radius:10px}
#tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tabs button[aria-selected=true]{color:var(--on-accent);background:var(--accent)}
#panes{flex:1 1 auto;min-height:0;display:flex;position:relative;overflow:hidden}
#list,#detail{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
#list{flex:1 1 auto;padding:12px 12px 24px}
#detail{position:absolute;inset:0;background:var(--bg);padding:0 14px 32px;transform:translateX(100%);transition:transform .18s ease;z-index:3}
#detail.open{transform:none}
#dback{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:8px;margin:0 -14px 8px;padding:6px 10px;background:var(--bg);border-bottom:1px solid var(--line)}
#dback button{background:none;padding:6px 10px;color:var(--accent)}
#dback b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
h2{font-size:22px;margin:14px 0 6px}
h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
p{margin:8px 0}
.hint{color:var(--muted);font-size:14px}
.err{color:var(--prob-text)}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:0 0 8px;min-height:60px;font-weight:500}
.row.on{outline:2px solid var(--accent)}
.row img,.row .ph{flex:none;width:44px;height:44px;border-radius:10px;object-fit:cover;object-position:top;background:var(--well)}
.row .ph{display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--muted)}
.row .t{flex:1 1 auto;min-width:0}
.row .t b{display:block;font-size:16px}
.row .t>span{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .n{flex:none;font-size:12px;color:var(--muted);text-align:right}
.grp{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 2px 8px}
.grp:first-child{margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--well);border:1px solid var(--line);white-space:nowrap}
.chip i{width:9px;height:9px;border-radius:50%}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.fl-clobber{color:var(--clobber)}.fl-sizzle{color:var(--sizzle)}.fl-drench{color:var(--drench)}.fl-razzle{color:var(--razzle)}.fl-racket{color:var(--racket)}.fl-support{color:var(--support)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px}
.card h4{margin:0;font-size:16px}
.card .k{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card p{margin:6px 0 0;font-size:15px}
.card .top{display:flex;align-items:flex-start;gap:10px}
.card .top>div{flex:1 1 auto;min-width:0}
.play{flex:none;min-width:44px;height:44px;padding:0 12px;border-radius:22px;background:var(--btn);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.play.vid{background:var(--accent);color:var(--on-accent)}
.play svg{width:14px;height:14px;fill:currentColor}
table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.hero{display:flex;gap:14px;align-items:center;margin-top:14px}
.hero img{flex:none;width:92px;height:92px;border-radius:18px;object-fit:cover;object-position:top;background:var(--well)}
.hero h2{margin:0}
.mprog{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 10px}
.mprog .mt{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.mprog .mt b{font-size:18px}.mprog .mt span{font-size:12px;color:var(--muted)}
.mbar{height:10px;border-radius:999px;background:var(--well);border:1px solid var(--line);overflow:hidden;margin:8px 0 10px}.mbar i{display:block;height:100%;background:var(--good);min-width:0}
.mchips{display:flex;flex-wrap:wrap;gap:6px}.mchips button{min-height:40px;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:700}.mchips button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}.mchips button b{margin-left:5px;font-weight:900}
.sdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:baseline;background:var(--muted)}
.sword{font-size:12px;font-weight:700;color:var(--muted);margin-left:4px}
.s-novideo .sdot,.sdot.s-novideo{background:var(--prob)}.s-todo .sdot,.sdot.s-todo{background:#8fd3ff}.s-inprogress .sdot,.sdot.s-inprogress,.sdot.s-changed{background:#d9a82b}
.sdot.s-waitvideo,.sdot.s-waitpicture,.sdot.s-waitclaude{background:#b69cff}.sdot.s-finished{background:var(--good)}
.seg{display:flex;gap:6px;margin:10px 0}
.seg button{flex:1 1 0;min-width:0;background:var(--surface);border:1px solid var(--line);font-size:14px;padding:8px 6px}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.pips{letter-spacing:2px;color:var(--accent)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.stats div{background:var(--well);border-radius:12px;padding:8px;text-align:center}
.stats b{display:block;font-size:18px}
.stats span{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
input[type=search],textarea{width:100%;font:inherit;color:var(--text);background:var(--well);border:1px solid var(--line);border-radius:12px;padding:11px 12px}
textarea{min-height:92px;resize:vertical}
#searchbar{flex:none;padding:8px 12px;border-bottom:1px solid var(--line)}
.anim{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 8px 8px 12px;margin:0 0 8px;min-height:60px}
.anim .t{flex:1 1 auto;min-width:0}
.anim .t b{display:block;font-size:15px}
.anim .t>span{display:block;font-size:12px;color:var(--muted);margin-top:3px}
.badge{font-size:11px;font-weight:800;padding:2px 7px;border-radius:999px;background:var(--well);border:1px solid var(--line);color:var(--muted)}
.badge.v{color:#0d2b18;background:var(--good);border-color:var(--good)}
.badge.n{color:var(--prob-text)}
.badge.w{color:#10202a;background:#8fd3ff;border-color:#8fd3ff}
.badge.r{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.badge.o{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
#dim{position:fixed;inset:0;background:#000a;display:none;z-index:20}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:96vh;overflow-y:auto;background:var(--surface);border-radius:18px 18px 0 0;border-top:1px solid var(--line);padding:12px 14px calc(18px + env(safe-area-inset-bottom));display:none;z-index:21}
#sheet.open,#dim.open{display:block}
#sheet .sh-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#sheet .sh-top h2{flex:1 1 auto;min-width:0;margin:0;font-size:19px}
#stage{position:relative;background:linear-gradient(#17343d 0,#17343d 78%,#0d2228 78%,#0d2228 100%);border-radius:14px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;height:min(46vh,340px)}
#stage canvas{max-width:100%;max-height:100%;image-rendering:auto}
#stage .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:var(--muted);font-size:15px}
#hitflag{position:absolute;top:10px;right:10px;font-weight:900;font-size:13px;letter-spacing:.08em;padding:4px 9px;border-radius:8px;background:var(--accent);color:var(--on-accent);opacity:0}
/* movebench1: the Preview the whole move box. The frame is one iframe (bench.html: the game's own battle code) that floats over the box, so it survives the sheet being rebuilt for the next animation. */
.bench{margin:0 0 10px}
.bench .btag{font:800 11px/1.2 system-ui,sans-serif;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.bslot{position:relative;aspect-ratio:16/9;width:min(100%,calc(46vh*16/9));margin:0 auto;border-radius:12px;background:#0b1a16;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.bslot .bgo{padding:12px 18px;font-weight:800}
.bslot .bmsg{position:absolute;left:8px;right:8px;bottom:6px;text-align:center;color:var(--muted);font-size:12px}
.bctl{flex-wrap:wrap;justify-content:center}
.bctl button{padding:8px 12px;min-height:40px}
.bctl .bsp[aria-pressed=true],.bctl #bnloop[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.bctl #bnplay{background:var(--accent);color:var(--on-accent);font-weight:800;min-width:96px}
.bctl #bnclock{margin-left:auto;color:var(--muted);font-size:13px}
#benchframe{position:fixed;z-index:22;border:0;border-radius:12px;background:#0b1a16;display:none}
/* movebench2: the bar under the preview. One lane per layer on one clock, the HIT line and the playhead you drag. */
.bbar{--body:#7cc4f2;--stage:#d7a4f5;--fx:#ff8c5a;--snd:#8fe3a6;--hit:#ffd34d;position:relative;padding:2px 8px 8px;margin:2px 0 0;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:ew-resize}
.bbar .ln{display:flex;align-items:center;height:20px;margin-top:3px}
.bbar .ln .lb{flex:none;width:54px;white-space:nowrap;overflow:hidden;font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.bbar .ln .tr{position:relative;flex:1 1 auto;height:100%;background:#12272e;border-radius:5px}
.bbar .ln .it{position:absolute;top:2px;bottom:2px;border-radius:4px;font-size:10px;font-weight:700;line-height:16px;padding:0 4px;color:#08161a;white-space:nowrap;overflow:hidden;box-sizing:border-box}
.bbar .ln.body .it{background:var(--body)}.bbar .ln.stage .it{background:var(--stage)}.bbar .ln.fx .it{background:var(--fx)}.bbar .ln.snd .it{background:var(--snd);border-radius:7px}
.bbar .ln .trh{position:absolute;top:0;bottom:0;width:16px;margin-left:-8px;z-index:4;cursor:ew-resize;touch-action:none;background:linear-gradient(90deg,transparent 6px,#fff 6px,#fff 10px,transparent 10px);border-radius:3px}
.bbar .ln .trh:hover,.bbar .ln .trh:focus{background:linear-gradient(90deg,transparent 4px,#ffd24a 4px,#ffd24a 12px,transparent 12px)}
.wbtrimtx{font-weight:700;margin-right:6px}
.bbar .ln .it.need{background:repeating-linear-gradient(45deg,#ff5bd2,#ff5bd2 5px,#c23a9c 5px,#c23a9c 10px);color:#fff}
.bbar .ln .it.hold{background:repeating-linear-gradient(90deg,#3d6f8a,#3d6f8a 4px,#2c5468 4px,#2c5468 8px);color:#d6efff}
.bbar .hw{position:absolute;left:62px;right:8px;top:0;bottom:16px;pointer-events:none}
.bbar .hw b{position:absolute;top:0;bottom:0;width:2px;background:var(--hit)}
.bbar .hw b::after{content:"HIT";position:absolute;top:-1px;right:5px;font-size:9px;font-weight:900;color:var(--hit)}
.bbar .hw u{position:absolute;top:0;bottom:0;width:2px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.5);text-decoration:none}
.bbar .hw u::after{content:"";position:absolute;top:-2px;left:-5px;border:6px solid transparent;border-top-color:#fff}
.bbar .hw i{position:absolute;top:0;bottom:0;width:1px;background:#ffffff44}
.bbar .sc{display:flex;justify-content:space-between;margin:1px 0 0 54px;font-size:9px;color:var(--muted);font-variant-numeric:tabular-nums;padding-left:8px}
.bctl .bst{min-width:44px}
.bctl #bnans[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.ctl{display:flex;align-items:center;gap:8px;margin:10px 0}
.ctl input[type=range]{flex:1 1 auto;min-width:0;accent-color:var(--accent);height:44px}
.ctl button{padding:8px 12px}
.ctl .spd[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000d;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:40;max-width:90vw}
.big{font-size:20px;font-weight:800;margin:6px 0}
pre.prompt{white-space:pre-wrap;word-break:break-word;background:var(--well);border:1px solid var(--line);border-radius:12px;padding:10px;font:13px/1.4 ui-monospace,Menlo,monospace;max-height:180px;overflow:auto}
ol.steps{margin:6px 0 6px 20px;padding:0}
ol.steps li{margin:4px 0}
#boot{padding:30px 16px;color:var(--muted)}
.gen{border-top:1px solid var(--line);margin-top:6px}
.gen .meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.gen .meta .chip{font-weight:600}
.gen pre.prompt{max-height:none}
.gen .why{border-left:3px solid var(--accent);padding:2px 0 2px 10px;margin:8px 0;font-size:14px}
.gen textarea{min-height:84px}
.gen textarea.big{min-height:300px;font:13px/1.45 ui-monospace,Menlo,monospace}
.gen .lines p{margin:4px 0;font-size:14px}
.gen .lines b{color:var(--accent)}
.gen .q{border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:8px 0}
.gen .chk{border:1px solid var(--prob);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;color:var(--prob-text)}
.gen .row2{display:flex;gap:8px;margin-top:8px}.gen .row2 button{flex:1}
.gen .conf,.gen .take{border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:8px 0}
.gen .cmp{display:flex;gap:8px;margin:8px 0}.gen .cmp>div{flex:1 1 0;min-width:0}.gen .cmp .lab{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.gen .cmp .box{background:linear-gradient(#17343d 0,#17343d 78%,#0d2228 78%,#0d2228 100%);border-radius:12px;display:flex;justify-content:center;align-items:flex-end;height:min(34vh,260px);overflow:hidden}
.gen .cmp canvas{max-width:100%;max-height:100%}
.gen .gate{font-size:14px;margin:6px 0}.gen .gate.hold{color:var(--prob-text)}
.gen .row3{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.gen .stopbox{border:1px solid var(--prob);background:#2a1519;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;color:var(--prob-text)}
.gen .cant{border:1px solid var(--prob);background:#2a1519;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px;color:var(--prob-text)}
/* PLANNED look (battleguide2): one look for everything the plan has and the game does not yet: dashed gold border, the PLANNED badge, and the words "not in the game yet".
   Never used for anything that can be tested today. Items come from data/guide-planned.json (tools/guide_planned.py) and drop out by themselves when the game's data gains them. */
.plan{border:1px dashed #d9b84a!important;background:#1b2b2d!important}

<script>
'use strict';
// ---------- small helpers ----------
const Q=new URLSearchParams(location.search);
const REPO='trivituso81/adventures-of-tom',BOARD='data/board.json',TOKEN='aot-gh-token';
const PERM=' Attach trivituso81/adventures-of-tom with push access (add_repo).';
const PROJECT='https://claude.ai/project/01a14d08-5251-75c8-a191-5d11f4245788';
const GH=()=>(Q.get('gh')||'https://api.github.com').replace(/\/+$/,'');
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lsGet=k=>{try{return localStorage.getItem(k)||'';}catch(e){return '';}};
const b64t=s=>{const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b);};
const t64=s=>{const bin=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const pct=v=>Math.round(v*100)+'%';
const cap=s=>String(s).charAt(0).toUpperCase()+String(s).slice(1);
const words=s=>String(s).replace(/_/g,' ');
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>t.style.display='none',3200);}
const wide=()=>matchMedia('(min-width:560px) and (min-height:560px)').matches;

// ---------- loading the game's own data ----------
// The clip files call bclipDefine (engine/clips.js in the game). Here it only keeps the clip's numbers; the picture loads when a clip is played.
const CLIPS={};            // clip id -> its data, once its file is loaded
const CLIP_SRC={};         // clip id -> the address of its data file, read from index.html
function bclipDefine(id,D){CLIPS[id]=D;}
let FXD=null,FX_P=null;   // movebench7: data/movebench-fx.json
let WORDS=null,WORDS_P=null;   // movebench5: data/movebench-words.json, every label of the workbench
let MANI=null,MANI_P=null;   // guidecross1: data/guide-manifest.json (tools/guidegen/manifest_crosswalk.py)
let BUILD='',BOARD_DOC=null,GUIDE=null,GUIDE_P=null,PLAN_DOC=null,INDEX_SRCS=[];   // GUIDE: data/guide-anims.json (guidegen1a): per animation its prompt, start picture, price and what is missing
function addScript(src){return new Promise((ok,no)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>no(new Error('Could not load '+src));document.head.appendChild(s);});}
async function boot(){
  try{
    const r=await fetch('index.html?t='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Could not read the game page ('+r.status+')');
    const html=await r.text();
    const srcs=[...html.matchAll(/<script[^>]+src="([^"]+)"/g)].map(m=>m[1]);
    for(const s of srcs){const m=s.match(/^data\/clips\/([^.?]+)\.js/);if(m)CLIP_SRC[m[1].replace(/-/g,'_')]=s;}
    INDEX_SRCS=srcs;
    const data=srcs.filter(s=>/^data\/b3-/.test(s));
    if(!data.length) throw new Error('The game page lists no battle data files');
    for(const s of data) await addScript(s);   // in the game's own order: rules first, then statuses, kits, monsters
    for(const s of srcs) if(/^data\/move-specs\.js/.test(s)) await addScript(s).catch(()=>{});   // movebench5: what the game plays for each animation (MOVE_SPECS), read by msLive for the workbench's read-only sections
    for(const s of srcs) if(/^engine\/b3-spec\.js/.test(s)) await addScript(s).catch(()=>{});
    for(const s of srcs) if(/^engine\/(b3-vfx|vfx-library)\.js/.test(s)) await addScript(s).catch(()=>{});   // movebench7: the game's own effect drawers (P1_VFX), for the samples of the Effects section
    FX_P=fetch('data/movebench-fx.json?t='+Date.now(),{cache:'no-store'}).then(x=>x.ok?x.json():null).then(j=>{FXD=j;return j;}).catch(()=>null);   // movebench7: the 37 effects and their settings (tools/movebench/fxparams.py)
    WORDS_P=fetch('data/movebench-words.json?t='+Date.now(),{cache:'no-store'}).then(x=>x.ok?x.json():null).then(j=>{WORDS=j;return j;}).catch(()=>null);   // movebench5: every label of the workbench

// ---------- animations: one list for the whole guide ----------
// An animation is: a body state of someone (idle, hit...), a family move, or a monster act (plus its wind-up). `clip` is its video's id when it has one.
let ANIMS=[],ANIM_BY={};
function owners(){return Object.keys(B3_CAST).concat(Object.keys(B3_FOES));}
const ownerName=id=>((GUIDE&&GUIDE.owners&&GUIDE.owners[id])||{}).name||(B3_CAST[id]||B3_FOES[id]||{}).name||(id==='team'?'Everyone':cap(id));   // movebench6: team holds Pick-Me-Up, the move every family member has
// movebench12: the spec's body of an animation, {clip, motion} (null clip when it has none)
const msBodyClipOf=id=>{const b=typeof msLive==='function'&&msLive(id);return {clip:(b&&b.body&&b.body.clip)||null,motion:(b&&b.body&&b.body.motion)||''};};
function buildAnims(){
  ANIMS=[];ANIM_BY={};
  const add=a=>{a.video=!!(a.clip&&CLIP_SRC[a.clip]);ANIMS.push(a);ANIM_BY[a.id]=a;};
  const body=id=>{
    const C=typeof msStatesOf==='function'?msStatesOf(id):{};   // movebench12: a state's video is its spec's body.clip
    const VO=(typeof B3_VIDEO_ONLY!=='undefined'&&B3_VIDEO_ONLY.includes(id))||!!(GUIDE&&GUIDE.anims&&GUIDE.anims['body:'+id+':idle']);   // startpics5: a person the data file lists the family states for (Amy, Boppy, Justin, Olivia, TNB, Nara) lists them here too
    const order=['idle','guard','hit','dodge','ko','victory','run','give','slip','flustered','die'];
    order.concat(Object.keys(C).filter(k=>!order.includes(k))).forEach(st=>{
      if(C[st]) add({id:'body:'+id+':'+st,owner:id,kind:'state',name:STATE[st]||cap(st),clip:C[st],what:'body state '+st});
      else if(VO&&['idle','guard','hit','dodge','ko','victory','run'].includes(st)) add({id:'body:'+id+':'+st,owner:id,kind:'state',name:STATE[st]||cap(st),clip:null,what:'body state '+st});   // wanch2a: a video-only member lists every family state; one with no clip shows one of their other videos in a fight
    });
  };
  Object.keys(B3_CAST).forEach(id=>{body(id);
    Object.values(B3_SKILLS).filter(s=>s.vibe&&B3_VIBES[s.vibe]&&B3_VIBES[s.vibe].owner===id).forEach(s=>{const a=msBodyClipOf('move:'+s.id);
      add({id:'move:'+s.id,owner:id,kind:'move',name:s.name,clip:a.clip,shape:a.motion||'',what:'move '+s.id+' in data/b3-kit-'+id+'.js',vibe:B3_VIBES[s.vibe].name});
      const ga=GUIDE&&GUIDE.anims&&GUIDE.anims['answer:'+s.id];   // movebench11: a move with a counter video has a row of its own (data/guide-anims.json), made through the same Make this video flow
      if(ga){const sp=typeof msLive==='function'?msLive('move:'+s.id):null,c=sp&&sp.answer&&sp.answer.clip||null;add({id:'answer:'+s.id,owner:id,kind:'answer',name:ga.name,clip:c,what:'counter video of move '+s.id,vibe:B3_VIBES[s.vibe].name});}});
  });
  if(B3_SKILLS.pick_me_up)add({id:'move:pick_me_up',owner:'team',kind:'move',name:B3_SKILLS.pick_me_up.name,clip:null,shape:'',what:'move pick_me_up in data/b3-rules.js'});   // movebench6: the universal move gets a row of its own
  Object.values(B3_FOES).forEach(f=>{body(f.id);
    f.acts.forEach(act=>{const a=msBodyClipOf('act:'+f.id+':'+act.id),wc=msBodyClipOf('wind:'+f.id+':'+act.id).clip;
      add({id:'act:'+f.id+':'+act.id,owner:f.id,kind:'act',name:act.name,clip:a.clip,what:'act '+act.id+' of '+f.id+' in data/b3-foes-ch'+String(f.ch).padStart(2,'0')+'.js'});
      if(wc) add({id:'wind:'+f.id+':'+act.id,owner:f.id,kind:'wind',name:act.name+' (wind-up)',clip:wc,what:'wind-up of act '+act.id+' of '+f.id});});
  });
}

// ---------- planned, not built yet (battleguide2) ----------
// data/guide-planned.json lists what the battle plan has and the game does not (written by tools/guide_planned.py from the plan documents). Each item carries a `when` rule that
// says "the game has it now"; PLAN is the items whose rule does not hold yet, so a third Vibe, a monster, a chapter or a feature drops out of the guide by itself when the game's own
// data files gain it. B3_SOON (moves the kits name that have no row yet) is read from the game and added the same way. Nothing planned has a Play or a fight button.
let PLAN=[];
const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,'');
function built(w){
  if(!w)return false;
  if(w.any)return w.any.some(built);
  if(w.all)return w.all.every(built);
  if(w.vibeName){const c=B3_CAST[w.vibeName[0]];return !!c&&c.vibes.some(v=>norm(B3_VIBES[v].name)===norm(w.vibeName[1]));}
  if(w.vibeCount){const c=B3_CAST[w.vibeCount[0]];return !!c&&c.vibes.length>=w.vibeCount[1];}
  if(w.allVibes)return Object.values(B3_CAST).every(c=>c.vibes.length>=w.allVibes);
  if(w.vibeMatch){const re=new RegExp(w.vibeMatch,'i');return Object.values(B3_VIBES).some(v=>re.test(v.name));}
  if(w.foe)return !!B3_FOES[w.foe];
  if(w.chapter!=null)return (B3_STORY.chapters||[]).includes(w.chapter);
  if(w.rules)return B3_RULES[w.rules]!=null&&B3_RULES[w.rules]!==false;
  if(w.global)return /^[A-Za-z_]\w*$/.test(w.global)&&new Function('return typeof '+w.global+'!=="undefined"')();
  if(w.noScript)return !INDEX_SRCS.some(x=>x.indexOf(w.noScript)===0);
  return false;
}
function soonItems(){   // a move a kit names that has no row in the game yet
  const out=[],S=(typeof B3_SOON!=='undefined'&&B3_SOON)||{};
  Object.values(B3_VIBES).forEach(v=>(v.skills||[]).forEach(sid=>{if(sid&&!B3_SKILLS[sid])out.push({id:'soon:'+sid,kind:'soon',owner:v.owner,vibe:v.name,name:S[sid]||words(sid)});}));
  return out;
}
function planBuild(){PLAN=((PLAN_DOC&&PLAN_DOC.items)||[]).filter(i=>!built(i.when)).concat(soonItems());}
const planOf=kind=>PLAN.filter(i=>i.kind===kind);
const pbadge='<span class="pbadge">PLANNED</span>';
const pbanner=(txt)=>'<div class="pbanner">'+pbadge+' <b>Not in the game yet.</b> '+txt+'</div>';
const stageWords=st=>!st?'':/^\d/.test(st)?'Comes in battle stage '+st+'.':st==='bonus'?'Comes with the bonus chapter.':'No battle stage owns it yet.';
const pf=f=>{const k=String(f).toLowerCase();return B3_FLAVORS[k]?flav(k):'<span class="chip">'+esc(f)+'</span>';};
function planCard(label,name,chips,desc){return '<div class="card plan"><div class="k">'+esc(label)+'</div><h4>'+esc(name)+'</h4>'+(chips&&chips.length?'<div class="chips">'+chips.join('')+'</div>':'')+(desc?'<p>'+esc(desc)+'</p>':'')+'</div>';}

  h+='<h3>Quirks</h3>'+P.quirks.map(q=>planCard('Quirk '+q.slot.toUpperCase()+' · unlocks at Rank '+q.rank,q.name,[],q.desc)).join('');

function plannedFoeHtml(P){

let RULES=[],tab='rules',sel='',vibeSel={},glossKind='',animFilter='all';
function build(){

function route(){
  const h=decodeURIComponent(location.hash.replace(/^#/,'')),i=h.indexOf('/');
  const t=i<0?h:h.slice(0,i);tab=TABS.some(x=>x[0]===t)?t:'rules';sel=i<0?'':h.slice(i+1);
  if(tab==='anims'&&ANIM_BY[sel]){const a=ANIM_BY[sel];sel=a.owner;setTimeout(()=>openPlayer(a.id),50);}   // a card can link straight to one animation: #anims/move:lounge_pass_flex
  if(tab!=='anims')benchRemove();   // movebench1: the preview frame lives only while the Animations tab does
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false'));
  renderList();
  if(!sel&&wide()) sel=firstOf(tab);
  renderDetail();
}
function firstOf(t){return t==='rules'?RULES[0].id:t==='family'?Object.keys(B3_CAST)[0]:t==='monsters'?Object.keys(B3_FOES)[0]:t==='anims'?Object.keys(B3_CAST)[0]:'';}

    h+=Object.keys(by).map(ch=>grp((isNaN(ch)?cap(ch)+' chapter':'Chapter '+ch)+' monsters',by[ch].map(f=>f.id))).join('');

// ---------- statuses and the list's progress (movebench6, claude/movebench-plan.md d.4 and d.5) ----------
// One status per animation. The files answer five of the eight (No video yet, To do, In progress, Finished, Changed since you finished it): the move-apply Action writes them to
// data/moves/index.json. This page adds the three that live in other data (Waiting on a video: his row in the queue; Waiting on a picture: a start picture being made; Waiting on
// Claude: an open c-anim card). The words are in data/movebench-words.json.
let MOVEIDX=null,MF='all';
const MS_GROUP={all:null,todo:['todo'],inprogress:['inprogress','changed'],waiting:['waitvideo','waitpicture','waitclaude'],finished:['finished'],novideo:['novideo']};
async function moveIdxLoad(){
  try{
    let j=null;const tok=lsGet(TOKEN);
    if(tok||Q.get('gh')){try{const g=await ghGetJson('data/moves/index.json','main',tok);j=g&&g.doc;}catch(e){}}
    if(!j){const r=await fetch('data/moves/index.json?t='+Date.now(),{cache:'no-store'});if(r.ok)j=await r.json();}
    if(j&&j.anims){MOVEIDX=j;moveRefresh();if(typeof WB!=='undefined'&&WB.a&&typeof wbPaint==='function')wbPaint();}
  }catch(e){}
}
function moveRefresh(){try{if(tab==='anims'&&!sel&&typeof ANIMS!=='undefined'&&ANIMS.length)renderList();}catch(e){}}
const movePicBusy=a=>typeof qItems==='function'&&qItems().some(i=>i.kind==='picture'&&i.who===a.owner&&!['done','failed','cancelled'].includes(i.state));
const moveCardOpen=a=>!!((BOARD_DOC||{}).cards||[]).find(c=>/^c-anim-/.test(c.id)&&c.anim===a.id&&c.col!=='done');
function moveStatus(a){
  if(typeof qBusy==='function'&&qBusy(a))return 'waitvideo';
  if(movePicBusy(a))return 'waitpicture';
  if(moveCardOpen(a))return 'waitclaude';
  const e=MOVEIDX&&MOVEIDX.anims&&MOVEIDX.anims[a.id];
  if(typeof WB!=='undefined'&&WB.a&&WB.id===a.id){
    if(wbChanges()>0)return 'inprogress';
    const d=WB.file;   // the file as just read answers before the index does (the index is rebuilt only when move-apply runs); the same rules as status_of in tools/movebench/apply.py
    if(d)return d.draft!=null?'inprogress':d.finished?(d.finished.rev===d.rev?'finished':'changed'):(a.video?'todo':'novideo');
  }
  return e?e.status:(a.video?'todo':'novideo');
}
const moveEntry=a=>MOVEIDX&&MOVEIDX.anims&&MOVEIDX.anims[a.id]||null;
function moveStatusText(a,s){
  if(s==='finished'){const e=moveEntry(a),f=(typeof WB!=='undefined'&&WB.a&&WB.id===a.id&&WB.file&&WB.file.finished)||(e&&e.finished);return W('status.finished',{date:f&&f.at?wbDate(f.at):''});}
  return W('status.'+(s==='changed'?'changed_since':s));
}
function moveCounts(){
  const c={n:0,fin:0,by:{},own:{}};
  ANIMS.forEach(a=>{const s=moveStatus(a),o=c.own[a.owner]=c.own[a.owner]||{n:0,fin:0,by:{}};c.n++;o.n++;c.by[s]=(c.by[s]||0)+1;o.by[s]=(o.by[s]||0)+1;if(s==='finished'){c.fin++;o.fin++;}});
  return c;
}
const moveMatch=a=>{const g=MS_GROUP[MF];return !g||g.includes(moveStatus(a));};
function moveSummaryHtml(c){

async function storeUpdate(fn,msg){
  const tok=lsGet(TOKEN);if(!tok&&!Q.get('gh'))throw new Error(W_X2);

    const g=(await ghGetJson(QF,QB,tok))||{sha:null,doc:{v:1,items:{}}},doc=g.doc;doc.items=doc.items||{};
    fn(doc);   // may throw QRefused; the file is then left as it is
    const body={message:(msg||'guide: queue')+' [skip ci]',content:b64t(JSON.stringify(doc,null,1)+'\n'),branch:QB};if(g.sha)body.sha=g.sha;
    const w=await fetch(GH()+'/repos/'+REPO+'/contents/'+QF,{method:'PUT',headers:{Authorization:'Bearer '+(tok||'test'),Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(w.ok){QS.doc=doc;QS.etag='';qPaint();return doc;}
    if(w.status===409||w.status===422)continue;   // somebody saved first: read again

// Nothing here draws a move: this page only holds the frame, the controls and what the frame reports. The frame is made on the first tap of the
// start button, reused from one animation to the next and removed when the Animations tab is left. Phase 2 adds the bar and the moments.
const BENCH={fr:null,ready:false,st:null,stAt:0,tl:null,id:'',want:'',speed:1,loop:true,mute:false,answer:false,raf:0,boot:null,clip:'',drag:false,dragT:0,seekWant:0,seekRaf:0};
function benchOk(a){
  if(!a)return false;if(a.kind==='move')return !!B3_SKILLS[a.id.slice(5)];
  const p=String(a.id).split(':');
  if(a.kind==='act'){const f=B3_FOES[p[1]],A=f&&f.acts.find(x=>x.id===p[2]);return !!A&&A.hits!=='attacker';}
  if(a.kind==='wind'){const f=B3_FOES[p[1]],A=f&&f.acts.find(x=>x.id===p[2]);return !!A&&A.hits!=='attacker'&&!!(msWindClip(p[1],A.id)||f.acts.some(x=>x.then===A.id));}
  if(a.kind==='state'){const o=p[1],st=p[2];if(B3_FOES[o])return ['idle','hit','die'].indexOf(st)>=0;
    return !!(B3_CAST[o]&&B3_CAST[o].vibes.length)&&['idle','guard','hit','dodge','ko','victory','run','cast','give'].indexOf(st)>=0;}
  return false;
}
function benchWord(a){return a.kind==='act'?'attack':a.kind==='wind'?'wind-up':a.kind==='state'?'body state':'move';}
function benchBox(a){
  if(!benchOk(a))return '';const w=benchWord(a);
  const tag=a.kind==='move'||a.kind==='act'?'THE WHOLE '+w.toUpperCase():a.kind==='wind'?'THE WIND-UP':'THIS BODY STATE';
  const go=a.kind==='move'||a.kind==='act'?'Preview the whole '+w:a.kind==='wind'?'Preview the wind-up':'Preview this body state';
  return '<div class="bench" id="bench"><div class="btag">PREVIEW: '+tag+', PLAYED BY THE GAME</div>'
   +'<div class="bslot" id="benchslot" data-anim="'+esc(a.id)+'" data-on="0"><button type="button" class="bgo" id="bnstart">'+go+'</button><div class="bmsg" id="bnmsg"></div></div>'
   +'<div class="ctl bctl" id="bnctl" hidden><button type="button" id="bnplay">Pause</button>'
   +'<button type="button" class="bsp" data-s="1" aria-pressed="true">1x</button><button type="button" class="bsp" data-s="0.5" aria-pressed="false">&frac12;</button><button type="button" class="bsp" data-s="0.25" aria-pressed="false">&frac14;</button>'
   +'<button type="button" class="bst" id="bnstepb" title="Back one picture" aria-label="Back one picture">&lsaquo; 1</button><button type="button" class="bst" id="bnstepf" title="Forward one picture" aria-label="Forward one picture">1 &rsaquo;</button>'
   +'<button type="button" id="bnloop" aria-pressed="true">Loop</button><button type="button" id="bnmute" aria-pressed="false">Mute</button>'
   +(a.kind==='move'?'<button type="button" id="bnans" aria-pressed="false" title="After the move, one monster attacks, as the Move Lab\'s MONSTER ACTS does">Then a monster answers</button>':'')
   +'<span id="bnclock"></span></div>'
   +'<div class="tl bbar" id="bnbar" hidden aria-label="The move on one clock: drag to any moment"><div id="bnlanes"></div><div class="hw" id="bnhw"><b id="bnhit" hidden></b><u id="bnhead" style="left:0"></u></div><div class="sc" id="bnsc"></div></div></div>';
}
// After the sheet is built: show this animation's state (a frame that is still on another animation is paused and hidden).
function benchAttach(a){
  const sl=document.getElementById('benchslot');if(!sl)return;
  const on=BENCH.fr&&BENCH.id===a.id;sl.dataset.on=on?'1':'0';
  if(BENCH.fr&&!on)benchSend({bench:'pause'});
  benchUi();
}
function benchSend(m){try{if(BENCH.fr&&BENCH.fr.contentWindow)BENCH.fr.contentWindow.postMessage(m,location.origin);}catch(e){}}
function benchFrame(){
  if(BENCH.fr)return BENCH.fr;
  const f=document.createElement('iframe');f.id='benchframe';f.title='Move preview';f.src='bench.html';f.setAttribute('allow','autoplay');document.body.appendChild(f);
  BENCH.fr=f;BENCH.ready=false;BENCH.st=null;cancelAnimationFrame(BENCH.raf);BENCH.raf=requestAnimationFrame(benchPlace);return f;
}
function benchStart(){
  const sl=document.getElementById('benchslot');if(!sl)return;const id=sl.dataset.anim;
  BENCH.want=id;BENCH.id=id;BENCH.st=null;BENCH.tl=null;benchBarRender();sl.dataset.on='1';benchFrame();benchPlay();benchUi();
}
function benchPlay(){if(BENCH.ready&&BENCH.want){if(typeof WB!=='undefined'&&WB.a&&WB.id===BENCH.want)benchSend({bench:'spec',id:WB.id,live:wbChanges()?WB.draft:null});benchSend({bench:'play',id:BENCH.want,speed:BENCH.speed,loop:BENCH.loop,mute:BENCH.mute,answer:BENCH.answer});BENCH.want='';}}
function benchToggle(){const s=BENCH.st&&BENCH.st.state;if(s==='playing')benchSend({bench:'pause'});else if(s==='paused'||s==='ended')benchSend({bench:'resume'});}
function benchPause(){if(BENCH.fr&&BENCH.st&&BENCH.st.state==='playing')benchSend({bench:'pause'});}
function benchSpeed(v){BENCH.speed=v;benchSend({bench:'speed',v});benchUi();}
function benchLoop(on){BENCH.loop=on;benchSend({bench:'loop',on});benchUi();}
function benchMute(on){BENCH.mute=on;benchSend({bench:'mute',on});benchUi();}
function benchAnswer(on){BENCH.answer=on;BENCH.tl=null;benchBarRender();benchSend({bench:'answer',on});benchUi();}
function benchStep(d){benchSend({bench:'step',d});}
// The bar: lanes read from the run by the frame (bench:'timeline'), the HIT line, and the playhead. Dragging sends the moment; the frame draws that moment and holds there.
function benchBarRender(){
  const tl=BENCH.tl,el=document.getElementById('bnlanes'),bar=document.getElementById('bnbar');if(!bar)return;
  if(!tl){bar.hidden=true;if(el)el.innerHTML='';return;}
  const len=tl.len||1,cls={video:'body',wind:'body',stage:'stage',fx:'fx',snd:'snd'};
  el.innerHTML=tl.lanes.map(L=>'<div class="ln '+(cls[L.id]||'body')+'" data-lane="'+esc(L.id)+'"><span class="lb">'+esc(L.name)+'</span><span class="tr">'
    +L.segs.map(g=>'<span class="it'+(g.k==='need'||g.pink?' need':g.k==='hold'?' hold':'')+'" data-k="'+esc(g.k||'')+'" data-a="'+g.a.toFixed(3)+'" data-b="'+g.b.toFixed(3)+'" style="left:'+(g.a/len*100).toFixed(2)+'%;width:'+Math.max(1.6,(g.b-g.a)/len*100).toFixed(2)+'%">'+esc(g.label)+'</span>').join('')+'</span></div>').join('');
  const hw=document.getElementById('bnhw'),ht=document.getElementById('bnhit');
  if(ht){ht.hidden=tl.hit==null;if(tl.hit!=null)ht.style.left=(tl.hit/len*100)+'%';}
  benchTrimHandles();
  hw.querySelectorAll('i').forEach(n=>n.remove());
  (tl.ticks||[]).forEach(k=>{const i=document.createElement('i');i.style.left=(k.t/len*100)+'%';i.title=k.name;hw.appendChild(i);});
  const sc=document.getElementById('bnsc');if(sc)sc.innerHTML=[0,.25,.5,.75,1].map(f=>'<span>'+(len*f).toFixed(1)+' s</span>').join('');
  bar.hidden=document.getElementById('benchslot').dataset.on!=='1';
}
// The playhead follows the clock between the frame's reports; while a finger is on the bar it follows the finger.
function benchHead(){
  const hd=document.getElementById('bnhead'),tl=BENCH.tl;if(!hd||!tl)return;
  const st=BENCH.st;let t;
  if(BENCH.drag)t=BENCH.dragT;else{if(!st)return;t=st.t||0;if(st.state==='playing')t+=Math.min(.2,(performance.now()-BENCH.stAt)/1000*(st.speed||1));}
  const len=tl.len||1;t=Math.max(0,Math.min(len,t));hd.style.left=(t/len*100)+'%';
  const ck=document.getElementById('bnclock');if(ck&&st&&st.state!=='loading')ck.textContent=t.toFixed(1)+' of '+len.toFixed(1)+' s';
}
function benchDrag(e){
  const hw=document.getElementById('bnhw'),tl=BENCH.tl;if(!hw||!tl)return;
  const r=hw.getBoundingClientRect(),f=Math.max(0,Math.min(1,(e.clientX-r.left)/Math.max(1,r.width)));
  BENCH.dragT=f*(tl.len||1);BENCH.seekWant=BENCH.dragT;benchHead();
  if(!BENCH.seekRaf)BENCH.seekRaf=requestAnimationFrame(()=>{BENCH.seekRaf=0;benchSend({bench:'seek',t:BENCH.seekWant});});
}
function benchRemove(){
  if(!BENCH.fr)return;cancelAnimationFrame(BENCH.raf);BENCH.raf=0;BENCH.fr.remove();BENCH.fr=null;BENCH.ready=false;BENCH.st=null;BENCH.tl=null;BENCH.drag=false;BENCH.id='';BENCH.want='';
}
function benchUi(){
  const sl=document.getElementById('benchslot');if(!sl)return;
  const on=sl.dataset.on==='1',ctl=document.getElementById('bnctl'),st=BENCH.st,go=document.getElementById('bnstart'),msg=document.getElementById('bnmsg');
  if(go)go.hidden=on;if(ctl)ctl.hidden=!on;
  document.querySelectorAll('.bsp').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.s===BENCH.speed?'true':'false'));
  const lp=document.getElementById('bnloop'),mu=document.getElementById('bnmute');if(lp)lp.setAttribute('aria-pressed',BENCH.loop?'true':'false');if(mu)mu.setAttribute('aria-pressed',BENCH.mute?'true':'false');
  const pl=document.getElementById('bnplay'),ck=document.getElementById('bnclock');
  if(pl)pl.textContent=!st?'Loading':st.state==='playing'?'Pause':st.state==='ended'?'Play again':st.state==='loading'?'Loading':'Play';
  if(ck)ck.textContent=st&&st.state!=='loading'?(st.len!=null?Math.min(st.t,st.len):st.t).toFixed(1)+(st.len!=null?' of '+st.len.toFixed(1):'')+' s':'';
  const an=document.getElementById('bnans');if(an)an.setAttribute('aria-pressed',BENCH.answer?'true':'false');
  const bar=document.getElementById('bnbar');if(bar)bar.hidden=!(on&&BENCH.tl);
  if(msg)msg.textContent=on&&st&&st.msg?st.msg:'';
}
// The frame floats over the box: fixed to the box's place, cut off at the sheet's edges.
function benchPlace(){
  const f=BENCH.fr;if(!f)return;BENCH.raf=requestAnimationFrame(benchPlace);benchHead();
  const sl=document.getElementById('benchslot'),S=document.getElementById('sheet');
  if(!sl||!S.classList.contains('open')||sl.dataset.on!=='1'){if(f.style.display!=='none')f.style.display='none';return;}
  const r=sl.getBoundingClientRect();let q=S.getBoundingClientRect();
  for(let n=sl.parentElement;n&&n!==S;n=n.parentElement){const o=getComputedStyle(n).overflowY;if(o==='auto'||o==='scroll'||o==='hidden'){const c=n.getBoundingClientRect();q={left:Math.max(q.left,c.left),right:Math.min(q.right,c.right),top:Math.max(q.top,c.top),bottom:Math.min(q.bottom,c.bottom)};}}   // movebench5: a column that scrolls inside the sheet cuts the frame too
  const key=[r.left,r.top,r.width,r.height,q.top,q.bottom,q.left,q.right].map(Math.round).join(',');
  if(f.dataset.k!==key){f.dataset.k=key;f.style.left=r.left+'px';f.style.top=r.top+'px';f.style.width=r.width+'px';f.style.height=r.height+'px';
    f.style.clipPath='inset('+Math.max(0,q.top-r.top)+'px '+Math.max(0,r.right-q.right)+'px '+Math.max(0,r.bottom-q.bottom)+'px '+Math.max(0,q.left-r.left)+'px round 12px)';}
  if(f.style.display!=='block')f.style.display='block';
}
addEventListener('message',e=>{
  if(e.origin!==location.origin||!BENCH.fr||e.source!==BENCH.fr.contentWindow)return;
  const m=e.data;if(!m||typeof m.bench!=='string')return;
  if(m.bench==='ready'){BENCH.ready=true;BENCH.boot=m;benchPlay();}
  else if(m.bench==='status'){BENCH.st=m;BENCH.stAt=performance.now();benchUi();}
  else if(m.bench==='timeline'&&m.id===BENCH.id){BENCH.tl=m;benchBarRender();benchUi();if(typeof wbPaint==='function')wbPaint();}
});
document.addEventListener('pointerdown',e=>{const bar=e.target.closest&&e.target.closest('#bnbar');if(!bar||!BENCH.tl)return;BENCH.drag=true;benchDrag(e);try{bar.setPointerCapture(e.pointerId);}catch(_){}});
document.addEventListener('pointermove',e=>{if(BENCH.drag)benchDrag(e);});
function benchDragEnd(){if(!BENCH.drag)return;BENCH.drag=false;if(BENCH.seekRaf){cancelAnimationFrame(BENCH.seekRaf);BENCH.seekRaf=0;}benchSend({bench:'seek',t:BENCH.seekWant});}
document.addEventListener('pointerup',benchDragEnd);document.addEventListener('pointercancel',benchDragEnd);


// ---------- the workbench (movebench5, claude/movebench-plan.md sections d.1, d.2 and d.6) ----------
// Opening an animation shows the workbench in place of the old sheet: top bar, the preview (the frame above), Body video (today's start picture, prompt, Make this video, takes, Use this one and
// Keep the old one, unchanged), Timing (the first section Tom can change) and, read-only, what the spec holds for the stage, the effects and the sounds. Every label comes from
// data/movebench-words.json. A change goes into the draft, which is kept in this browser (aot-movebench) and sent to the frame (postMessage {bench:'spec'}): the frame puts it in the table the game's
// move-specs fill (msSet) and plays the move again. Nothing is saved to the repo yet and the game does not see the draft.
const WB={id:'',a:null,base:null,draft:null,undo:[],small:false,file:null,fsha:null,src:'',busy:false,msg:null,confirm:false,poll:0};   // base: the saved version (the file's draft, else its live part); draft: the working copy; file: the file as read from GitHub
const WB_KEY='aot-movebench',WB_FIELDS=['contact','hitStop','shake','approach','approachSec','returnSec','gap'];
function W(path,vars){let v=WORDS;for(const k of path.split('.'))v=v&&v[k];
  if(typeof v!=='string')return path.split('.').pop().replace(/_/g,' ');
  return vars?v.replace(/\{(\w+)\}/g,(m,k)=>vars[k]!=null?vars[k]:''):v;}
function WA(path){let v=WORDS;for(const k of path.split('.'))v=v&&v[k];return Array.isArray(v)?v:[];}
// movebench14: a monster attack has Timing (hit, freeze, shake), Stage, Effects and Sound like a move; "the monster" and "him" are said from the monster's side (words.act_side)
const wbHas=a=>!!a&&(a.kind==='move'||a.kind==='act'),wbIsAct=()=>!!(WB.a&&WB.a.kind==='act');
const WAS=path=>{const L=WA(path),m=wbIsAct()&&WORDS.act_side;return m?L.map(o=>o&&typeof o==='object'&&m[o.k]?Object.assign({},o,{label:m[o.k]}):o):L;};
const WOn=k=>wbIsAct()&&WORDS.act_side&&WORDS.act_side['on.'+k]||W('on.'+k);
const wbClone=o=>JSON.parse(JSON.stringify(o==null?{}:o));
function wbStoreRead(){try{const j=JSON.parse(localStorage.getItem(WB_KEY)||'null');return j&&j.drafts?j:{v:1,drafts:{}};}catch(e){return {v:1,drafts:{}};}}
function wbStoreWrite(id,live,base){const st=wbStoreRead();if(live==null)delete st.drafts[id];else st.drafts[id]={live,base:base||null,at:Date.now()};try{localStorage.setItem(WB_KEY,JSON.stringify(st));}catch(e){}}
const wbSpecOf=id=>{try{return typeof msLive==='function'?msLive(id):null;}catch(e){return null;}};
// movebench8: a move with a stage section in its spec: its tier (the kit row's slot) and its budget in seconds (timing.budget)
const wbStage=a=>{try{if(!a||a.kind!=='move')return null;const sp=wbSpecOf(a.id);if(!sp||!sp.stage)return null;const S=B3_SKILLS[a.id.replace(/^move:/,'')];return {tier:S&&S.slot,budget:sp.timing&&sp.timing.budget};}catch(e){return null;}};
// The Timing fields Tom changed since the saved version: {field: value, or null when it went back to automatic}. His changes are kept as this list, so a save that meets a newer file
// (a second device, a session) puts them on top of it instead of overwriting it (plan f.3).
function wbDiff(){
  const a=(WB.draft&&WB.draft.timing)||{},b=(WB.base&&WB.base.timing)||{},o={};
  WB_FIELDS.forEach(f=>{if(JSON.stringify(a[f])!==JSON.stringify(b[f]))o[f]=a[f]===undefined?null:a[f];});
  if(JSON.stringify((WB.draft&&WB.draft.effects)||[])!==JSON.stringify((WB.base&&WB.base.effects)||[]))o.effects=wbClone((WB.draft&&WB.draft.effects)||[]);   // movebench7: the effects list is one field, the whole list
  const bs=(WB.base&&WB.base.stage&&WB.base.stage.steps)||[],bm=(WB.base&&WB.base.body&&WB.base.body.marks)||{};   // movebench9: the stage steps are one field, and so are the named moments
  if(JSON.stringify(stgStage())!==JSON.stringify(bs))o.steps=wbClone(stgStage());
  if(JSON.stringify(stgMarks())!==JSON.stringify(bm))o.marks=wbClone(stgMarks());
  {const bt=(WB.base&&WB.base.body&&WB.base.body.trim)||null,dt=(WB.draft&&WB.draft.body&&WB.draft.body.trim)||null;if(JSON.stringify(dt)!==JSON.stringify(bt))o.trim=dt?wbClone(dt):null;}   // movebench12: the first and last picture of the video are one field
  if(JSON.stringify(stGet())!==JSON.stringify((WB.base&&WB.base.start)||null))o.start=stGet()?wbClone(stGet()):null;   // movebench13: the start picture's settings are one field
  if(JSON.stringify(stgObjs())!==JSON.stringify((WB.base&&WB.base.stage&&WB.base.stage.objects)||{}))o.objects=wbClone(stgObjs());   // movebench10: the objects of the move are one field too
  {const bl=(WB.base&&WB.base.stage&&WB.base.stage.lasting)||[];if(JSON.stringify(lsList())!==JSON.stringify(bl))o.lasting=wbClone(lsList());   // movebench11: lasting things, the set piece and the answer are one field each
    const bp=(WB.base&&WB.base.stage&&WB.base.stage.setpiece)||null;if(JSON.stringify(spGet())!==JSON.stringify(bp))o.setpiece=spGet()?wbClone(spGet()):null;
    const ba=(WB.base&&WB.base.answer)||null;if(JSON.stringify(anGet())!==JSON.stringify(ba))o.answer=anGet()?wbClone(anGet()):null;}
  return o;
}
const wbChanges=()=>(WB.draft&&WB.base)?Object.keys(wbDiff()).length:0;
const wbPath=a=>'data/moves/'+slugOf(a.id)+'.json';
const wbBlank=a=>({v:1,id:a.id,rev:0,live:null,draft:null,finished:null,log:[]});
function wbNow(){const d=new Date(),p=n=>String(n).padStart(2,'0'),o=-d.getTimezoneOffset(),s=o>=0?'+':'-';
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+s+p(Math.floor(Math.abs(o)/60))+':'+p(Math.abs(o)%60);}
function wbDate(at){try{return new Date(at).toLocaleDateString(undefined,{month:'short',day:'numeric'});}catch(e){return '';}}
function wbOpen(a){
  clearTimeout(WB.poll);
  WB.fxOpen=-1;WB.fxPick=false;WB.stgOpen=-1;WB.stgPick=false;WB.fxk=null;WB.fxScope='move';WB.stgScope='stage';WB.id=a.id;WB.a=a;WB.undo=[];WB.file=null;WB.fsha=null;WB.src='';WB.busy=false;WB.msg=null;WB.confirm=false;
  const kept=wbStoreRead().drafts[a.id],live=wbClone(wbSpecOf(a.id));
  WB.base=kept&&kept.base?wbClone(kept.base):wbClone(live);if(!WB.base.timing)WB.base.timing={};
  WB.draft=kept&&kept.live?wbClone(kept.live):wbClone(WB.base);
  if(!WB.draft.timing)WB.draft.timing={};
  if(wbChanges()===0)WB.draft=wbClone(WB.base);
}
// Read the file of this animation (the contents API with a token, else the copy the site serves) and put what Tom changed on top of it.
async function wbLoadFile(a){
  const id=a.id,path=wbPath(a),tok=lsGet(TOKEN);let doc=null,sha=null,src='';
  try{if(tok||Q.get('gh')){const g=await ghGetJson(path,'main',tok);doc=g?g.doc:null;sha=g?g.sha:null;src='api';}}catch(e){src='';}
  if(!src){try{const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(r.ok){doc=await r.json();src='site';}else if(r.status===404)src='site';}catch(e){}}
  if(WB.id!==id||!src)return;
  WB.src=src;WB.file=doc||wbBlank(a);WB.fsha=sha;
  const fresh=wbClone((doc&&(doc.draft!=null?doc.draft:doc.live))||wbSpecOf(id));if(!fresh.timing)fresh.timing={};
  wbRebase(fresh);wbSend();wbPaint();wbAllPaint();
}
// Fields Tom did not touch take the file's value; fields he changed stay his.
function wbRebase(fresh){
  const mine=wbDiff();WB_FIELDS.forEach(f=>{if(!(f in mine)){if(fresh.timing[f]===undefined)delete WB.draft.timing[f];else WB.draft.timing[f]=wbClone(fresh.timing[f]);}});
  if(!('effects' in mine)){if(fresh.effects===undefined)delete WB.draft.effects;else WB.draft.effects=wbClone(fresh.effects);}
  {const mySteps=wbClone(stgStage()),myLs=wbClone(lsList()),mySp=spGet()?wbClone(spGet()):null,myAn=anGet()?wbClone(anGet()):null,myMarks=wbClone(stgMarks()),myObjs=wbClone(stgObjs());   // movebench9: the rest of the stage and of the body is the file's; his steps and moments stay his (movebench10: and his objects)
    if(fresh.stage||'steps' in mine||'objects' in mine||'lasting' in mine||'setpiece' in mine){const st=fresh.stage?wbClone(fresh.stage):{};if('steps' in mine)st.steps=mySteps;if('lasting' in mine){if(myLs.length)st.lasting=myLs;else delete st.lasting;}if('setpiece' in mine){if(mySp)st.setpiece=mySp;else delete st.setpiece;}if('objects' in mine){if(Object.keys(myObjs).length)st.objects=myObjs;else delete st.objects;}WB.draft.stage=st;}else delete WB.draft.stage;
    {const mySt=stGet()?wbClone(stGet()):null;if('start' in mine){if(mySt)WB.draft.start=mySt;else delete WB.draft.start;}else{if(fresh.start)WB.draft.start=wbClone(fresh.start);else delete WB.draft.start;}}
    if('answer' in mine){if(myAn)WB.draft.answer=myAn;else delete WB.draft.answer;}else{if(fresh.answer)WB.draft.answer=wbClone(fresh.answer);else delete WB.draft.answer;}
    const myTrim=(WB.draft.body&&WB.draft.body.trim)||null,bd=fresh.body?wbClone(fresh.body):{};if('marks' in mine){if(Object.keys(myMarks).length)bd.marks=myMarks;else delete bd.marks;}if('trim' in mine){if(myTrim)bd.trim=wbClone(myTrim);else delete bd.trim;}WB.draft.body=bd;}
  WB.base=wbClone(fresh);
}
// Send the draft to the frame (null when it is what the game plays: the frame puts its own table's back).

// again and puts Tom's field changes on top of the newer file. Save draft writes `draft`; Finished makes the draft `live`, clears `draft` and sets `finished` to him and now. The

function wbWhat(ch){
  const lab={hitStop:'timing.freeze.label',shake:'timing.shake.label',approach:'timing.approach.label',approachSec:'timing.pace.label',returnSec:'timing.pace.label',gap:'timing.gap.label',contact:'timing.hit.label'},p=[];
  for(const f in ch){const x=ch[f];let v;
    if(f==='effects'){p.push(W('fx.p.title')+': '+(x&&x.length?x.map(e=>fxName(e.fx)+(e.off?' ('+W('fx.p.off')+')':'')).join(', '):W('fx.p.empty')));continue;}
    if(f==='steps'){p.push(W('sections.stage')+': '+(x&&x.length?x.map(s=>stgSentence(s)).join('; '):W('stage.empty')));continue;}
    if(f==='objects'){p.push(W('stage.o.title')+': '+(x&&Object.keys(x).length?Object.values(x).map(o=>o.name).join(', '):'-'));continue;}
    if(f==='lasting'){p.push(W('sections.lasting')+': '+(x&&x.length?x.map(r=>lsSentence(r)).join('; '):'-'));continue;}
    if(f==='setpiece'){p.push(W('sections.setpiece')+': '+(x?W('sp.what',{dur:x.dur,dim:Math.round((x.dim||0)*100)}):'-'));continue;}
    if(f==='answer'){p.push(W('sections.answer')+': '+(x?(x.clip?W('an.what_clip')+(x.effects&&x.effects.length?', ':''):'')+(x.effects&&x.effects.length?x.effects.map(e=>fxName(e.fx)).join(', '):''):'-'));continue;}
    if(f==='start'){p.push(W('start.label')+': '+stSentence(x));continue;}
    if(f==='trim'){p.push(W('timing.trim.label')+': '+(x?W('timing.trim.what',{from:x.from+1,to:x.to+1}):W('timing.trim.whole')));continue;}
    if(f==='marks'){p.push(W('stage.name_label')+': '+(x&&Object.keys(x).length?Object.keys(x).join(', '):'-'));continue;}
    if(x==null)v=W('save.automatic');
    else if(f==='hitStop')v=W('timing.freeze.frames',{n:x});else if(f==='shake')v=W('timing.shake.px',{n:x});
    else if(f==='approach')v=(WA('timing.approach.options').find(o=>o.k===x)||{label:x}).label;
    else if(f==='contact')v=(x&&x.sec!=null?wbFmt(x.sec)+' s':W('timing.hit.auto'));else v=wbFmt(x)+' s';
    const l=W(lab[f]);if(!p.some(q=>q.startsWith(l+':')))p.push(l+': '+v);}
  return p.join('; ');
}
function wbMerge(cur,ch,kind,now,replayed){
  const d=wbClone(cur);d.v=1;d.id=d.id||WB.id;
  const sec=wbClone((d.draft!=null?d.draft:d.live)||{});const t=Object.assign({},sec.timing||{});
  for(const f in ch){if(f==='effects'||f==='steps'||f==='marks'||f==='objects'||f==='lasting'||f==='setpiece'||f==='answer'||f==='trim'||f==='start')continue;if(ch[f]==null)delete t[f];else t[f]=wbClone(ch[f]);}
  if(Object.keys(t).length)sec.timing=t;else delete sec.timing;
  if('effects' in ch)sec.effects=wbClone(ch.effects||[]);
  if('steps' in ch){const had=!!sec.stage,st=Object.assign({},sec.stage||{});st.steps=wbClone(ch.steps||[]);if(!st.steps.length&&!had)delete sec.stage;else sec.stage=st;}
  if('objects' in ch){const st=Object.assign({},sec.stage||{});if(Object.keys(ch.objects||{}).length)st.objects=wbClone(ch.objects);else delete st.objects;if(Object.keys(st).length||sec.stage)sec.stage=st;}
  if('lasting' in ch){const st=Object.assign({},sec.stage||{});if((ch.lasting||[]).length)st.lasting=wbClone(ch.lasting);else delete st.lasting;if(Object.keys(st).length||sec.stage)sec.stage=st;}   // movebench11
  if('setpiece' in ch){const st=Object.assign({},sec.stage||{});if(ch.setpiece)st.setpiece=wbClone(ch.setpiece);else delete st.setpiece;if(Object.keys(st).length||sec.stage)sec.stage=st;}
  if('answer' in ch){if(ch.answer)sec.answer=wbClone(ch.answer);else delete sec.answer;}
  if('start' in ch){if(ch.start)sec.start=wbClone(ch.start);else delete sec.start;}   // movebench13
  if('trim' in ch){sec.body=Object.assign({},sec.body||{});if(ch.trim)sec.body.trim=wbClone(ch.trim);else delete sec.body.trim;}
  if('marks' in ch){sec.body=Object.assign({},sec.body||{});if(Object.keys(ch.marks||{}).length)sec.body.marks=wbClone(ch.marks);else delete sec.body.marks;}
  d.rev=(d.rev||0)+1;
  const what=(wbWhat(ch)||W(kind==='finished'?'save.what_finished':'save.what_draft'))+(replayed?' ('+W('save.merged')+')':'');
  if(kind==='draft'){d.draft=sec;}else{d.live=sec;d.draft=null;d.finished={rev:d.rev,at:now,by:'tom',build:null};}
  if(!('live' in d))d.live=null;if(!('draft' in d))d.draft=null;if(!('finished' in d))d.finished=null;
  d.log=(d.log||[]).concat([{rev:d.rev,at:now,by:'tom',what}]).slice(-20);
  return d;
}

async function wbSave(kind){

  WB.busy=true;WB.confirm=false;wbMsg(W('save.saving'));

  try{
    for(let tries=0;tries<5&&!res;tries++){
      const g=await ghGetJson(path,'main',tok),cur=g?g.doc:wbBlank(a),doc=wbMerge(cur,ch,kind,wbNow(),replayed);
      const body={message:'move: '+kind+' '+a.id+' rev '+doc.rev+' [skip ci]',content:b64t(JSON.stringify(doc,null,1)+'\n'),branch:'main'};if(g)body.sha=g.sha;

      if(w.status===409||(w.status===422&&!g)){replayed=true;continue;}

// Same save as board.html: read data/board.json from GitHub (through the blob when it is over 1 MB), change it, write it back, try again on a clash.
async function ghBoard(tok){
  const H={Authorization:'Bearer '+(tok||'test'),Accept:'application/vnd.github+json'};
  const r=await fetch(GH()+'/repos/'+REPO+'/contents/'+BOARD+'?ref=main&t='+Date.now(),{cache:'no-store',headers:H});
  if(!r.ok)throw new Error('GitHub '+r.status);
  const j=await r.json();let c=j.content||'';
  if(!c.replace(/\s/g,'')){const b=await fetch(GH()+'/repos/'+REPO+'/git/blobs/'+j.sha+'?t='+Date.now(),{cache:'no-store',headers:H});if(!b.ok)throw new Error('GitHub '+b.status);c=(await b.json()).content||'';}
  return {sha:j.sha,doc:JSON.parse(t64(c))};
}
async function saveBoard(msg,fn){
  const tok=lsGet(TOKEN);if(!tok&&!Q.get('gh'))throw new Error('This browser has no GitHub token. Open the Board, tap the three dots and paste it there.');
  for(let tries=0;;tries++){
    const g=await ghBoard(tok),next=fn(g.doc);
    const w=await fetch(GH()+'/repos/'+REPO+'/contents/'+BOARD,{method:'PUT',headers:{Authorization:'Bearer '+(tok||'test'),Accept:'application/vnd.github+json','Content-Type':'application/json'},
      body:JSON.stringify({message:msg,content:b64t(JSON.stringify(next,null,1)+'\n'),branch:'main',sha:g.sha})});
    if(w.status===409&&tries<3)continue;
    if(!w.ok)throw new Error('GitHub '+w.status);
    BOARD_DOC=next;return;
  }
}

let sFilter='all';
function planHits(q){
  const s=q.toLowerCase(),out=[],hit=(...a)=>!s||a.some(x=>String(x||'').toLowerCase().includes(s));
  PLAN.forEach(i=>{
    if(i.kind==='vibe'){if(hit(i.name,...(i.subtitles||[]),i.trait&&i.trait.name,i.basic&&i.basic.name,...i.skills.map(k=>k.name),...i.quirks.map(k=>k.name)))out.push(['family',i.owner,i.name,'Third Vibe of '+ownerName(i.owner),i.id,1]);}
    else if(i.kind==='foe'){if(hit(i.name,...(i.acts||[]).map(a=>a.name)))out.push(['monsters',i.id,i.name,'Monster, '+(i.ch===21?'bonus chapter':'chapter '+i.ch),'',1]);}
    else if(i.kind==='soon'){if(hit(i.name,i.vibe))out.push(['family',i.owner,i.name,'Move of '+ownerName(i.owner)+' · '+i.vibe,'',1]);}
    else if(hit(i.name,i.plain))out.push(['rules','coming',i.name,i.kind==='stage'?'Battle stage '+i.n:cap(i.kind),'',1]);
  });
  return out;
}
function searchList(q){
  if(sFilter==='plan')return planHits(q);
  const s=q.toLowerCase(),out=[],hit=(...a)=>a.some(x=>String(x||'').toLowerCase().includes(s));
  RULES.forEach(r=>{if(hit(r.title,r.sub))out.push(['rules',r.id,r.title,'Rules']);});
  Object.values(B3_CAST).forEach(c=>{if(hit(c.name))out.push(['family',c.id,c.name,'Family']);});
  Object.values(B3_VIBES).forEach(v=>{if(hit(v.name,...v.subtitles))out.push(['family',v.owner,v.name,'Vibe of '+ownerName(v.owner),v.id]);});
  Object.values(B3_SKILLS).forEach(k=>{const v=B3_VIBES[k.vibe];if(v&&hit(k.name,k.desc))out.push(['family',v.owner,k.name,ownerName(v.owner)+' · '+v.name+' · '+k.desc,v.id]);});
  [B3_TRAITS,B3_QUIRKS].forEach((T,i)=>Object.values(T).forEach(k=>{const v=B3_VIBES[k.vibe];if(v&&hit(k.name,k.desc))out.push(['family',v.owner,k.name,(i?'Quirk':'Trait')+' of '+ownerName(v.owner)+' · '+k.desc,v.id]);}));
  Object.values(B3_FOES).forEach(f=>{if(hit(f.name)||f.acts.some(a=>hit(a.name)))out.push(['monsters',f.id,f.name,'Monster, chapter '+f.ch]);});
  glossRows().forEach(x=>{if(hit(x.name,x.desc))out.push(['glossary',x.id,x.name,cap(x.kind)+' · '+(x.desc||'')]);});
  return out.slice(0,60).concat(planHits(q));
}
function renderSearch(q){
  const r=searchList(q),n=r.filter(x=>!x[5]).length;
  $('list').innerHTML='<div class="grp">'+(sFilter==='plan'?r.length+' planned, not in the game yet'+(q?' for "'+esc(q)+'"':''):n+(n>=60?'+':'')+' results for "'+esc(q)+'"'+(r.length>n?' and '+(r.length-n)+' planned':''))+'</div>'+r.map(x=>'<button type="button" class="row'+(x[5]?' plan':'')+'" data-go="'+x[0]+'" data-id="'+esc(x[1])+'"'+(x[4]?' data-vibe-pick="'+esc(x[4])+'"':'')+'><span class="t"><b>'+esc(x[2])+'</b><span>'+esc(x[3])+'</span></span>'+(x[5]?'<span class="n">'+pbadge+'</span>':'')+'</button>').join('');
}
function doSearch(){const q=$('q').value.trim();if(q.length>1||sFilter==='plan')renderSearch(q);else renderList();}

// ---------- taps ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('button,a');if(!t)return;
  if(t.id==='gnotest'){sendNotifyTest();return;}
  if(t.dataset.qa){e.preventDefault();qAct(t);return;}
  if(t.id==='actbar'){openActivity();return;}
  if(t.dataset.go&&$('sheet').dataset.mode==='act')closeSheet();
  if(t.dataset.tab){$('q').value='';$('searchbar').hidden=true;go(t.dataset.tab,'');return;}
  if(t.dataset.anim){e.preventDefault();openPlayer(t.dataset.anim);return;}
  if(t.dataset.go){if(t.dataset.vibePick)vibeSel[t.dataset.id]=t.dataset.vibePick;if($('q').value){$('q').value='';$('searchbar').hidden=true;}go(t.dataset.go,t.dataset.id);return;}
  if(t.dataset.back){go(tab,'');return;}
  if(t.dataset.vibe){vibeSel[sel]=t.dataset.vibe;renderDetailKeep();return;}
  if(t.dataset.pv){e.preventDefault();const o=t.dataset.pv.split(':')[1];vibeSel[o]=t.dataset.pv;go('family',o);return;}
  if(t.dataset.sf){sFilter=t.dataset.sf;document.querySelectorAll('#sflt .chip').forEach(b=>b.setAttribute('aria-pressed',b===t?'true':'false'));doSearch();return;}
  if(t.dataset.kind!=null&&t.classList.contains('chip')){glossKind=t.dataset.kind;renderList();return;}
  if(t.dataset.af){animFilter=t.dataset.af;renderDetailKeep();return;}
  if(t.dataset.mf){MF=t.dataset.mf;renderList();if(sel&&tab==='anims')renderDetailKeep();return;}
  if(t.id==='bsearch'){const b=$('searchbar');b.hidden=!b.hidden;if(!b.hidden)$('q').focus();else{$('q').value='';sFilter='all';document.querySelectorAll('#sflt .chip').forEach(x=>x.setAttribute('aria-pressed',x.dataset.sf==='all'?'true':'false'));renderList();}return;}
  if(t.id==='bclose'){closeSheet();return;}
  if(t.id==='bnstart'){benchStart();return;}if(t.id==='bnplay'){benchToggle();return;}if(t.classList&&t.classList.contains('bsp')){benchSpeed(+t.dataset.s);return;}if(t.id==='bnloop'){benchLoop(!BENCH.loop);return;}if(t.id==='bnmute'){benchMute(!BENCH.mute);return;}if(t.id==='bnstepb'){benchStep(-1);return;}if(t.id==='bnstepf'){benchStep(1);return;}if(t.id==='bnans'){benchAnswer(!BENCH.answer);return;}
  if(t.id==='bplay'){setPlaying(!PL.on);return;}
  if(t.classList.contains('spd')){PL.speed=+t.dataset.s;document.querySelectorAll('.spd').forEach(b=>b.setAttribute('aria-pressed',b===t?'true':'false'));return;}
  if(t.id==='nsend'){sendNote();return;}
  if(t.id==='gupd'){updatePrompt();return;}
  if(t.id==='gask'){const v=cleanWords(($('gans')||{}).value);if(v&&GASK)updatePrompt(GASK.note+' (Your question: '+GASK.q+' My answer: '+v+')');return;}
  if(t.id==='gkeep'){keepPrompt();return;}
  if(t.id==='gedit'){editPrompt();return;}
  if(t.id==='gedsave'){savePromptEdit();return;}
  if(t.id==='gedcancel'){$('gedbox').innerHTML='';return;}
  if(t.id==='gedreset'){resetPromptEdit();return;}
  if(t.id==='gdisc'){$('gres').innerHTML='';return;}
  if(t.id==='guse'){askUse();return;}
  if(t.id==='gusecan'){$('guseconf').innerHTML='';return;}
  if(t.id==='guseyes'){doUse();return;}
  if(t.id==='gtry'){tryAgain();return;}
  if(t.id==='gold'){keepOld();return;}
  if(t.id==='pcopy'){copyText($('ptext').textContent);return;}
});
document.addEventListener('input',e=>{
  if(e.target.id==='scrub'&&PL.D){setPlaying(false);const i=+e.target.value;PL.t=PL.D.ms[i]||0;drawFrame(i);}
  if(e.target.id==='q')doSearch();
});
$('dim').addEventListener('click',closeSheet);
addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});
wasWide=wide();boot();
</script>
</body>
</html>
