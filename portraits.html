<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14122b">
<title>Portrait Crops</title>
<!-- portraits.html: the Portrait Crop Tool (admin page, spec claude/portrait-crop-tool.md). Pick a party member, pan and zoom the square
     frame over the hero painting, SAVE. SAVE commits that character's {x,y,w,h} (hero-image pixels, w = h) into data/portrait-crops.json on GitHub
     (same token and route as art.html); EXPORT copies the whole json if saving is not possible. tools/sprite-bake/bake_portraits.py reads the json
     first and falls back to its FACE numbers (written to data/portrait-crops-base.json for this page). Untagged page. -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#14122b;color:#f4f1ff;font:14px/1.35 -apple-system,system-ui,"Segoe UI",sans-serif;min-height:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:6px 12px;border-bottom:1px solid #2c2852}
header h1{font-size:17px;margin:0;flex:1;letter-spacing:.5px}
select,input,button{font:inherit;color:#f4f1ff}
button{background:#0f0d24;border:1px solid #3a3566;border-radius:8px;padding:5px 11px;min-height:40px;cursor:pointer}
button.on{background:#7b6cff;border-color:#a89dff;color:#fff}
button:disabled{opacity:.4}
#exitbtn{background:#ffd34d;border-color:#ffd34d;color:#1a1737;font-weight:700}
#chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 12px}
#chips button{min-width:64px}
#chips button.saved::after{content:" \2713";color:#7dffa5}
#chips button.dirty::after{content:" *";color:#ffd968}
#chips button.saved.dirty::after{content:" \2713 *"}
#work{display:flex;flex-wrap:wrap;gap:12px;padding:6px 12px 14px;align-items:flex-start}
#left{flex:1 1 320px;display:flex;flex-direction:column;gap:8px;align-items:center}
#frame{position:relative;width:min(92vw,52vh,560px);aspect-ratio:1;overflow:hidden;border:3px solid #ffd34d;border-radius:6px;background:#fcedd4;touch-action:none;cursor:grab}
#frame canvas{display:block;width:100%;height:100%}
#frame .g{position:absolute;pointer-events:none;background:rgba(123,108,255,.55)}
#gv{left:50%;top:0;bottom:0;width:1px}
#gh{top:52%;left:0;right:0;height:1px}
#zrow{display:flex;gap:8px;align-items:center;width:min(92vw,52vh,560px)}
#zrow input[type=range]{flex:1;min-height:34px}
#right{flex:1 1 260px;display:flex;flex-direction:column;gap:10px}
.card{background:#1f1b40;border:1px solid #2c2852;border-radius:12px;padding:10px 12px}
.card h2{margin:0 0 6px;font-size:13px;color:#b9b3e6;font-weight:600;letter-spacing:.4px;text-transform:uppercase}
#prev{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
#prev figure{margin:0;text-align:center;font-size:11px;color:#b9b3e6}
#prev canvas{display:block;margin:0 auto 4px}
#pdlg{width:56px;height:56px;border:2px solid #7e6a3a;border-radius:4px;background:#2a3f2e}
#pcard{width:46px;height:46px;border-radius:5px;background:#385540}
#pbig{width:128px;height:128px;border-radius:6px}
#numbers{font:12px/1.4 ui-monospace,Menlo,monospace;color:#d9d4ff}
#row{display:none;flex-wrap:wrap;gap:6px}
#row figure{margin:0;text-align:center;font-size:11px;color:#b9b3e6}
#row canvas{display:block;width:84px;height:84px;border-radius:5px;background:#385540}
.act{display:flex;flex-wrap:wrap;gap:8px}
#save{background:#1f8f45;border-color:#46d37a;color:#fff;font-weight:700}
#msg{min-height:20px;font-size:13px}
#msg.err{color:#ff8d9b}#msg.ok{color:#7dffa5}
#export{display:none;width:100%;min-height:90px;background:#0f0d24;border:1px solid #3a3566;border-radius:8px;color:#d9d4ff;font:11px ui-monospace,Menlo,monospace;padding:6px}
</style>
</head>
<body>
<header><h1>Portrait Crops</h1><button id="headrow">Head row</button><button id="exitbtn">Exit</button></header>
<div id="chips"></div>
<div id="work">
  <div id="left">
    <div id="frame"><canvas id="cv" width="640" height="640"></canvas><i class="g" id="gv"></i><i class="g" id="gh"></i></div>
    <div id="zrow"><span>Zoom</span><input type="range" id="zoom" min="0" max="1000" value="500"><button id="reset" title="Back to the saved crop (or the current one)">Reset</button></div>
    <div style="font-size:12px;color:#b9b3e6;text-align:center;max-width:92vw">Drag to move. Pinch, wheel or slider to zoom. Double-tap to reset. Lines show the middle and the eye line the game uses.</div>
  </div>
  <div id="right">
    <div class="card"><h2>How the game shows it</h2>
      <div id="prev">
        <figure><canvas id="pdlg" width="56" height="56"></canvas>Dialogue 56</figure>
        <figure><canvas id="pcard" width="46" height="46"></canvas>Party card 46</figure>
        <figure><canvas id="pbig" width="128" height="128"></canvas>Big 128</figure>
      </div>
    </div>
    <div class="card" id="rowcard" style="display:none"><h2>Head row (all eight at one size)</h2><div id="row"></div></div>
    <div class="card"><h2>This crop</h2><div id="numbers"></div>
      <div class="act" style="margin-top:8px"><button id="save">SAVE</button><button id="export-btn">EXPORT all</button></div>
      <div id="msg"></div><textarea id="export" readonly></textarea>
    </div>
  </div>
</div>
<script>
'use strict';
const IDS=['tom','tnb','grace','rose','amy','deedee','boppy','nara'];
const NAMES={tom:'Tom',tnb:'TNB',grace:'Grace',rose:'Rose',amy:'Amy',deedee:'Deedee',boppy:'Boppy',nara:'Nara'};
const Q=new URLSearchParams(location.search);
const LS={get(k){try{return localStorage.getItem(k)||'';}catch(e){return '';}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}},del(k){try{localStorage.removeItem(k);}catch(e){}}};
const $=id=>document.getElementById(id);
const GH_OWNER='trivituso81',GH_REPO='adventures-of-tom',GH_BRANCH='main',PATH='data/portrait-crops.json';
const GH_BASE=()=>(Q.get('gh')||'https://api.github.com').replace(/\/+$/,'');
const ghUrl=p=>GH_BASE()+'/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+p;
const textToB64=s=>{const u=new TextEncoder().encode(s);let b='';for(let i=0;i<u.length;i+=0x8000)b+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(b);};
const b64ToText=c=>{const bin=atob(String(c).replace(/\s/g,'')),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u);};
const EYE_AT=0.52;           // the same eye line bake_portraits.py uses
let saved={},base={},imgs={},cur=IDS[0],draft={};   // saved: committed crops; base: the game's current crops; draft: unsaved edits {id:{x,y,s}}
try{draft=JSON.parse(LS.get('aot-portraits-draft')||'{}')||{};}catch(e){draft={};}

function crop(id){ // the crop in view: unsaved edit, else saved, else the game's current one
  if(draft[id]) return draft[id];
  const c=saved[id]||base[id]; return c?{x:c.x,y:c.y,s:c.w}:{x:0,y:0,s:512};
}
function savedCrop(id){const c=saved[id]||base[id];return c?{x:c.x,y:c.y,s:c.w}:{x:0,y:0,s:512};}
function clamp(c,im){const W=im.naturalWidth,H=im.naturalHeight;let s=Math.max(120,Math.min(c.s,W,H));return {s:s,x:Math.max(0,Math.min(c.x,W-s)),y:Math.max(0,Math.min(c.y,H-s))};}
function isDirty(id){const d=draft[id];if(!d)return false;const b=savedCrop(id);return Math.round(d.x)!==Math.round(b.x)||Math.round(d.y)!==Math.round(b.y)||Math.round(d.s)!==Math.round(b.s);}
function setCrop(c){ // c is clamped and stored as an unsaved edit
  const im=imgs[cur]; const k=clamp(c,im); draft[cur]=k;
  if(!isDirty(cur)) delete draft[cur];
  LS.set('aot-portraits-draft',JSON.stringify(draft)); redraw();
}
function drawTo(cv,id){
  const im=imgs[id]; if(!im) return; const c=crop(id), ctx=cv.getContext('2d');
  ctx.imageSmoothingQuality='high'; ctx.fillStyle='#fcedd4'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.drawImage(im,c.x,c.y,c.s,c.s,0,0,cv.width,cv.height);
}
function redraw(){
  if(!imgs[cur]) return;
  drawTo($('cv'),cur); drawTo($('pdlg'),cur); drawTo($('pcard'),cur); drawTo($('pbig'),cur);
  const c=crop(cur),im=imgs[cur],lo=120,hi=Math.min(im.naturalWidth,im.naturalHeight);
  $('zoom').value=Math.round(1000*(Math.log(hi/c.s)/Math.log(hi/lo)));
  const r=v=>Math.round(v);
  $('numbers').textContent=NAMES[cur]+': x '+r(c.x)+'  y '+r(c.y)+'  w '+r(c.s)+'  h '+r(c.s)+(isDirty(cur)?'   (not saved)':saved[cur]?'   (saved)':'   (game default)');
  $('gh').style.top=(EYE_AT*100)+'%';
  for(const b of document.querySelectorAll('#chips button')){const id=b.dataset.id;b.classList.toggle('on',id===cur);b.classList.toggle('saved',!!saved[id]);b.classList.toggle('dirty',isDirty(id));}
  if($('row').style.display==='flex') drawRow();
}
function drawRow(){
  const row=$('row'); row.innerHTML='';
  for(const id of IDS){const f=document.createElement('figure'),cv=document.createElement('canvas');cv.width=cv.height=168;drawTo(cv,id);f.appendChild(cv);f.appendChild(document.createTextNode(NAMES[id]));row.appendChild(f);}
}
function msg(t,cls){$('msg').textContent=t||'';$('msg').className=cls||'';}
function pick(id){cur=id;msg('');redraw();}

// --- gestures on the frame: drag pans, wheel and pinch zoom, double-tap resets
const ptrs=new Map(); let g0=null,lastTap=0;
function zoomAt(fx,fy,factor){ // keep the picture point under (fx,fy) (0..1 of the frame) fixed
  const c=crop(cur),ns=c.s*factor; setCrop({x:c.x+(c.s-ns)*fx,y:c.y+(c.s-ns)*fy,s:ns});
}
$('frame').addEventListener('pointerdown',e=>{
  $('frame').setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY}); g0=null;
  const now=Date.now(); if(ptrs.size===1&&now-lastTap<320){resetCrop();lastTap=0;} else lastTap=now;
});
$('frame').addEventListener('pointermove',e=>{
  const p=ptrs.get(e.pointerId); if(!p) return; const rect=$('frame').getBoundingClientRect();
  if(ptrs.size===1){ const c=crop(cur),k=c.s/rect.width; setCrop({x:c.x-(e.clientX-p.x)*k,y:c.y-(e.clientY-p.y)*k,s:c.s}); p.x=e.clientX;p.y=e.clientY; }
  else if(ptrs.size===2){
    p.x=e.clientX;p.y=e.clientY; const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),mx=(a.x+b.x)/2,my=(a.y+b.y)/2;
    if(g0&&g0.d>0){ const fx=(mx-rect.left)/rect.width,fy=(my-rect.top)/rect.height; zoomAt(Math.max(0,Math.min(1,fx)),Math.max(0,Math.min(1,fy)),g0.d/d);
      const c=crop(cur),k=c.s/rect.width; setCrop({x:c.x-(mx-g0.mx)*k,y:c.y-(my-g0.my)*k,s:c.s}); }
    g0={d,mx,my};
  }
});
for(const t of ['pointerup','pointercancel']) $('frame').addEventListener(t,e=>{ptrs.delete(e.pointerId);g0=null;});
$('frame').addEventListener('wheel',e=>{e.preventDefault();const r=$('frame').getBoundingClientRect();zoomAt((e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height,Math.exp(e.deltaY*0.0015));},{passive:false});
$('zoom').addEventListener('input',()=>{ // slider zoom about the frame's middle
  const im=imgs[cur],lo=120,hi=Math.min(im.naturalWidth,im.naturalHeight),ns=hi/Math.pow(hi/lo,$('zoom').value/1000),c=crop(cur);
  setCrop({x:c.x+(c.s-ns)/2,y:c.y+(c.s-ns)/2,s:ns});
});
function resetCrop(){delete draft[cur];LS.set('aot-portraits-draft',JSON.stringify(draft));msg('');redraw();}
$('reset').onclick=resetCrop;
$('headrow').onclick=()=>{const on=$('row').style.display!=='flex';$('row').style.display=on?'flex':'none';$('rowcard').style.display=on?'block':'none';$('headrow').classList.toggle('on',on);if(on)drawRow();};
$('exitbtn').onclick=()=>{location.href='index.html?admin=1';};

// --- saving: one GitHub commit that changes only this character's entry (reads the file fresh, retries when it moved)
function allCrops(){ // saved entries plus unsaved edits, whole json as the baker reads it
  const out={}; for(const id of Object.keys(saved)) out[id]=saved[id];
  for(const id of IDS) if(draft[id]){const d=draft[id];out[id]={x:Math.round(d.x),y:Math.round(d.y),w:Math.round(d.s),h:Math.round(d.s)};}
  return out;
}
async function gh(method,body){
  const tok=LS.get('aot-gh-token'); if(!tok) throw new Error('NOTOKEN');
  const r=await fetch(ghUrl(PATH)+(method==='GET'?'?ref='+GH_BRANCH+'&t='+Date.now():''),{method,cache:'no-store',headers:Object.assign({Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});
  const txt=await r.text(); let j=null; try{j=JSON.parse(txt);}catch(e){}
  return {ok:r.ok,status:r.status,json:j};
}
async function save(){
  const id=cur,d=crop(id),entry={x:Math.round(d.x),y:Math.round(d.y),w:Math.round(d.s),h:Math.round(d.s)};
  $('save').disabled=true; msg('Saving...');
  try{
    for(let i=0;i<6;i++){
      if(i) await new Promise(r=>setTimeout(r,1200*i));
      const g=await gh('GET'); if(!g.ok) throw new Error('GitHub said '+g.status+' reading the crops file.');
      const doc=JSON.parse(b64ToText(g.json.content||'')||'{}'); doc[id]=entry;
      const w=await gh('PUT',{message:'Portrait crop: '+NAMES[id],content:textToB64(JSON.stringify(doc,null,1)+'\n'),branch:GH_BRANCH,sha:g.json.sha});
      if(w.ok){ saved=doc; delete draft[id]; LS.set('aot-portraits-draft',JSON.stringify(draft)); redraw(); msg(NAMES[id]+' saved. Claude bakes it next.','ok'); return; }
      if(w.status!==409&&w.status!==422) throw new Error('GitHub said '+w.status+' saving.');
    }
    throw new Error('The crops file kept changing. Try again in a minute.');
  }catch(e){
    msg((e.message==='NOTOKEN'?'No GitHub token on this device (set it on the Art Library page).':e.message)+' Use EXPORT all and send the numbers to Claude.','err');
  }finally{$('save').disabled=false;}
}
$('save').onclick=save;
$('export-btn').onclick=async()=>{
  const txt=JSON.stringify(allCrops(),null,1)+'\n',ta=$('export'); ta.style.display='block'; ta.value=txt; ta.select();
  let ok=false; try{await navigator.clipboard.writeText(txt);ok=true;}catch(e){}
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download='portrait-crops.json';document.body.appendChild(a);a.click();a.remove();}catch(e){}
  msg(ok?'Copied. Paste it to Claude.':'Select the text below and copy it, or use the downloaded file.','ok');
};

// --- start: crops json (live from GitHub when the token is set, else the site copy), the game's current crops, then the eight hero paintings
async function loadJson(path,live){
  if(live&&LS.get('aot-gh-token')){try{const g=await (async()=>{const r=await fetch(ghUrl(path)+'?ref='+GH_BRANCH+'&t='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+LS.get('aot-gh-token'),Accept:'application/vnd.github+json'}});return r.ok?r.json():null;})();if(g&&g.content) return JSON.parse(b64ToText(g.content)||'{}');}catch(e){}}
  try{const r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(r.ok) return await r.json();}catch(e){}
  return {};
}
function loadImg(id){return new Promise(res=>{const im=new Image();im.onload=()=>{imgs[id]=im;res();};im.onerror=()=>res();im.src='art/raw/characters/'+id+'-hero-ref-v1.png';});}
(async()=>{
  const chips=$('chips');
  for(const id of IDS){const b=document.createElement('button');b.dataset.id=id;b.textContent=NAMES[id];b.onclick=()=>pick(id);chips.appendChild(b);}
  [saved,base]=await Promise.all([loadJson('data/portrait-crops.json',true),loadJson('data/portrait-crops-base.json',false)]);
  await Promise.all(IDS.map(loadImg));
  for(const id of Object.keys(draft)) if(!imgs[id]) delete draft[id];
  window.__PC={get cur(){return cur;},crop:()=>crop(cur),ready:true};
  redraw();
})();
</script>
</body>
</html>
