<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AoT Videos">
<meta name="theme-color" content="#14122b">
<link rel="apple-touch-icon" sizes="180x180" href="icon-admin-180.png?v=adminicons1">
<link rel="icon" type="image/png" sizes="32x32" href="icon-admin-32.png?v=adminicons1">
<title>Video History: The Adventures of Tom</title>
<!-- videohist1 (Tom 2026-11-21 21:15: "Can I see a history of videos that were generated so I can see why you rejected them").
     Reads data/video-history.json (tools/videohist/build.py) and the strips in art/video-history/. Watch opens the video on GitHub (branch wangen). -->
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#14122b;color:#f4f1ff;font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#14122b;border-bottom:1px solid #2c2852;min-height:56px}
header h1{font-size:20px;margin:0;flex:1}
a.back{color:#ffd34d;text-decoration:none;font-weight:600;padding:10px 4px;min-height:44px;display:flex;align-items:center}
main{max-width:1100px;margin:0 auto;padding:12px}
.sum{color:#b9b3e6;font-size:14px;margin:4px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.chips button{background:#211d45;color:#f4f1ff;border:1px solid #3a3570;border-radius:999px;padding:8px 14px;font:inherit;font-size:15px;min-height:40px}
.chips button.on{background:#ffd34d;color:#14122b;border-color:#ffd34d;font-weight:700}
input#q{width:100%;padding:10px 12px;border-radius:10px;border:1px solid #3a3570;background:#1b1838;color:#f4f1ff;font:inherit;margin-bottom:12px}
.anim{background:#1b1838;border:1px solid #2c2852;border-radius:14px;margin-bottom:14px;overflow:hidden}
.anim>h2{margin:0;padding:12px 14px;font-size:18px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.anim>h2 small{color:#b9b3e6;font-weight:400;font-size:14px}
.vid{border-top:1px solid #2c2852;padding:12px 14px}
.row1{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;font-size:14px;color:#b9b3e6}
.pill{border-radius:999px;padding:3px 10px;font-weight:700;font-size:13px}
.p-in_game{background:#2f7d4f;color:#fff}.p-passed{background:#3b6fd0;color:#fff}.p-rejected{background:#a8324a;color:#fff}.p-unchecked{background:#4a4670;color:#fff}
.strip{display:block;max-width:100%;height:auto;max-height:150px;border-radius:8px;background:#ff00ff;overflow-x:auto}
.stripwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
ul.why{margin:8px 0 0;padding-left:20px}
ul.why li{margin:4px 0}
a.watch{display:inline-block;margin-top:8px;color:#ffd34d;font-weight:600;text-decoration:none;padding:6px 0}
details.notes{padding:0 14px 12px;color:#cfc9f5;font-size:14px}
details.notes summary{cursor:pointer;color:#ffd34d;padding:8px 0;min-height:40px}
details.notes p{margin:6px 0;white-space:pre-wrap}
.empty{color:#b9b3e6;padding:20px;text-align:center}
</style>
</head>
<body>
<header><a class="back" href="admin.html">Admin</a><h1>Video History</h1></header>
<main>
<div class="sum" id="sum">Loading...</div>
<div class="chips" id="chips"></div>
<input id="q" type="search" placeholder="Search a person or move (rose, giddyup, mop...)">
<div id="list"></div>
</main>
<script>
'use strict';
const WORDS={in_game:'In the game',passed:'Passed the checks',rejected:'Rejected by the checks',unchecked:'Checked by eye only'};
const FILTERS=[['all','All'],['rejected','Rejected'],['in_game','In the game'],['unchecked','Checked by eye only']];
let DOC=null,F='all',Q='';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const who=j=>{const p=j.replace(/^guide-move-/,'').split('-');return p[0]?p[0][0].toUpperCase()+p[0].slice(1):j;};
const what=j=>j.replace(/^guide-move-/,'').split('-').slice(1).join(' ').replace(/ t\d+$/,'')||j;
function when(at){ if(!at) return ''; const d=new Date(at); if(isNaN(d)) return at;
  return d.toLocaleString('en-US',{timeZone:'America/Los_Angeles',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}); }
function render(){
  const V=DOC.videos.filter(v=>(F==='all'||v.verdict===F)&&(!Q||(v.job+' '+v.file).toLowerCase().includes(Q)));
  const by=new Map(); for(const v of V){ if(!by.has(v.job)) by.set(v.job,[]); by.get(v.job).push(v); }
  const groups=[...by.entries()].sort((a,b)=>{ const la=a[1].reduce((m,v)=>v.at>m?v.at:m,''),lb=b[1].reduce((m,v)=>v.at>m?v.at:m,''); return lb.localeCompare(la); });
  let h='';
  for(const [job,vs] of groups){
    vs.sort((a,b)=>(b.at||'').localeCompare(a.at||'')||b.rev-a.rev||b.attempt-a.attempt);
    const live=vs.some(v=>v.verdict==='in_game');
    h+='<section class="anim"><h2>'+esc(who(job))+': '+esc(what(job))+' <small>'+vs.length+' video'+(vs.length===1?'':'s')+(live?', one is in the game':'')+'</small></h2>';
    for(const v of vs){
      h+='<div class="vid"><div class="row1"><span class="pill p-'+v.verdict+'">'+WORDS[v.verdict]+'</span><span>'+esc(when(v.at))+'</span>'
        +'<span>Try '+v.rev+(v.attempt>1?', made again ('+v.attempt+')':'')+'</span>'+(v.price!=null?'<span>$'+(+v.price).toFixed(2)+'</span>':'')+(v.model?'<span>'+esc(v.model==='kling'?'Kling':v.model==='alibaba'?'Wan':v.model)+'</span>':'')+'</div>';
      if(v.strip) h+='<div class="stripwrap"><a href="'+esc(v.strip)+'" target="_blank" rel="noopener"><img class="strip" loading="lazy" alt="8 pictures from the video (tap to see them bigger)" src="'+esc(v.strip)+'"></a></div>';
      if(v.verdict!=='in_game'||v.reasons.length) h+='<ul class="why">'+v.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>';
      if(v.in_game) h+='<div class="row1" style="margin-top:6px">Plays in fights as '+esc(v.in_game)+'.</div>';
      h+='<a class="watch" target="_blank" rel="noopener" href="https://github.com/trivituso81/adventures-of-tom/blob/wangen/'+encodeURIComponent(v.file)+'">Watch the video</a></div>';
    }
    const n=DOC.notes[job]; if(n) h+='<details class="notes"><summary>What Claude changed between tries</summary><p>'+esc(n)+'</p></details>';
    h+='</section>';
  }
  document.getElementById('list').innerHTML=h||'<div class="empty">No videos match.</div>';
}
function chips(){
  const c=k=>k==='all'?DOC.videos.length:DOC.videos.filter(v=>v.verdict===k).length;
  document.getElementById('chips').innerHTML=FILTERS.map(([k,l])=>'<button data-f="'+k+'" class="'+(k===F?'on':'')+'">'+l+' ('+c(k)+')</button>').join('');
}
document.getElementById('chips').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; F=b.dataset.f; chips(); render(); });
document.getElementById('q').addEventListener('input',e=>{ Q=e.target.value.trim().toLowerCase(); render(); });
fetch('data/video-history.json?t='+Date.now(),{cache:'no-store'}).then(r=>r.json()).then(d=>{
  DOC=d; const n=d.videos.length,spent=d.videos.reduce((a,v)=>a+(+v.price||0),0);
  document.getElementById('sum').textContent=n+' battle videos made, $'+spent.toFixed(2)+' in all. Newest animation first. Updated '+when(d.built)+'.';
  chips(); render();
}).catch(()=>{ document.getElementById('sum').textContent='The video list could not be loaded.'; });
</script>
</body>
</html>
