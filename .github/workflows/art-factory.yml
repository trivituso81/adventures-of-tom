name: AoT Art Factory
run-name: "${{ github.event_name == 'push' && 'AoT Art Factory: push trigger (single clip or benchmark)' || format('AoT Art Factory: {0} / {1}{2}', inputs.stage, inputs.character_id, inputs.move_id != '' && format(' / {0}', inputs.move_id) || '') }}"

on:
  push:
    branches: [main]
    paths:
      - art-factory/single-clip-trigger.json
      - art-factory/benchmark-trigger.json
  workflow_dispatch:
    inputs:
      stage:
        description: Pipeline stage
        required: true
        type: choice
        options:
          - hero
          - turnaround
          - sheets
          - start_frames
          - qa_start_frames
          - battle_idle
          - battle_move_draft
          - battle_move_final
          - battle_state_draft
          - battle_state_final
          - qa_audit
          - rerun_failed
          - approve
          - revise
          - encode_alpha
      character_id:
        description: Character ID from art-factory/characters.json
        required: true
        default: tom
        type: string
      move_id:
        description: Move ID or battle state (dodge, cast, hit, ko)
        required: false
        default: ""
        type: string
      feedback:
        description: Revision notes or pitch override JSON
        required: false
        default: ""
        type: string
      candidate_index:
        description: Candidate index to approve (0-7)
        required: false
        default: "0"
        type: string

permissions:
  contents: write

jobs:
  detect:
    # Which trigger file did this push change? (head_commit.added/modified did not match, so ask git.)
    runs-on: ubuntu-latest
    outputs:
      single_clip: ${{ steps.d.outputs.single_clip }}
      benchmark: ${{ steps.d.outputs.benchmark }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: d
        run: |
          files=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          echo "$files"
          echo "single_clip=$(echo "$files" | grep -qx 'art-factory/single-clip-trigger.json' && [ '${{ github.event_name }}' = push ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "benchmark=$(echo "$files" | grep -qx 'art-factory/benchmark-trigger.json' && [ '${{ github.event_name }}' = push ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  generate:
    runs-on: ubuntu-latest
    needs: detect
    concurrency:
      group: aot-art-factory
      cancel-in-progress: false
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.stage != 'encode_alpha' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Step 1, verify the pipeline lock
        run: python3 scripts/verify_lock.py
      - name: Install pipeline dependencies
        run: pip install --quiet google-genai fal-client pillow mediapipe opencv-python-headless numpy requests scipy
      - name: Run Art Factory stage
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          STAGE: ${{ inputs.stage }}
          CHARACTER_ID: ${{ inputs.character_id }}
          MOVE_ID: ${{ inputs.move_id }}
          FEEDBACK: ${{ inputs.feedback }}
          CANDIDATE_INDEX: ${{ inputs.candidate_index }}
        run: python scripts/run_stage.py
      - name: Commit generated artifacts
        run: |
          git config user.name "aot-art-factory[bot]"
          git config user.email "aot-art-factory@users.noreply.github.com"
          git fetch origin main
          python3 -c '
          import json, subprocess
          from pathlib import Path
          p = Path("art-factory/queue.json")
          if p.exists():
              local = json.loads(p.read_text(encoding="utf-8"))
              try:
                  raw = subprocess.check_output(["git", "show", "origin/main:art-factory/queue.json"], text=True)
                  remote = json.loads(raw)
              except Exception:
                  remote = {"items": []}
              merged = {it["id"]: it for it in remote.get("items", []) if "id" in it}
              for it in local.get("items", []):
                  if "id" in it:
                      merged[it["id"]] = it
              local["items"] = list(merged.values())
              p.write_text(json.dumps(local, indent=2) + "\n", encoding="utf-8")
          '
          git add art-factory/
          if ! git diff --cached --quiet; then
            git commit -m "art-factory: ${{ inputs.stage }} (${{ inputs.character_id }})"
            git pull --rebase -X theirs origin main
            git push origin main
          fi

  encode_safari_alpha:
    runs-on: macos-latest
    needs: generate
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.stage == 'battle_idle' || inputs.stage == 'battle_move_draft' || inputs.stage == 'battle_move_final' || inputs.stage == 'battle_state_draft' || inputs.stage == 'battle_state_final' || inputs.stage == 'rerun_failed' || inputs.stage == 'encode_alpha') && (needs.generate.result == 'success' || needs.generate.result == 'skipped') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Ensure ffmpeg
        run: command -v ffmpeg >/dev/null || brew install ffmpeg
      - name: Encode WebM VP9 + Safari HEVC hvc1 alpha
        env:
          STAGE: ${{ inputs.stage }}
          CHARACTER_ID: ${{ inputs.character_id }}
          MOVE_ID: ${{ inputs.move_id }}
        run: python3 scripts/encode_safari_alpha.py
      - name: Commit encoded battle videos
        run: |
          git config user.name "aot-art-factory[bot]"
          git config user.email "aot-art-factory@users.noreply.github.com"
          git fetch origin main
          python3 -c '
          import json, subprocess
          from pathlib import Path
          p = Path("art-factory/queue.json")
          if p.exists():
              local = json.loads(p.read_text(encoding="utf-8"))
              try:
                  raw = subprocess.check_output(["git", "show", "origin/main:art-factory/queue.json"], text=True)
                  remote = json.loads(raw)
              except Exception:
                  remote = {"items": []}
              merged = {it["id"]: it for it in remote.get("items", []) if "id" in it}
              for it in local.get("items", []):
                  if "id" in it:
                      merged[it["id"]] = it
              local["items"] = list(merged.values())
              p.write_text(json.dumps(local, indent=2) + "\n", encoding="utf-8")
          '
          git add art-factory/
          if ! git diff --cached --quiet; then
            git commit -m "art-factory: alpha video ${{ inputs.character_id }} ${{ inputs.move_id }}"
            git pull --rebase -X theirs origin main
            git push origin main
          fi

  single_clip:
    # Push to art-factory/single-clip-trigger.json: ONE 480p clip (the move_ids in that file), max 2 renders, Python only.
    runs-on: ubuntu-latest
    needs: detect
    concurrency:
      group: aot-art-factory
      cancel-in-progress: false
    if: ${{ needs.detect.outputs.single_clip == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Step 1, verify the pipeline lock
        run: python3 scripts/verify_lock.py
      - name: Install ffmpeg (with libvpx for the alpha video)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install pipeline dependencies
        run: pip install --quiet google-genai fal-client pillow mediapipe opencv-python-headless numpy requests scipy
      - name: Single-clip render, two-stage QA gate, bake
        id: run
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
        run: python scripts/single_clip_run.py
      - name: Commit baked clip and QA report to main
        run: |
          git config user.name "aot-art-factory[bot]"
          git config user.email "aot-art-factory@users.noreply.github.com"
          git add art-factory data/clips art/clips index.html data/b3-kit-justin.js
          if ! git diff --cached --quiet; then
            git commit -m "art-factory: single clip $(python3 -c 'import json;print(json.load(open("art-factory/single-clip-trigger.json"))["run_id"])') (outcome ${{ steps.run.outcome }})"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
      - name: Fail the job when the clip did not pass the gate
        if: ${{ steps.run.outcome == 'failure' }}
        run: echo "Gate failed after the allowed renders (see art-factory/qa-single-clip-*.json)" && exit 1

  benchmark:
    # Push to art-factory/benchmark-trigger.json: Phase 1 benchmark, 3 Wan 3.0 seeds and 3 Kling v3 Pro seeds, hard cap in PIPELINE_LOCK.json.
    # macOS so the Safari hvc1 .mp4 can be encoded; only the winning seed is matted.
    runs-on: macos-latest
    needs: detect
    timeout-minutes: 90
    concurrency:
      group: aot-art-factory
      cancel-in-progress: false
    if: ${{ needs.detect.outputs.benchmark == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Step 1, verify the pipeline lock
        run: python3 scripts/verify_lock.py
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install pipeline dependencies
        run: pip install --quiet google-genai fal-client pillow opencv-python-headless numpy requests scipy
      - name: Benchmark, gate, matte the winner, bake
        id: run
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          COSTS_LOG_REPO: ${{ github.workspace }}   # costs2: tools/costlog.py writes this run's spend to data/costs.json
        run: python3 scripts/benchmark_run.py
      - name: Commit results to main
        if: always()
        run: |
          git config user.name "aot-art-factory[bot]"
          git config user.email "aot-art-factory@users.noreply.github.com"
          git add art-factory data/clips art/clips index.html data/costs.json
          if ! git diff --cached --quiet; then
            git commit -m "art-factory: benchmark $(python3 -c 'import json;print(json.load(open("art-factory/benchmark-trigger.json"))["run_id"])') (outcome ${{ steps.run.outcome }})"
            git pull --rebase -X theirs origin main
            git push origin main
          fi
      - name: Fail the job when no seed passed
        if: ${{ steps.run.outcome == 'failure' }}
        run: echo "Benchmark ended with a blocker (see art-factory/benchmark/*/BLOCKER_REPORT.md)" && exit 1
