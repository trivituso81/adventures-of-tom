name: wan-gen

# wanproof (claude/video-battle-plan.md section 4); wanch1: a list of jobs per run, up to 3 at once. Makes pictures and videos on fal.ai (tools/art-library/wangen.py): `start` is
# Grace's large left-facing start picture (Nano Banana 2.1), `video` is her guard video (Wan 3.0). What is sent is written in
# tools/art-library/wangen-jobs.json. MANUAL ONLY (workflow_dispatch); it never runs on a push. Needs the repo secret FAL_KEY (never printed).
# It changes nothing on main. Results, the fal answers and the money ledger go to branch `wangen` (never merged, never served); each run
# restores that branch first, so the $ cap counts every call ever made and a finished or pending call is never paid for twice.
# A Claude session checks the result and commits what passes to main itself.
#
# guidegen1: GENERATE THIS VIDEO in the Battle Guide commits data/wan-requests.json with the message "wan: generate <animation id>"; that push runs this job with
# --requests (the same job; $0.50 a video, at most $1 a request, at most $10 a day for the guide). The requests are taken off main before anything is paid,
# each video is judged by the clip gate and cut as a preview (tools/guidegen/make_take.py, secret XAI_API_KEY for the look check) and kept as a TAKE on the
# branch `guidegen` for Tom to compare in the Battle Guide. Nothing reaches the game until he presses Use this one (the guide-use Action).
#
# wanbulk (claude/video-battle-plan.md 4.12): Generate all N videos on a Tom board card commits data/board.json with the message "board: wan generate <card id>"; that push
# (or a manual run with `card`) runs wangen.py --bulk: every job of the card is made (3 at once, never past the cap), measured and look-checked (secret XAI_API_KEY),
# a job that failed only the edge check is made once more with a smaller picture, one that fails anything else is stopped with a Claude card, one that passes is baked
# and wired and merged into main as one build wanbulk-<card>-<run>, and a Tom card lists the new clips. Results stay on branch `wangen`.

on:
  push:
    branches: [main]
    paths: ['data/wan-requests.json', 'data/board.json']
  workflow_dispatch:
    inputs:
      card:
        description: 'wanbulk: a board card id with a `wan` job list: make, check, bake and wire all its jobs (takes the place of `what`).'
        required: false
        default: ''
      bulk_cap:
        description: 'wanbulk: most dollars this run may add to the ledger (empty: the card asks, never above `_bulk.cap` in the job file).'
        required: false
        default: ''
      what:
        description: 'Jobs in tools/art-library/wangen-jobs.json: one name, a comma list, or wildcards (tom-*). Up to 3 run at once.'
        required: true
        default: 'start'
      cap:
        description: 'Most dollars ever sent to fal by this Action (the ledger on branch wangen counts every run). A call that would pass it is refused.'
        required: false
        default: '2'
      dry_run:
        description: 'true: show the request and the cost, check the key (free), send nothing, spend nothing.'
        required: false
        default: 'true'
      requests:
        description: 'guidegen1: true = work through data/wan-requests.json (what the Battle Guide asked for) instead of the jobs in `what`.'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  gen:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'wan: generate ') || startsWith(github.event.head_commit.message, 'board: wan generate ') || startsWith(github.event.head_commit.message, 'board: answer t-wangaveup-')"
    runs-on: ubuntu-latest
    # wanstuck1 (2026-11-21): one run at a time, set on the JOB, not the workflow. At workflow level every push to main joined the group, and GitHub
    # keeps only one waiting run per group, so an unrelated push (whose job is skipped) cancelled a waiting paid run: Tom's tap at 04:31 UTC was lost that way.
    concurrency:
      group: wan-gen
      cancel-in-progress: false
    timeout-minutes: 170
    env:
      COSTS_LOG_REPO: ${{ github.workspace }}   # costs2: tools/costlog.py writes this run's spend to data/costs.json on main
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow numpy
      - name: Work out what this run is (jobs, guide requests, or a bulk card)
        id: mode
        env:
          MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          REQ: ${{ inputs.requests }}
          CARD_IN: ${{ inputs.card }}
        run: |
          mode=jobs; card=""
          if [ "$EVENT" = "push" ]; then
            first="${MSG%%$'\n'*}"
            if [[ "$first" == "board: wan generate "* ]]; then mode=bulk; card="${first#board: wan generate }"
            elif [[ "$first" == "board: answer t-wangaveup-"* ]]; then
              # wanstuck1: Tom answered an out-of-tries card. "Give it N more tries" runs the job's card again (wanbulk resets that job's count from the answer time).
              gid="${first#board: answer }"
              card=$(python3 -c "import json,sys; c=next((x for x in json.load(open('data/board.json'))['cards'] if x['id']==sys.argv[1]),{}); print(c.get('wan_card','') if str(c.get('answer','')).startswith('Give it') else '')" "$gid")
              if [ -n "$card" ]; then mode=bulk; else mode=none; fi
            else mode=guide; fi
          elif [ "$REQ" = "true" ]; then mode=guide
          elif [ -n "$CARD_IN" ]; then mode=bulk; card="$CARD_IN"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"; echo "card=$card" >> "$GITHUB_OUTPUT"; echo "mode: $mode card: $card"
      - name: Install the video tools for guide takes and bulk checks (the runner has no ffmpeg)
        if: ${{ steps.mode.outputs.mode != 'jobs' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install scipy opencv-python-headless
      - name: Restore what the wangen branch already holds
        run: |
          mkdir -p "$RUNNER_TEMP/wangen"
          if git ls-remote --exit-code --heads origin wangen >/dev/null 2>&1; then
            git fetch --depth 1 origin wangen
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/wangen"
          fi
          ls -la "$RUNNER_TEMP/wangen"
      - name: Make it
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          GUIDE_STATUS: '1'   # guidestatus1: tools/guidegen/progress.py writes status.json on branch guidegen
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}   # wanbulk: the look checks (never printed)
          WHAT: ${{ inputs.what }}
          CAP: ${{ inputs.cap }}
          DRY: ${{ inputs.dry_run }}
          MODE: ${{ steps.mode.outputs.mode }}
          CARD: ${{ steps.mode.outputs.card }}
          BULK_CAP: ${{ inputs.bulk_cap }}
          GUIDE: ${{ steps.mode.outputs.mode == 'guide' }}
        run: |
          set -o pipefail
          if [ "$MODE" = "none" ]; then echo "nothing to make (an out-of-tries answer that asks for no more tries)"; exit 0; fi
          ARGS=(--what "$WHAT" --cap "${CAP:-2}" --out "$RUNNER_TEMP/wangen")
          [ "$GUIDE" = "true" ] && ARGS=(--requests --out "$RUNNER_TEMP/wangen")
          if [ "$MODE" = "bulk" ]; then
            ARGS=(--bulk --card "$CARD" --out "$RUNNER_TEMP/wangen")
            [ -n "$BULK_CAP" ] && ARGS+=(--cap "$BULK_CAP")
          fi
          [ "$DRY" = "true" ] && ARGS+=(--dry-run)
          if [ "$DRY" != "true" ] && [ -z "$FAL_KEY" ]; then echo "Repo secret FAL_KEY is empty or missing."; exit 2; fi
          python3 -I tools/art-library/wangen.py "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/run.log"
          # wanqueue1 (2026-11-21): GitHub keeps only ONE waiting run per group, so a tap can still be dropped when two cards ask at once (Rose's pair tap,
          # 05:23 UTC). Every bulk run therefore also makes every other card still asking (wgen.want true), from the newest main.
          if [ "$MODE" = "bulk" ] && [ "$DRY" != "true" ]; then
            git fetch -q --depth 1 origin main && git show FETCH_HEAD:data/board.json > "$RUNNER_TEMP/board-now.json"
            for other in $(python3 -c "import json,sys; b=json.load(open(sys.argv[1])); print(' '.join(c['id'] for c in b['cards'] if (c.get('wgen') or {}).get('want') and c.get('wan') and c['id']!=sys.argv[2]))" "$RUNNER_TEMP/board-now.json" "$CARD"); do
              echo "also asking: $other"
              python3 -I tools/art-library/wangen.py --bulk --card "$other" --out "$RUNNER_TEMP/wangen" 2>&1 | tee -a "$RUNNER_TEMP/run.log" || true
            done
          fi
          { echo '### wan-gen'; echo '```'; tail -40 "$RUNNER_TEMP/run.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Make the takes (clip gate and preview) for the Battle Guide
        if: ${{ steps.mode.outputs.mode == 'guide' && inputs.dry_run != 'true' && always() }}
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/guidegen"
          if git ls-remote --exit-code --heads origin guidegen >/dev/null 2>&1; then
            git fetch --depth 1 origin guidegen
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/guidegen"
          fi
          [ -f "$RUNNER_TEMP/wangen/guide-results.json" ] || { echo "no guide results"; exit 0; }
          python3 -I tools/guidegen/make_take.py --results "$RUNNER_TEMP/wangen/guide-results.json" --state "$RUNNER_TEMP/guidegen" 2>&1 | tee "$RUNNER_TEMP/take.log"
          { echo '### guide takes'; echo '```'; tail -30 "$RUNNER_TEMP/take.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the takes on the guidegen branch
        if: ${{ steps.mode.outputs.mode == 'guide' && inputs.dry_run != 'true' && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/guidegen/takes.json" ] || { echo "no takes to keep"; exit 0; }
          rm -rf "$RUNNER_TEMP/guidegen/reconcile" "$RUNNER_TEMP/guidegen/replay.json"   # other jobs own these; only takes go back
          python3 -I tools/guidegen/keep.py "$RUNNER_TEMP/guidegen" --msg "guidegen: takes (run ${{ github.run_id }}) [skip ci]"
      - name: Tell the card when the run failed before it wrote a result (wanfeedback1)
        if: ${{ always() && steps.mode.outputs.mode == 'bulk' && inputs.dry_run != 'true' && steps.mode.outputs.card != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -I tools/art-library/wan_runfail.py --card "${{ steps.mode.outputs.card }}" --log "$RUNNER_TEMP/run.log" || true
      - name: Keep the results and the ledger on the wangen branch
        if: ${{ inputs.dry_run != 'true' && always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/wangen"
          cp "$RUNNER_TEMP/run.log" "run-${{ github.run_id }}.log" 2>/dev/null || true
          if [ -z "$(ls -A)" ]; then echo "nothing to save"; exit 0; fi
          git init -q -b wangen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "wangen: results and ledger (run ${{ github.run_id }}) [skip ci]"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" wangen
      - name: Rebuild the Video History and push it to main (videohist2)
        if: ${{ inputs.dry_run != 'true' && steps.mode.outputs.mode != 'none' && steps.mode.outputs.mode != 'jobs' && always() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # fresh clone of main inside publish.py (this checkout is shallow and main may have moved); needs ffmpeg for the strips (installed above)
          python3 -I tools/videohist/publish.py --branch-dir "$RUNNER_TEMP/wangen" --run-id "${{ github.run_id }}" \
            --remote "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
