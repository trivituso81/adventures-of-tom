name: guide-use

# guidegen1. USE THIS ONE in the Battle Guide (battle-guide.html) commits data/guide-use.json with the message "guide: use <animation id>".
# That push runs this job: it empties the request list on main, then tools/guidegen/use_take.py puts the take Tom chose into the game (cuts the clip,
# points the animation at it, removes what it replaces, records the prompt), the build is named and tagged, committed to main and published.
# Everything a take is made of lives on the branch `guidegen` (never main, never served). Nothing here calls a paid service.

on:
  push:
    branches: [main]
    paths: ['data/guide-use.json']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: guideuse
  cancel-in-progress: false

jobs:
  use:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'guide: use ')"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tools
        run: |
          pip install pillow numpy scipy opencv-python-headless
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg || true; fi
          if ! command -v ffmpeg >/dev/null; then pip install imageio-ffmpeg && sudo ln -sf "$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg; fi
          command -v ffmpeg; command -v ffprobe || echo "no ffprobe (the recipe falls back to ffmpeg)"
      - name: Restore the takes from the guidegen branch
        run: |
          mkdir -p "$RUNNER_TEMP/guidegen"
          if git ls-remote --exit-code --heads origin guidegen >/dev/null 2>&1; then
            git fetch --depth 1 origin guidegen
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/guidegen"
          fi
      - name: Use the takes
        id: use
        run: |
          set -o pipefail
          TAG="guideuse-${GITHUB_RUN_ID}"
          python3 -I tools/guidegen/use_take.py --state "$RUNNER_TEMP/guidegen" --tag "$TAG" 2>&1 | tee "$RUNNER_TEMP/use.log" && rc=0 || rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          { echo '### guide-use'; echo '```'; tail -40 "$RUNNER_TEMP/use.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Name the build and move the cache tags
        run: |
          python3 tools/guidegen/use_take.py --changes "$RUNNER_TEMP/guidegen/use-report.json" --tag "${{ steps.use.outputs.tag }}" || true
          if [ -z "$(git status --porcelain -- . ':!data/guide-use.json')" ]; then echo "nothing to ship"; exit 0; fi
          python3 tools/art-library/bump_tags.py "${{ steps.use.outputs.tag }}" --base HEAD
      - name: Commit and push
        id: push
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "guide-use: ${{ steps.use.outputs.tag }}, takes chosen in the Battle Guide are in the game [skip ci]"
          # startpics11 (2026-11-22): main moves all day and every build touches the four stamp files (engine/main.js, index.html, data/build-history.js, docs/CHANGES.md), so a plain
          # rebase conflicted in all four and the take never reached the game (Tom's Use this one for TNB Idle and Guard, 21:13 and 21:57 UTC, failed this way after 5 tries).
          # Now every try starts from the newest main: the take's own files are re-applied, my CHANGES entry is put back on top, and the stamp is made again on top of what is there.
          TAG="${{ steps.use.outputs.tag }}"
          git diff HEAD~1 HEAD --binary -- . ':!engine/main.js' ':!index.html' ':!data/build-history.js' ':!docs/CHANGES.md' > "$RUNNER_TEMP/payload.diff"
          python3 - "$RUNNER_TEMP/entry.md" <<'PY'
          import subprocess, sys
          s = subprocess.run(['git', 'show', 'HEAD:docs/CHANGES.md'], capture_output=True, text=True).stdout
          old = subprocess.run(['git', 'show', 'HEAD~1:docs/CHANGES.md'], capture_output=True, text=True).stdout
          open(sys.argv[1], 'w').write(s[:len(s) - len(old)] if s.endswith(old) else s[:s.index('\n## ', 5) + 1])
          PY
          for i in 1 2 3 4 5 6; do
            git fetch origin main
            git reset -q --hard origin/main
            git apply --3way "$RUNNER_TEMP/payload.diff" || { echo "payload did not apply, try $i"; sleep 5; continue; }
            python3 -c "import sys; p='docs/CHANGES.md'; s=open(p).read(); open(p,'w').write(open(sys.argv[1]).read()+s)" "$RUNNER_TEMP/entry.md"
            python3 tools/art-library/bump_tags.py "$TAG" --base HEAD >/dev/null 2>&1 || { echo "stamp failed, try $i"; sleep 5; continue; }
            if git grep -q '^<<<<<<<' ; then echo "conflict markers, try $i"; continue; fi
            git add -A
            git commit -q -m "guide-use: $TAG, takes chosen in the Battle Guide are in the game [skip ci]"
            git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "push failed 6 times"; exit 1
      - name: Tell the report when the push failed (startpics11)
        if: ${{ always() && steps.push.outcome == 'failure' }}
        run: |
          python3 - "$RUNNER_TEMP/guidegen/use-report.json" <<'PY'
          import json, sys
          try: d = json.load(open(sys.argv[1]))
          except Exception: sys.exit(0)
          for x in d.get('done', []): d.setdefault('failed', []).append({'anim': x.get('anim'), 'why': 'The take was cut but GitHub could not save it to the game (the main branch kept moving). Tap Use this one again.'})
          d['done'] = []
          json.dump(d, open(sys.argv[1], 'w'), indent=1)
          PY
      - name: Keep the report on the guidegen branch
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/guidegen/use-report.json" ] || exit 0
          mkdir -p "$RUNNER_TEMP/keep" && cp "$RUNNER_TEMP/guidegen/use-report.json" "$RUNNER_TEMP/keep/"
          [ -f "$RUNNER_TEMP/guidegen/takes-used.json" ] && cp "$RUNNER_TEMP/guidegen/takes-used.json" "$RUNNER_TEMP/keep/takes.json"
          python3 -I tools/guidegen/keep.py "$RUNNER_TEMP/keep" --msg "guidegen: use report (run ${{ github.run_id }}) [skip ci]"
      - name: Stop with an error when a take could not be used
        if: ${{ steps.use.outputs.rc != '0' }}
        run: |
          echo "::error::guide-use could not put a take in the game; nothing of it was kept. See the Use the takes step and use-report.json on the guidegen branch."
          exit 1
      - name: Publish
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/${{ github.repository }}/actions/workflows/publish.yml/dispatches -f ref=main
      - name: Phone notification (startpics11)
        if: ${{ always() }}
        run: |
          python3 - "$RUNNER_TEMP/guidegen/use-report.json" "${{ steps.use.outputs.rc }}" "${{ steps.push.outcome }}" <<'PY'
          import json, sys
          sys.path.insert(0, 'tools'); import notify
          try: d = json.load(open(sys.argv[1]))
          except Exception: d = {}
          rc, push = sys.argv[2], sys.argv[3]
          for x in d.get('done', []):
              if push != 'failure': notify.send(notify.label(x.get('anim')) + ' is in the game', 'The build goes live in a few minutes. Reload the title screen, then look at it in a fight.', 'white_check_mark')
          for x in d.get('failed', []):
              notify.send(notify.label(x.get('anim')) + ' could not be put in the game', str(x.get('why', ''))[:200], 'x')
          if not d.get('done') and not d.get('failed'): notify.send('Use this one did nothing', 'No take was found to use. Open the Battle Guide and try again.', 'warning')
          PY
