name: sandbox-justin-test

# Isolated proof of concept for ONE battle animation (Justin, pf-justin-bb-basic). MANUAL ONLY. Touches nothing outside art-factory/sandbox-justin-test/.
# One attempt, hard cap $1.00 (ledger in the sandbox folder). Needs repo secret FAL_KEY. Delete this file after the test.

on:
  workflow_dispatch:
    inputs:
      go:
        description: 'Type YES to spend up to $1.00 on fal (about $0.30 expected).'
        required: true
        default: 'no'
      stage:
        description: 'end = only make the keyframe; video = continue to the video'
        required: true
        default: 'end'

permissions:
  contents: write

jobs:
  justin:
    if: ${{ github.event.inputs.go == 'YES' }}
    runs-on: ubuntu-latest
    concurrency:
      group: sandbox-justin-test
      cancel-in-progress: false
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests numpy
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Make keyframes, video, keyed WebM
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          STAGE: ${{ github.event.inputs.stage }}
        run: python3 art-factory/sandbox-justin-test/run.py
      - name: Save results (only the sandbox folder)
        if: ${{ always() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-factory/sandbox-justin-test
          git diff --cached --quiet && exit 0
          git commit -m "sandbox: justin stud-finder test results"
          for i in 1 2 3 4 5 6; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
