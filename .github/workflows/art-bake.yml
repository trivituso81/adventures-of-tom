name: art-bake

# Art Library step B5. When Tom approves a picture in art.html, the page commits it to art/raw/<tab>/<id>-v<n>.png on main.
# This job bakes it into the game (tools/art-library/art_bake.py), moves every cache tag the tag check demands
# (tools/art-library/bump_tags.py) and commits the result back to main. Entries without a `bake` field in
# data/art-prompts.json are only stored. Run it by hand from the Actions tab (workflow_dispatch) to rebake the newest push.

on:
  push:
    branches: [main]
    paths:
      - 'art/raw/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: art-bake
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    # The job's own commit touches no art/raw file, so it cannot start this workflow again; [skip ci] is a second guard.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bake tools
        run: pip install pillow numpy scipy
      - name: Bake approved pictures and bump tags
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ]; then BEFORE=HEAD~1; fi
          python3 tools/art-library/art_bake.py --before "$BEFORE"
      - name: Tag check
        run: python3 tools/tag_check.py
        env:
          TAG_BASE: HEAD
      - name: Commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "nothing to commit"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "art-bake: baked approved Art Library pictures, cache tags moved [skip ci]"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep 5
          done
          echo "push failed 3 times"; exit 1
