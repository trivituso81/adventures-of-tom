name: Build Script Studio

on:
  push:
    branches:
      - main
    paths:
      - 'tools/script-studio/**'
      - '.github/workflows/build-script-studio.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-studio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and build Script Studio
        working-directory: tools/script-studio
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Commit compiled /script-studio assets back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script-studio/
          if git diff --cached --quiet; then
            echo "No build output changes in script-studio/."
          else
            git commit -m "chore(script-studio): auto-build dist [skip ci]"
            git pull --rebase origin main
            git push origin main
          fi
