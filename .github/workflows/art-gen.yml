name: art-gen

# artgen1. Makes every picture of a board card on xAI when Tom taps "Generate all" on the card (tools/art-library/artgen.py). The page saves
# data/board.json with the commit message "board: generate <card id>"; this workflow runs on that push only (every other push skips it without
# a checkout). It never approves anything: the pictures wait on branch `artgen` (never merged, never served) and the Art Library imports them
# for Tom's APPROVE or REJECT. Needs the repo secret XAI_API_KEY (never printed). Sessions can run it by hand (workflow_dispatch, dry_run true
# by default); the first paid run is Tom's tap. art/raw is NOT checked out (it holds every approved picture); a reference picture is read with `git show HEAD:<path>`,
# which fetches just that file. Plan: claude/artgen-plan.md.

on:
  push:
    branches: [main]
    paths: ['data/board.json']
  workflow_dispatch:
    inputs:
      card:
        description: 'Board card id whose pictures to make (needed unless replay is set).'
        required: false
        default: ''
      ids:
        description: 'Only these Art Library entry ids, comma separated. Empty: the card''s own list.'
        required: false
        default: ''
      cap:
        description: 'Most dollars sent to xAI in this run (0 = twice the estimate, at least 1).'
        required: false
        default: '0'
      replay:
        description: 'artgen2: a number N above 0 judges the N newest approved pictures with the QA (no pictures made; costs real xAI money up to cap, default 1.5) and prints how often each question says no.'
        required: false
        default: '0'
      dry_run:
        description: 'true: list what would be made and the cost, call nothing, spend nothing.'
        required: false
        default: 'true'

permissions:
  contents: write
  actions: write

concurrency:
  group: art-gen
  cancel-in-progress: false

jobs:
  gen:
    if: "github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'board: generate ')"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /data/art-prompts.json
            /data/board.json
            /tools/art-library/
            /tools/clip-gate/vision.py
            /.github/
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow
      - name: QA replay on pictures you approved (only when replay is set)
        if: ${{ inputs.replay != '' && inputs.replay != '0' }}
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          N: ${{ inputs.replay }}
          CAP: ${{ inputs.cap }}
        run: |
          set -o pipefail
          C="${CAP:-0}"; [ "$C" = "0" ] && C=1.5
          python3 -I tools/art-library/artqa.py --replay "$N" --cap "$C" --out "$RUNNER_TEMP/replay" 2>&1 | tee "$RUNNER_TEMP/replay.log"
          { echo '### artqa replay'; echo '```'; tail -40 "$RUNNER_TEMP/replay.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && inputs.replay != '' && inputs.replay != '0' }}
        with:
          name: artqa-replay
          path: ${{ runner.temp }}/replay
          retention-days: 30
      - name: Restore what the artgen branch already holds
        if: ${{ inputs.replay == '' || inputs.replay == '0' }}
        run: |
          mkdir -p "$RUNNER_TEMP/artgen"
          if git ls-remote --exit-code --heads origin artgen >/dev/null 2>&1; then
            git fetch --depth 1 origin artgen
            git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/artgen"
          fi
          ls -la "$RUNNER_TEMP/artgen"
      - name: Make the pictures
        if: ${{ inputs.replay == '' || inputs.replay == '0' }}
        env:
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          CARD: ${{ inputs.card }}
          IDS: ${{ inputs.ids }}
          CAP: ${{ inputs.cap }}
          DRY: ${{ inputs.dry_run }}
          EVENT: ${{ github.event_name }}
        run: |
          set -o pipefail
          ARGS=(--out "$RUNNER_TEMP/artgen")
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ARGS+=(--card "$CARD" --cap "${CAP:-0}")
            [ -n "$IDS" ] && ARGS+=(--ids "$IDS")
            [ "$DRY" = "true" ] && ARGS+=(--dry-run)
          fi
          python3 -I tools/art-library/artgen.py "${ARGS[@]}" 2>&1 | tee "$RUNNER_TEMP/run.log"
          { echo '### art-gen'; echo '```'; tail -60 "$RUNNER_TEMP/run.log"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the pictures on the artgen branch
        if: ${{ always() && inputs.dry_run != 'true' && (inputs.replay == '' || inputs.replay == '0') }}
        run: python3 -I tools/art-library/artgen.py --save-only --out "$RUNNER_TEMP/artgen"
      - name: Keep a copy as a workflow artifact
        if: ${{ always() && inputs.dry_run != 'true' && (inputs.replay == '' || inputs.replay == '0') }}
        uses: actions/upload-artifact@v4
        with:
          name: art-gen-output
          path: ${{ runner.temp }}/artgen
          retention-days: 30
