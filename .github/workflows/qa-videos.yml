name: QA Pass-1 Videos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai pillow

      - name: Run automated video QA
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/qa_videos.py

      - name: Commit QA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add art-factory/queue.json art-factory/move-packets-pass1.json art-factory/qa-report-pass1-drafts.json
          git diff --staged --quiet || git commit -m "Automated QA report for Pass-1 draft videos"
          git push
