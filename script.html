<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14122b">
<title>Script Editor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#14122b;color:#f4f1ff;font:16px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;background:#14122b;border-bottom:1px solid #2c2852;z-index:5;flex-wrap:wrap}
header h1{font-size:19px;margin:0;flex:1;min-width:130px}
a.back{color:#ffd34d;text-decoration:none;font-weight:600;padding:10px 4px}
main{max-width:760px;margin:0 auto;padding:10px 0 140px}
.pad{padding:0 14px}
button{font:inherit;border:0;border-radius:12px;padding:8px 12px;min-height:44px;min-width:44px;background:#3a3566;color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.4}
button.gold{background:#ffd34d;color:#241b00}
button.purple{background:#7b6cff}
button.rec{background:#c8414f}
button.small{min-height:44px;padding:6px 10px;font-size:14px;border-radius:10px}
button.ghost{background:transparent;border:1px solid #3a3566;color:#d9d4ff}
button.on{background:#7b6cff}
input[type=search],input[type=number],textarea,select{width:100%;padding:11px;border-radius:10px;border:1px solid #3a3566;background:#0f0d24;color:#fff;font:inherit;font-size:16px}
textarea{min-height:76px;resize:vertical;line-height:1.35}
.hint{color:#b9b3e6;font-size:13px}.err{color:#ff8b97;font-size:13px}.ok{color:#7be0a6;font-size:13px}.warn{color:#ffd34d;font-size:13px}
.bar2{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:6px 14px}
.sw{display:flex;gap:0;border:1px solid #3a3566;border-radius:12px;overflow:hidden}
.sw button{border-radius:0;background:#0f0d24;min-height:40px}
.sw button.on{background:#7b6cff}
.chap{margin:10px 0;border-top:1px solid #2c2852}
.chap>.hd{display:flex;align-items:center;gap:8px;padding:10px 14px;background:#1a1736}
.chap>.hd .t{flex:1;font-weight:700;font-size:17px;cursor:pointer;min-height:44px;display:flex;align-items:center}
.chap>.hd .n{font-weight:400;color:#b9b3e6;font-size:13px;margin-left:8px}
.scene{margin:8px 14px;background:#1d1a3d;border:1px solid #2c2852;border-radius:14px;overflow:hidden}
.scene>.hd{display:flex;align-items:center;gap:8px;padding:8px 12px;flex-wrap:wrap}
.scene>.hd .t{flex:1;min-width:120px;font-weight:600;cursor:pointer;min-height:44px;display:flex;flex-direction:column;justify-content:center}
.scene>.hd .t small{font-weight:400;color:#b9b3e6;font-size:12px}
.badge{display:inline-block;background:#ffd34d;color:#241b00;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px}
.stage{padding:0 12px}
.stage img{width:100%;border-radius:10px;display:block;background:#0f0d24}
.who{padding:4px 12px 8px;font-size:13px;color:#b9b3e6}
.lines{padding:2px 8px 10px}
.act{margin:6px 6px;color:#b9b3e6;font-style:italic;font-size:14px}
.grp{margin:8px 6px 2px;color:#ffd34d;font-size:12px;text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:8px;align-items:flex-start;padding:7px 6px;border-top:1px solid #2c2852}
.row.ind{margin-left:14px}
.row.rm .tx{text-decoration:line-through;opacity:.5}
.row.ed{background:#242052}
.chk{width:26px;height:26px;margin-top:8px;accent-color:#7b6cff;flex:none}
.sp{flex:none;min-width:58px;max-width:92px;font-weight:700;color:#ffd34d;font-size:14px;padding-top:2px;word-break:break-word;cursor:pointer;min-height:44px;display:flex;align-items:flex-start;padding-top:9px}
.body{flex:1;min-width:0}
.tx{cursor:text;min-height:30px;padding:5px 0;word-wrap:break-word}
.tx .cue{background:#3a3566;border-radius:5px;padding:0 2px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:2px}
.tag{font-size:12px;border:1px solid #3a3566;border-radius:10px;padding:2px 8px;color:#d9d4ff;display:inline-flex;align-items:center;gap:4px;min-height:26px}
.tag.chg{border-color:#ffd34d;color:#ffd34d}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;background:#555}
.dot.clip{background:#7be0a6}.dot.old{background:#ffb24d}.dot.none{background:transparent;border:2px solid #8f88c4}.dot.new{background:transparent;border:2px dashed #ffd34d}
.acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.panel{background:#14122b;border:1px solid #3a3566;border-radius:12px;padding:10px;margin-top:6px}
.panel h4{margin:8px 0 4px;font-size:13px;color:#b9b3e6;text-transform:uppercase;letter-spacing:1px}
.pr{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:4px 0}
.beat{margin:6px 6px;padding:6px 10px;border:1px dashed #3a3566;border-radius:10px;color:#b9b3e6;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sheet{position:fixed;inset:0;background:#000a;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet>div{background:#1d1a3d;border-radius:18px 18px 0 0;width:100%;max-width:760px;max-height:82vh;overflow:auto;padding:14px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.grid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;font-size:13px;background:#0f0d24;border:1px solid #3a3566;min-height:44px}
.grid button.on{border-color:#ffd34d}
.grid img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:#2c2852}
.cuew{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.cuew button{min-height:44px;background:#0f0d24;border:1px solid #3a3566}
.empty{padding:30px;text-align:center;color:#b9b3e6}
#toast{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));background:#7b6cff;color:#fff;padding:12px 14px;border-radius:12px;z-index:30;display:none}
.cv{scroll-margin-top:130px;margin:10px 6px;border:1px solid #2c2852;border-radius:12px;overflow:hidden;background:#191634}
.cvh{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;background:#221e48}
.cvh .t{flex:1;min-width:0;font-weight:700;font-size:15px;cursor:pointer;min-height:44px}
.cvh .t small{display:block;font-weight:400;color:#b9b3e6;font-size:13px;margin-top:2px}
.cvh .t small.miss{color:#8f88c4;font-style:italic}
.st{font-size:12px;border-radius:10px;padding:3px 9px;font-weight:700;white-space:nowrap;border:0;min-height:30px;min-width:0;margin-top:6px}
.st.none{background:#3a3566;color:#d9d4ff}.st.work{background:#ff8b5c;color:#2a0f00}.st.shop{background:#7b6cff;color:#fff}.st.lock{background:#7be0a6;color:#06240f}
.cvb{display:flex;gap:6px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid #2c2852}
.note{margin:6px 10px;padding:8px 10px;border-left:3px solid #ffd34d;background:#14122b;font-size:14px;white-space:pre-wrap;cursor:pointer}
.cvhid{margin:8px 12px;color:#8f88c4;font-size:13px}
.sg{margin:2px 6px 8px;padding:8px 10px;border:1px dashed #7b6cff;border-radius:10px;background:#14122b}
.sg .src{font-size:12px;color:#b9b3e6;margin-bottom:4px}
.sg .bf{color:#8f88c4;text-decoration:line-through;font-size:14px}
.sg .af{color:#fff;font-size:15px;margin:4px 0}
.sg .opt{border-top:1px solid #2c2852;padding-top:6px;margin-top:6px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 14px 8px;-webkit-overflow-scrolling:touch}
.chips button{flex:none;white-space:nowrap;min-height:40px;background:#0f0d24;border:1px solid #3a3566;font-size:14px}
.chips button.on{background:#7b6cff;border-color:#7b6cff}
.chips .c{font-weight:400;opacity:.8;margin-left:4px}
.tag.plot{border-color:#7be0a6;color:#7be0a6}
.stbtn{display:block;width:100%;text-align:left;margin:6px 0;padding:10px 12px}
.stbtn small{display:block;font-weight:400;opacity:.85}
.selbar{position:fixed;left:0;right:0;bottom:0;background:#1d1a3d;border-top:1px solid #3a3566;padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:none;gap:8px;align-items:center;z-index:10}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">Game</a>
  <h1>Script Editor</h1>
  <button class="small ghost" id="bSel">Select</button>
  <button class="small" id="bCopyAll">Copy whole game</button>
  <button class="small" id="bPaste">Paste back</button>
  <button class="small gold" id="bSend">Send to Claude</button>
</header>
<div class="bar2">
  <div class="sw" id="fmt"><button data-f="words" class="on">Words only</button><button data-f="expr">With expressions and pauses</button></div>
  <div style="flex:1;min-width:150px"><input type="search" id="q" placeholder="Find a line, a speaker or a scene"></div>
</div>
<div class="chips" id="chips"></div>
<div class="bar2"><span class="hint" id="sum">Loading the script...</span></div>
<main id="list"></main>
<div class="selbar" id="selbar"><span id="selN" class="hint" style="flex:1"></span><button class="purple" id="bShopSel">Workshop ticked</button><button class="gold" id="bCopySel">Copy ticked</button><button class="ghost" id="bSelOff">Done</button></div>
<div id="toast"></div>
<div id="sheet" class="sheet" hidden><div id="sheetIn"></div></div>
<script src="engine/admin-music.js?v=adminvol1"></script>
<script src="engine/script-edits.js?v=scriptedit1"></script>
<script src="engine/script-voice.js?v=scriptedit1"></script>
<script>
'use strict';
// script.html: the Script Editor (docs/SCRIPT_EDITOR.md). Every scene's dialogue in story order, read from data/script-index.json (tools/script-index/build.py).
// Edits are kept on this phone (localStorage aot-script-draft) and applied by engine/script-edits.js when a scene plays; SEND TO CLAUDE writes them to
// data/script-edits.json in the repo, and a Claude session folds them into the scene files ("Apply my script edits", tools/script-index/apply.py).
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MOODS=['happy','proud','loving','surprised','unimpressed','scared','angry','sad'];
const TALKS=[['tell','Explaining'],['point','Pointing'],['ask','Asking'],['answer','Answering']];
const PAUSES=[0,.3,.6,1,1.5,2,3];
let IX=null, DRAFT={scenes:{}}, SENT={scenes:{}}, FMT='words', SELMODE=false, Q='';
const OPEN=new Set(), OPENCH=new Set(), PANEL=new Set(), EDITING=new Set(), CUEMODE={}, SEL=new Set();
function toast(m,ms){ const t=$('toast'); t.textContent=m; t.style.display='block'; clearTimeout(toast.h); toast.h=setTimeout(()=>t.style.display='none',ms||3200); }
function saveDraft(){ try{ localStorage.setItem('aot-script-draft',JSON.stringify(DRAFT)); }catch(e){ toast('This phone would not save your edits. Free some space and try again.'); } }
// the state of one scene: the unsent copy if there is one, else what was sent and is not folded in yet
function stateOf(id){ return DRAFT.scenes[id]||SENT.scenes[id]||null; }
function mut(id){ // a writable copy of the scene's state, stored in the draft
  if(!DRAFT.scenes[id]){ const s=SENT.scenes[id]; DRAFT.scenes[id]=s?JSON.parse(JSON.stringify(s)):{lines:{},ins:[],order:[]}; }
  const s=DRAFT.scenes[id]; s.lines=s.lines||{}; s.ins=s.ins||[]; return s;
}
function tidy(id){ // drop empty entries; a scene with nothing left leaves the draft
  const s=DRAFT.scenes[id]; if(!s) return;
  for(const r of Object.keys(s.lines)){ const e=s.lines[r]; for(const k of Object.keys(e)) if(e[k]===undefined||e[k]===''||e[k]===null||(k==='react'&&!e[k].length)||((k==='pre'||k==='post')&&!e[k])) delete e[k]; if(!Object.keys(e).length) delete s.lines[r]; }
  const sc=IX.scenes[id], base=sc?baseOrder(sc):[];
  if(s.order&&!s.ins.length&&JSON.stringify(s.order)===JSON.stringify(base)) delete s.order;
  if(!Object.keys(s.lines).length&&!s.ins.length&&!s.order) delete DRAFT.scenes[id];
  saveDraft();
}
function baseOrder(sc){ const r=[]; for(const st of sc.steps) if(st.k==='talk') for(const ln of st.lines) r.push(ln.ref); return r; }
function ensureOrder(id){ const s=mut(id); if(!s.order||!s.order.length) s.order=baseOrder(IX.scenes[id]); return s; }
function editCount(id){ const s=stateOf(id); if(!s) return 0; let n=Object.keys(s.lines||{}).length+(s.ins||[]).length; if(s.order&&JSON.stringify(s.order)!==JSON.stringify(baseOrder(IX.scenes[id]))&&!(s.ins||[]).length) n++; return n; }
function draftCount(){ return Object.keys(DRAFT.scenes).length; }

// ---------- the scene as the game will play it (engine/script-edits.js seApply, show mode) ----------
function synth(sc){ // index steps -> nested step arrays, with the non-talk steps as {act}
  const top=[],at={'':top},grp={};
  for(const st of sc.steps){
    if(st.k==='group'){ const arr=[]; let g=grp[st.i]; if(!g){ g={__grp:1,label:st.label}; grp[st.i]=g; const parentKey=st.i.includes('.')?st.i.slice(0,st.i.lastIndexOf('.',st.i.lastIndexOf('.')-1)+1):''; (at[parentKey]||top).push(g); } g[st.op]=arr; g.label=g.label||st.label; at[st.i+'.'+st.op+'.']=arr; continue; }
    const key=st.i.includes('.')?st.i.slice(0,st.i.lastIndexOf('.')+1):''; const arr=at[key]||top;
    if(st.k==='talk'){ const o={talk:st.who,lines:st.lines.map(l=>l.t)}; arr.push(o); }
    else arr.push({act:st.d||null,op:st.op});
  }
  return top;
}
function view(id){ const sc=IX.scenes[id]; return seApply(id,synth(sc),stateOf(id)||{},{show:true}); }
const LN={}; // ref -> index line (per scene id), built on first use
function lineOf(id,ref){ if(!LN[id]){ LN[id]={}; for(const st of IX.scenes[id].steps) if(st.k==='talk') for(const ln of st.lines) LN[id][ln.ref]=Object.assign({who:st.who,vid:st.vid},ln); } return LN[id][ref]||null; }
function flat(arr,depth,out){ out=out||[]; for(const o of arr){ if(o.talk!==undefined||o.beat!==undefined||o.act!==undefined) out.push({o,depth}); else if(o.__grp){ out.push({grp:o,depth}); for(const k of ['all','seq','then','else']) if(o[k]){ if(k==='then'||k==='else') out.push({sub:k==='then'?'If this happens':'Otherwise',depth:depth+1}); flat(o[k],depth+1,out); } } } return out; }
function faceId(name){ return String(name||'').toLowerCase().replace(/[^a-z0-9]/g,''); }
function face(id,mood){ return 'portraits/emo/'+faceId(id)+'-'+mood+'.webp'; }
function talkImg(id,t){ return 'portraits/talk/pose/'+faceId(id)+'-'+t+'.webp'; }
function words(s){ return s.split(/(\s+)/); }

// ---------- plain text for Copy ----------
function sceneText(id,expr){
  const sc=IX.scenes[id], st=stateOf(id)||{}; const out=[];
  out.push('Scene: '+sc.title+(sc.map?'  ('+sc.map+')':''));
  const who=sc.cast.filter(Boolean); if(who.length) out.push('Who is there: '+who.join(', ')+'.');
  const gs=groups(id);
  for(const g of gs) for(const r of g.rows){
    if(r===g.rows[0]&&gs.length>1) out.push('\n-- '+g.n+'. '+g.title+' --');
    if(r.sub){ out.push('['+r.sub+':]'); continue; }
    if(r.grp) continue;
    const o=r.o;
    if(o.act!==undefined){ if(o.act) out.push(o.act); continue; }
    if(o.beat!==undefined){ if(expr) out.push('[A silent beat, '+o.wait+' seconds.]'); continue; }
    if(o.rm) continue;
    const ref=o.refs[0], e=(st.lines&&st.lines[ref])||(st.ins||[]).find(x=>x.uid===ref)||{}, ln=lineOf(id,ref);
    let head=o.talk.toUpperCase();
    if(expr){ const mood=e.mood||(ln&&ln.mood), talk=e.talk||(ln&&ln.talk); const bits=[]; if(mood) bits.push(mood); else if(talk) bits.push(TALKS.find(t=>t[0]===talk)[1].toLowerCase()); if(bits.length) head+=' ('+bits.join(', ')+')'; }
    if(expr&&e.pre) out.push('[Pause '+e.pre+' seconds.]');
    out.push(head+': '+o.lines[0]);
    if(expr){ const rs=e.react||(ln&&ln.react&&ln.react.map(x=>[x[0],x[1],x[3]]))||[]; for(const x of rs) out.push('['+x[0]+' reacts: '+x[1]+(x[2]?', on "'+x[2]+'"':'')+'.]'); }
    if(expr&&e.post) out.push('[Pause '+e.post+' seconds.]');
  }
  return out.join('\n');
}
function chapterText(n,expr){ const c=IX.chapters.find(c=>String(c.n)===String(n)); const t=[(c.n==='ns'?'':'Chapter '+c.n+': ')+c.title]; for(const id of c.scenes) t.push('\n'+sceneText(id,expr)); return t.join('\n'); }
async function copyOut(text,label){
  try{ await navigator.clipboard.writeText(text); toast('Copied '+label+' ('+text.split('\n').length.toLocaleString()+' lines of text).'); return; }catch(e){}
  try{ const f=new File([text],'script.txt',{type:'text/plain'}); if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:label}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); toast('Copied '+label+'.'); }catch(e){ toast('Could not copy. Use the Share option or try a smaller part.'); } ta.remove();
}

// ---------- rendering ----------
const SPK_NOTE=(t)=>{ const w=[]; if(/[—–]/.test(t)) w.push('No em dashes in game text.'); if(/\b(I am|do not|does not|did not|is not|are not|cannot|can not|will not|it is|that is|I will|I have|we are|you are|let us)\b/.test(t)) w.push('Game dialogue uses contractions (I\'m, it\'s, don\'t).'); return w; };
function matches(id){ if(!Q) return true; const sc=IX.scenes[id]; if(sc.title.toLowerCase().includes(Q)) return true; for(const st of sc.steps) if(st.k==='talk'){ if(st.who.toLowerCase().includes(Q)) return true; for(const l of st.lines) if(l.t.toLowerCase().includes(Q)) return true; } return false; }
function render(){
  for(const k of Object.keys(GC)) delete GC[k];
  const root=$('list'); let h=''; let nEd=0; for(const id of Object.keys(DRAFT.scenes)) nEd+=editCount(id);
  renderChips();
  $('sum').textContent=IX.chapters.reduce((n,c)=>n+c.scenes.length,0)+' scenes, '+Object.values(IX.scenes).reduce((n,s)=>n+s.steps.filter(x=>x.k==='talk').reduce((m,x)=>m+x.lines.length,0),0).toLocaleString()+' lines. '+(draftCount()?draftCount()+' scene'+(draftCount()>1?'s':'')+' with unsent changes.':'No unsent changes.');
  const pc=pendingCount(); $('bSend').textContent=pc?'Send to Claude ('+pc+')':'Send to Claude';
  const auto=FILTER!=='all'&&FILTER!=='none';
  for(const c of IX.chapters){
    const ids=c.scenes.filter(id=>matches(id)&&(FILTER==='all'||lightGroups(id).some(g=>g.vis))); if(!ids.length) continue;
    const open=OPENCH.has(String(c.n))||!!Q||auto; const ne=c.scenes.reduce((n,id)=>n+editCount(id),0);
    h+='<section class="chap"><div class="hd"><div class="t" data-ch="'+c.n+'">'+(c.n==='ns'?'':'Chapter '+c.n+': ')+esc(c.title)+'<span class="n">'+ids.length+' scenes · '+countsText(c.scenes)+(ne?' <span class="badge">'+ne+' edited</span>':'')+'</span></div>'
      +'<button class="small" data-copych="'+c.n+'">Copy</button></div>';
    if(open) for(const id of ids) h+=sceneHtml(id);
    h+='</section>';
  }
  root.innerHTML=h||'<div class="empty">Nothing matches.</div>';
  $('selbar').style.display=SELMODE?'flex':'none'; $('selN').textContent=SEL.size+' ticked';
  for(const ta of root.querySelectorAll('textarea.tx')) grow(ta);
}
function grow(ta){ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; }
function sceneHtml(id){
  const sc=IX.scenes[id], n=editCount(id), open=OPEN.has(id)||!!Q||(FILTER!=='all'&&FILTER!=='none');
  const chk=SELMODE?'<input type="checkbox" class="chk" data-selscene="'+id+'"'+(SEL.has('s:'+id)?' checked':'')+'>':'';
  let h='<div class="scene" id="sc-'+id+'"><div class="hd">'+chk+'<div class="t" data-scene="'+id+'">'+esc(sc.title)+(n?'<span class="badge">'+n+' edited</span>':'')+'<small>'+esc(id)+(sc.map?' · '+esc(sc.map):'')+' · '+countsText([id])+'</small></div>'
    +'<button class="small" data-copysc="'+id+'">Copy</button><button class="small purple" data-play="'+id+'">Play</button></div>';
  if(open){
    h+='<div class="stage"><img loading="lazy" alt="" src="art/script-stage/'+id+'.webp" onerror="this.parentNode.style.display=\'none\'"></div>';
    h+='<div class="who">Who is there: '+esc(sc.cast.join(', ')||'nobody listed')+(sc.recipe.from==='none'?' · <span class="warn">No working Play recipe yet for this scene.</span>':'')+'</div>';
    h+='<div class="lines">'+convosHtml(id)+'</div>';

// ---------- editing actions ----------
function parseKey(k){ const i=k.indexOf('|'); return [k.slice(0,i),k.slice(i+1)]; }
function lineState(id,ref,create){ const s=mut(id); const ins=s.ins.find(x=>x.uid===ref); if(ins) return ins; if(create) return s.lines[ref]||(s.lines[ref]={}); return s.lines[ref]||{}; }
function setTo(id,ref,text){ const ln=lineOf(id,ref); const s=mut(id); const ins=s.ins.find(x=>x.uid===ref); if(ins){ ins.text=text; } else { const e=lineState(id,ref,true); if(text===ln.t) delete e.to; else e.to=text; } tidy(id); }
function newUid(){ return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
function addIns(id,afterRef,x){ const s=ensureOrder(id); const uid=newUid(); const rec=Object.assign({uid},x); s.ins.push(rec); const k=afterRef?s.order.indexOf(afterRef):-1; s.order.splice(k+1,0,uid); tidy(id); return uid; }
function visibleOrder(id){ // refs and uids in the order they show, skipping removed lines
  const rows=flat(view(id),0,[]); const r=[]; for(const x of rows) if(x.o&&(x.o.refs||x.o.beat!==undefined)&&!x.o.rm) r.push({ref:x.o.refs?x.o.refs[0]:x.o.beat,depth:x.depth}); return r;
}
function move(id,ref,dir){
  const s=ensureOrder(id); const vis=visibleOrder(id); const i=vis.findIndex(v=>v.ref===ref); const j=i+(dir==='up'?-1:1);
  if(i<0||j<0||j>=vis.length||vis[j].depth!==vis[i].depth){ toast('That is as far as it goes inside this part of the scene.'); return; }
  const a=s.order.indexOf(ref), b=s.order.indexOf(vis[j].ref); if(a<0||b<0) return;
  s.order[a]=vis[j].ref; s.order[b]=ref; tidy(id);
}
function removeLine(id,ref){ const s=mut(id); const k=s.ins.findIndex(x=>x.uid===ref); if(k>=0){ s.ins.splice(k,1); if(s.order){ const q=s.order.indexOf(ref); if(q>=0) s.order.splice(q,1); } } else lineState(id,ref,true).rm=1; tidy(id); }
function undoLine(id,ref){ const s=mut(id); delete s.lines[ref]; tidy(id); }
function setField(id,ref,k,v){ const s=mut(id); const ins=s.ins.find(x=>x.uid===ref); const e=ins||lineState(id,ref,true); if(v===undefined||v===''||v===null) delete e[k]; else e[k]=v; tidy(id); }
function curReact(id,ref){ const ln=lineOf(id,ref); const s=mut(id); const ins=s.ins.find(x=>x.uid===ref); const e=ins||s.lines[ref]||{}; if(e.react) return e.react; return ln&&ln.react?ln.react.map(x=>[x[0],x[1],x[3]]):[]; }
function cueFor(text,j){ // the shortest words ending at the tapped word that the game finds first at that spot (tools/reaction-apply.py uses text.find)
  const ws=words(text), clean=x=>x.replace(/[.,!?;:"\u201c\u201d]+$/,'').replace(/^["\u201c]+/,'');
  const starts=[]; let off=0; for(const w of ws){ starts.push(off); off+=w.length; }
  const idx=[]; ws.forEach((w,q)=>{ if(!/^\s+$/.test(w)) idx.push(q); });
  const my=idx.indexOf(j);
  for(let n=0;n<=my;n++){ const from=idx[my-n]; const raw=ws.slice(from,j+1).join(''); const lead=raw.length-raw.replace(/^["\u201c]+/,'').length; const ph=clean(raw); if(text.indexOf(ph)===starts[from]+lead) return ph; }
  return clean(ws[j]);
}

function textOf(id,ref){ const rows=flat(view(id),0,[]); const r=rows.find(x=>x.o&&x.o.refs&&x.o.refs[0]===ref); return r?r.o.lines[0]:''; }

$('bCopySel').onclick=()=>{
  if(!SEL.size) return toast('Tick a scene or a line first.');
  const parts=[]; const sceneIds=new Set(); for(const k of SEL) if(k.startsWith('s:')) sceneIds.add(k.slice(2));
  for(const c of IX.chapters) for(const id of c.scenes){
    if(sceneIds.has(id)){ parts.push(sceneText(id,FMT==='expr')); continue; }
    const lines=[...SEL].filter(k=>k.startsWith('l:'+id+'|')); if(!lines.length) continue;
    const refs=new Set(lines.map(k=>k.slice(('l:'+id+'|').length))); const expr=FMT==='expr'; const out=['Scene: '+IX.scenes[id].title];
    for(const r of flat(view(id),0,[])){ const o=r.o; if(!o||!o.refs||o.rm||!refs.has(o.refs[0])) continue; out.push(o.talk.toUpperCase()+': '+o.lines[0]); }
    parts.push(out.join('\n'));
  }
  copyOut(parts.join('\n\n'),'what you ticked');
};

function findSugg(id,src,key){ if(src==='paste'){ const x=((DRAFT.sugg||{})[id]||{})[key]; return x?Object.assign({key,src},x):null; } const L=suggFor(id,key.slice(id.length+1)); return L.find(x=>x.src==='claude'&&x.key===key)||null; }

// ---------- packets ----------

function leadIn(id,g){ const gs=groups(id), out=[]; const before=[]; for(const h of gs){ if(h===g) break; for(const r of h.rows) if(r.o&&r.o.refs&&!r.o.rm) before.push(r.o.talk.toUpperCase()+': '+r.o.lines[0]); }

function speakerNote(n){ return BRIEF.speakers[n]||BRIEF.speakers[n.replace(/^The /,'')]||('a side character or monster: '+(BRIEF.speakers.Monster||'keep the voice these lines already have.')); }

function pasteResult(R){
  if(!R.n&&!R.bad.length){ sheet('<h3 style="margin-top:0">Nothing placed</h3><div>'+esc(R.msg||(R.same?'Every line came back unchanged.':'No changed lines were found.'))+'</div><div class="pr" style="margin-top:10px"><button class="ghost" data-close="1">Close</button></div>'); return; }
  for(const k of R.placed||[]){ const id=k.slice(0,k.indexOf('|')); OPEN.add(id); OPENCH.add(String(IX.scenes[id].chapter)); }
  let h='<h3 style="margin-top:0">'+R.n+' suggestion'+(R.n===1?'':'s')+' placed</h3><div class="hint">They show under each line with Accept and Reject.'+(R.same?' '+R.same+' came back unchanged.':'')+'</div>';
  if(R.bad.length){ window.__bad=R.bad.join('\n'); h+='<h4 class="hint" style="margin-top:12px">Could not place these</h4><div class="panel" style="white-space:pre-wrap;font-size:14px">'+esc(R.bad.join('\n'))+'</div><div class="pr"><button data-copybad="1">Copy them</button></div>'; }
  h+='<div class="pr" style="margin-top:10px"><button class="gold" data-gotofirst="'+esc((R.placed||[])[0]||'')+'">Show me</button><button class="ghost" data-close="1">Close</button></div>';
  render(); sheet(h);
}
// ---------- conversation containers ----------
function convosHtml(id){
  const gs=groups(id); let h=''; let hidden=0;
  for(const g of gs){
    if(!g.vis){ hidden++; continue; }
    const ck=esc(id+'|'+g.cid), stt=g.st, many=gs.length>1;
    const chk=SELMODE?'<input type="checkbox" class="chk" data-selcv="'+ck+'"'+(SEL.has('c:'+id+'|'+g.cid)?' checked':'')+'>':'';
    const nS=g.rows.reduce((n,r)=>n+(r.o&&r.o.refs?suggFor(id,r.o.refs[0]).length:0),0);
    h+='<div class="cv" id="cv-'+esc(g.cid.replace(/[^\w-]/g,'_'))+'"><div class="cvh">'+chk+'<div class="t" data-cvedit="'+ck+'">'+(many?g.n+'. ':'')+esc(g.title)+'<small class="'+(g.purpose?'':'miss')+'">'+esc(g.purpose||'Purpose not written yet')+'</small></div><button class="st '+stt+'" data-cvst="'+ck+'">'+STN[stt]+'</button></div>';
    h+='<div class="cvb"><button class="small" data-cvnote="'+ck+'">Note</button>'+(stt==='lock'?'':'<button class="small purple" data-cvshop="'+ck+'">Workshop</button><button class="small" data-cvpaste="'+ck+'">Paste back</button>')
      +(nS?'<button class="small gold" data-cvaccall="'+ck+'">Accept all</button><button class="small ghost" data-cvrejall="'+ck+'">Reject all</button>':'')
      +(g.n>1?'<button class="small ghost" data-cvmerge="'+ck+'">Merge with the one above</button>':'')+'</div>';
    if(g.rv.note) h+='<div class="note" data-cvnote="'+ck+'">'+esc(g.rv.note)+'</div>';
    for(const r of g.rows){
      const ind=r.depth?' ind':'';
      if(r.grp) continue;
      if(r.sub){ h+='<div class="grp" style="margin-left:'+(r.depth*14)+'px">'+r.sub+'</div>'; continue; }
      const o=r.o;
      if(o.act!==undefined){ if(o.act) h+='<div class="act" style="margin-left:'+(r.depth*14)+'px">'+esc(o.act)+'</div>'; continue; }
      if(o.beat!==undefined){ h+=beatHtml(id,o,r); continue; }
      h+=rowHtml(id,o,r,null,0)+suggHtml(id,o.refs[0],g);
    }
    h+='</div>';
  }
  if(hidden) h+='<div class="cvhid">'+hidden+' other conversation'+(hidden===1?' is':'s are')+' hidden by the filter.</div>';
  return h||'<div class="empty">No lines.</div>';
}
function groupByKey(k){ const id=k.slice(0,k.indexOf('|')), cid=k.slice(k.indexOf('|')+1); return {id,cid,g:groups(id).find(g=>g.cid===cid)}; }
function stSheet(k){ const {g}=groupByKey(k);
  sheet('<h3 style="margin-top:0">'+esc(g.title)+'</h3>'+STS.map(x=>'<button class="stbtn'+(g.st===x[0]?' on':'')+'" data-stpick="'+esc(k)+'|'+x[0]+'">'+x[1]+'<small>'+x[2]+'</small></button>').join('')+'<button class="ghost" data-close="1">Cancel</button>'); }
function noteSheet(k){ const {g}=groupByKey(k);
  sheet('<h3 style="margin-top:0">Note: '+esc(g.title)+'</h3><div class="hint">In your words. It travels in the Workshop packet and with Send to Claude.</div><textarea id="cvnote" style="margin-top:8px;min-height:120px">'+esc(g.rv.note||'')+'</textarea><div class="pr" style="margin-top:8px"><button class="gold" data-notesave="'+esc(k)+'">Save</button><button class="ghost" data-close="1">Cancel</button></div>'); }
function editSheet(k){ const {g}=groupByKey(k);
  sheet('<h3 style="margin-top:0">Title and purpose</h3><h4 class="hint">Title</h4><input type="search" id="cvtitle" value="'+esc(g.title)+'"><h4 class="hint">Purpose (what this exchange has to do in the story)</h4><textarea id="cvpurpose">'+esc(g.purpose)+'</textarea>'
    +'<div class="pr" style="margin-top:8px"><button class="gold" data-tpsave="'+esc(k)+'">Save</button><button class="small" data-copycv="'+esc(k)+'">Copy this conversation</button><button class="ghost" data-close="1">Cancel</button></div>'); }
function convoText(id,g){ const out=['-- '+g.title+' --']; for(const r of g.rows){ const o=r.o; if(!o) continue; if(o.act) out.push(o.act); else if(o.refs&&!o.rm) out.push(o.talk.toUpperCase()+': '+o.lines[0]); } return out.join('\n'); }
document.addEventListener('click',ev=>{
  const t=ev.target.closest('[data-filter],[data-cvst],[data-stpick],[data-cvnote],[data-notesave],[data-cvedit],[data-tpsave],[data-copycv],[data-cvmerge],[data-cvsplit],[data-cvshop],[data-cvpaste],[data-pbgo],[data-pbclip],[data-copybad],[data-gotofirst],[data-sga],[data-sgr],[data-cvaccall],[data-cvrejall]');
  if(!t) return; const d=t.dataset;
  if(d.filter){ FILTER=d.filter; bump(); render(); window.scrollTo(0,0); return; }
  if(d.cvst){ stSheet(d.cvst); return; }
  if(d.stpick){ const a=d.stpick.split('|'), st=a.pop(), k=a.join('|'); const {cid}=groupByKey(k); rvSet(cid,'st',st==='none'?'none':st); closeSheet(); bump(); render(); return; }
  if(d.cvnote){ noteSheet(d.cvnote); return; }
  if(d.notesave){ const {cid}=groupByKey(d.notesave); rvSet(cid,'note',$('cvnote').value.trim()); closeSheet(); bump(); render(); return; }
  if(d.cvedit){ editSheet(d.cvedit); return; }
  if(d.tpsave){ const {id,cid,g}=groupByKey(d.tpsave); const c=g.c; const ti=$('cvtitle').value.trim(), pu=$('cvpurpose').value.trim();
    const autoT=c.u?autoTitle(id,g.rows):c.title; rvSet(cid,'title',ti&&ti!==autoT?ti:''); rvSet(cid,'purpose',pu&&pu!==(c.purpose||'')?pu:''); closeSheet(); bump(); render(); return; }
  if(d.copycv){ const {id,g}=groupByKey(d.copycv); copyOut(convoText(id,g),'the conversation'); return; }
  if(d.cvmerge){ const {id,g}=groupByKey(d.cvmerge); const cv=cvMut(id); if(g.c.u) cv.split=cv.split.filter(r=>r!==g.c.ref); else if(!cv.merge.includes(g.cid)) cv.merge.push(g.cid); saveDraft(); bump(); render(); toast('Merged with the conversation above.'); return; }
  if(d.cvsplit){ const [id,ref]=parseKey(d.cvsplit); const gs=groups(id); if(gs[0].rows.find(r=>r.o&&r.o.refs)&&gs[0].rows.find(r=>r.o&&r.o.refs).o.refs[0]===ref) return toast('This line already starts the first conversation.');
    const ix=(IX.scenes[id].convos||[]).find(c=>c.ref===ref); const cv=cvMut(id); if(ix){ cv.merge=cv.merge.filter(x=>x!==ix.id); } else if(!cv.split.includes(ref)) cv.split.push(ref); else return toast('A conversation already starts here.');
    saveDraft(); bump(); PANEL.delete(d.cvsplit); render(); toast('New conversation starts at this line.'); return; }
  if(d.cvshop){ const {id,g}=groupByKey(d.cvshop); workshop([{id,g}],'W '+id+' '+g.n); return; }
  if(d.cvpaste){ const {id,cid}=groupByKey(d.cvpaste); pasteSheet({id,cid}); return; }
  if(d.pbclip){ (async()=>{ try{ $('pbx').value=await navigator.clipboard.readText(); }catch(e){ toast('This phone would not read the clipboard. Long-press the box and choose Paste.'); } })(); return; }
  if(d.pbgo){ const R=placeReply($('pbx').value,window.__pbctx); closeSheet(); pasteResult(R); return; }
  if(d.copybad){ copyOut(window.__bad||'','the lines that could not be placed'); return; }
  if(d.gotofirst!==undefined){ closeSheet(); const k=d.gotofirst; if(!k) return; const id=k.slice(0,k.indexOf('|')), cid=k.slice(k.indexOf('|')+1); render(); const el=document.getElementById('cv-'+cid.replace(/[^\w-]/g,'_')); if(el) el.scrollIntoView(); return; }
  if(d.sga||d.sgr){ const a=(d.sga||d.sgr).split('|'); const j=d.sga?+a.pop():0; const id=a[0], src=a[1], key=a.slice(2).join('|'); const x=findSugg(id,src,key); if(!x) return render();
    if(d.sgr){ dropSugg(id,x,'r'); render(); return; } acceptSugg(id,x,j,()=>render()); return; }
  if(d.cvaccall||d.cvrejall){ const {id,g}=groupByKey(d.cvaccall||d.cvrejall); const refs=g.rows.filter(r=>r.o&&r.o.refs).map(r=>r.o.refs[0]); let n=0;
    for(const ref of refs) for(const x of suggFor(id,ref)){ if(d.cvrejall){ dropSugg(id,x,'r'); n++; continue; } if(x.kind==='add'&&!(x.who&&IX.scenes[id].cast.some(c=>c.toLowerCase()===String(x.who).toLowerCase()))) continue; acceptSugg(id,x,0,null); n++; }
    bump(); render(); toast((d.cvaccall?'Accepted ':'Rejected ')+n+'.'+(d.cvaccall?' Lines with several options took option 1.':'')); return; }
});
document.addEventListener('change',ev=>{ const t=ev.target, d=t.dataset||{}; if(d.selcv===undefined) return; const k='c:'+d.selcv; t.checked?SEL.add(k):SEL.delete(k); $('selN').textContent=SEL.size+' ticked'; });
$('bShopSel').onclick=()=>{ const items=[]; for(const c of IX.chapters) for(const id of c.scenes){ if(SEL.has('s:'+id)){ for(const g of groups(id)) items.push({id,g}); continue; } for(const g of groups(id)) if(SEL.has('c:'+id+'|'+g.cid)) items.push({id,g}); }
  if(!items.length) return toast('Tick a conversation or a scene first.'); DRAFT.packetN=(DRAFT.packetN||0)+1; workshop(items,'W set '+DRAFT.packetN); };
$('bPaste').onclick=()=>pasteSheet(null);
function pendingCount(){ return draftCount()+Object.keys(DRAFT.review||{}).length+Object.keys(DRAFT.cv||{}).length+Object.keys(DRAFT.res||{}).length; }
// ---------- Play ----------
function playScene(id){
  const sc=IX.scenes[id];
  if(sc.recipe.from==='none'||!sc.recipe.map){ toast('This scene has no working Play recipe yet. Ask Claude to add one.',4500); return; }
  try{ localStorage.setItem('aot-script-play',JSON.stringify({id,recipe:sc.recipe})); }catch(e){ toast('This phone would not start Play.'); return; }
  location.href=new URL('index.html',location.href).href;
}
// ---------- Send to Claude ----------
// Writes up to three files on main with Tom's GitHub token: data/script-edits.json (line edits, as before), data/script-review.json (statuses, notes,
// titles, purposes, Merge and Split, and which Claude suggestions were accepted or rejected; merged, never replaced) and data/script-suggestions.json
// (the accepted and rejected suggestions are taken out). With no token the phone shares one file, script-send.json, holding all of it.
const TOKEN='aot-gh-token',REPO='trivituso81/adventures-of-tom',PATH='data/script-edits.json';
const b64t=s=>btoa(unescape(encodeURIComponent(s))), t64=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
async function ghGetFile(tok,path,empty){ const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path+'?ref=main&t='+Date.now(),{cache:'no-store',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json'}}); if(r.status===404) return {sha:null,json:empty()}; if(!r.ok) throw new Error('GitHub '+r.status); const j=await r.json(); let cur=empty(); try{ cur=JSON.parse(t64(j.content||''))||empty(); }catch(e){} return {sha:j.sha,json:cur}; }
async function ghPutFile(tok,path,build,msg){ for(let tries=0;;tries++){ const cur=await ghGetFile(tok,path,()=>({})); const next=build(cur.json);
    const body={message:msg,content:b64t(JSON.stringify(next,null,1)+'\n'),branch:'main'}; if(cur.sha) body.sha=cur.sha;
    const r=await fetch('https://api.github.com/repos/'+REPO+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
    if(r.status===409&&tries<3) continue; if(!r.ok) throw new Error('GitHub '+r.status); return next; } }
function mergeReview(cur,rv,cv,res){ const out={made:new Date().toISOString(),convos:Object.assign({},cur.convos||{}),splits:Object.assign({},cur.splits||{}),resolved:Object.assign({},cur.resolved||{})};
  for(const [cid,e] of Object.entries(rv)){ const m=Object.assign({},out.convos[cid]||{},e); for(const k of Object.keys(m)) if(m[k]===''||(k==='st'&&m[k]==='none')) delete m[k]; if(Object.keys(m).length) out.convos[cid]=m; else delete out.convos[cid]; }
  for(const [sid,e] of Object.entries(cv)){ if((e.split||[]).length||(e.merge||[]).length) out.splits[sid]=e; else delete out.splits[sid]; }
  Object.assign(out.resolved,res); return out; }
$('bSend').onclick=async()=>{
  if(!pendingCount()) return toast('Nothing to send. Change a line, a status or a note first.');
  const tok=(()=>{ try{ return localStorage.getItem(TOKEN)||''; }catch(e){ return ''; } })();
  const mine=JSON.parse(JSON.stringify(DRAFT.scenes)), rv=JSON.parse(JSON.stringify(DRAFT.review||{})), cv=JSON.parse(JSON.stringify(DRAFT.cv||{})), res=JSON.parse(JSON.stringify(DRAFT.res||{}));
  const clear=()=>{ for(const id of Object.keys(mine)) delete DRAFT.scenes[id]; for(const k of Object.keys(rv)) delete DRAFT.review[k]; for(const k of Object.keys(cv)) delete DRAFT.cv[k]; for(const k of Object.keys(res)) delete DRAFT.res[k]; saveDraft(); };
  if(!tok){ // no token on this phone: share the file instead
    const text=JSON.stringify({made:new Date().toISOString(),edits:{scenes:Object.assign({},SENT.scenes,mine)},review:mergeReview(REVIEW,rv,cv,res)},null,1);
    const f=new File([text],'script-send.json',{type:'application/json'});
    try{ if(navigator.canShare&&navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:'Script edits'}); toast('Shared. Send that file to Claude with "Apply my script edits".',5000); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(f); a.download='script-send.json'; document.body.appendChild(a); a.click(); a.remove(); toast('Saved as a file. Send it to Claude with "Apply my script edits".',5000); return;
  }
  $('bSend').disabled=true; $('bSend').textContent='Sending...';
  try{
    if(Object.keys(mine).length){ const out=await ghPutFile(tok,PATH,cur=>({made:new Date().toISOString(),scenes:Object.assign({},cur.scenes||{},mine)}),'Script edits from Tom: '+Object.keys(mine).join(', ').slice(0,120)); SENT.scenes=out.scenes; }
    if(Object.keys(rv).length||Object.keys(cv).length||Object.keys(res).length){
      REVIEW=await ghPutFile(tok,'data/script-review.json',cur=>mergeReview(cur,rv,cv,res),'Script review from Tom: '+(Object.keys(rv).length+Object.keys(cv).length)+' conversations');
      if(Object.keys(res).length) SUGG=await ghPutFile(tok,'data/script-suggestions.json',cur=>{ const it=Object.assign({},cur.items||{}); for(const k of Object.keys(res)) delete it[k]; return {made:cur.made||'',items:it}; },'Script suggestions: '+Object.keys(res).length+' answered by Tom');
    }
    clear(); bump();
    toast(Object.keys(mine).length?'Sent. In the next Claude conversation say: Apply my script edits':'Sent. In the next Claude conversation say: Workshop my flagged conversations',6000);
  }catch(e){ toast('Could not send ('+(e.message||e)+'). Your changes are still saved on this phone.',6000); }
  $('bSend').disabled=false; render();
};
// ---------- start ----------
(async()=>{
  try{ DRAFT=JSON.parse(localStorage.getItem('aot-script-draft')||'null')||{scenes:{}}; DRAFT.scenes=DRAFT.scenes||{}; }catch(e){ DRAFT={scenes:{}}; }
  try{ const r=await fetch('data/script-edits.json?'+Date.now(),{cache:'no-store'}); if(r.ok){ const j=await r.json(); SENT={scenes:(j&&j.scenes)||{}}; } }catch(e){}
  const getJ=async(u,dflt)=>{ try{ const r=await fetch(u+'?'+Date.now(),{cache:'no-store'}); if(r.ok) return await r.json(); }catch(e){} return dflt; };
  { const j=await getJ('data/script-review.json',{}); REVIEW={convos:j.convos||{},splits:j.splits||{},resolved:j.resolved||{}}; }
  { const j=await getJ('data/script-suggestions.json',{}); SUGG={items:j.items||{}}; }
  { const j=await getJ('data/script-brief.json',{}); BRIEF={brief:j.brief||'',speakers:j.speakers||{},pairs:j.pairs||[]}; }
  try{ const r=await fetch('data/script-index.json?'+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status); IX=await r.json(); }
  catch(e){ $('list').innerHTML='<div class="empty err">Could not load the script ('+esc(e.message||e)+'). Check the connection and reload.</div>'; return; }
  const h=(location.hash||'').slice(1); if(h&&IX.scenes[h]){ OPENCH.add(String(IX.scenes[h].chapter)); OPEN.add(h); }
  render();
  if(h&&IX.scenes[h]) setTimeout(()=>{ const el=$('sc-'+h); if(el) el.scrollIntoView(); },60);
  window.__SCRIPT_READY=true;
})();
</script>
